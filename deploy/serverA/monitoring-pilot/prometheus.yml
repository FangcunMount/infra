global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ['127.0.0.1:9090']
  - job_name: rocketmq
    scrape_timeout: 10s
    static_configs:
      - targets: ['100.118.164.39:5557']
        labels:
          host: serverD
          component: rocketmq
  - job_name: cloud
    scrape_timeout: 10s
    file_sd_configs:
      - files: ['/etc/prometheus/targets/serverA.json', '/etc/prometheus/targets/serverD.json']
        refresh_interval: 15s
