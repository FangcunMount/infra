# ============================================================================
# serverA 基础设施栈 (腾讯云 4C8G)
# ============================================================================
# 服务清单：
#   - 网关：Nginx
# 依赖：
#   - 外部网络：infra-network
#   - 配置文件：compose/env/prod/serverA.env
# 注意：
#   - serverA 同时承载 qs-apiserver、qs-collection-server，但业务容器由对应项目部署
#   - MySQL / Redis 使用云托管服务
# ============================================================================

services:
  # ============================================================================
  # 跨云 Worker -> 阿里云 RDS 私网代理（仅 infra-network）
  # ============================================================================

  mysql-rds-proxy:
    # Only the old Alibaba node can use this rollback profile. The Tencent
    # production uses public MySQL TLS; this profile is only for explicit rollback.
    profiles: [mysql-proxy-rollback]
    image: nginx:1.27
    container_name: mysql-rds-proxy
    restart: "no"
    mem_limit: 64m
    cpus: "0.1"
    environment:
      MYSQL_HOST: ${MYSQL_HOST:?MYSQL_HOST is required}
      MYSQL_PORT: ${MYSQL_PORT:-3306}
      PROXY_BIND_PORT: ${MYSQL_RDS_PROXY_PORT:-3306}
      NGINX_ENVSUBST_OUTPUT_DIR: /etc/nginx
      NGINX_ENVSUBST_FILTER: MYSQL_HOST|MYSQL_PORT|PROXY_BIND_PORT
    volumes:
      - ../../components/mysql-rds-proxy/nginx.conf.template:/etc/nginx/templates/nginx.conf.template:ro
    expose:
      - "3306"
    networks:
      backend:
        aliases:
          - mysql-rds-proxy
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"
    labels:
      - "infra.host=serverA"
      - "infra.category=database-proxy"

  # ============================================================================
  # 网关服务
  # ============================================================================
  
  nginx:
    extends:
      file: ../../components/nginx/docker-compose.yml
      service: nginx
    mem_limit: 128m
    cpus: "0.5"
    env_file:
      - ../../compose/env/prod/serverA.env
    volumes:
      # 覆盖相对路径，指向正确的配置文件位置
      - ../../components/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ../../components/nginx/conf.d:/etc/nginx/conf.d:ro
      - /data/logs/nginx:/data/log/nginx
      - /data/ssl:/data/ssl:ro
      - /data/apps/nginx-configs:/etc/nginx/conf.d/apps:ro
      - /var/www/certbot:/var/www/certbot

networks:
  backend:
    external: true
    name: infra-network
