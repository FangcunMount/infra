# Included within the existing prometheus-route http context during H06.
server {
    listen 19191 ssl;
    server_name _;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_certificate /run/h06-tls/server.crt;
    ssl_certificate_key /run/h06-tls/server.key;
    ssl_client_certificate /run/h06-tls/client-ca.crt;
    ssl_verify_client on;
    ssl_verify_depth 1;

    location ~ ^/(?:-/ready|api/v1/(?:query|query_range|labels|label/[a-zA-Z_][a-zA-Z0-9_]*/values|series|metadata|rules|status/buildinfo))$ {
        limit_except GET { deny all; }
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Connection "";
        proxy_pass http://172.31.251.3:19091;
    }

    location / { return 404; }
}
