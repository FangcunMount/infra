# ============================================================================
# serverD 基础设施栈 (4C4G)
# ============================================================================
# 服务清单：
#   - 消息中间件：nsqlookupd、nsqd、nsqadmin
#   - 可观测性：prometheus、grafana（含 provisioning / dashboards）
#   - 开发工具：sonarqube、sonarqube-db
# 依赖：
#   - 外部网络：infra-network
#   - 配置文件：compose/env/prod/serverD.env
# 注意：
#   - serverD 同时承载 qs-worker、operating、miniblog、qlume，业务容器由对应项目部署
#   - MySQL / Redis 使用云托管服务
# ============================================================================

services:
  nsqlookupd:
    extends:
      file: ../../components/nsq/docker-compose.yml
      service: nsqlookupd
    env_file:
      - ../../compose/env/prod/serverD.env

  nsqd:
    extends:
      file: ../../components/nsq/docker-compose.yml
      service: nsqd
    env_file:
      - ../../compose/env/prod/serverD.env

  nsqadmin:
    extends:
      file: ../../components/nsq/docker-compose.yml
      service: nsqadmin
    env_file:
      - ../../compose/env/prod/serverD.env

  prometheus:
    extends:
      file: ../../components/prometheus/docker-compose.yml
      service: prometheus
    env_file:
      - ../../compose/env/prod/serverD.env

  grafana:
    extends:
      file: ../../components/grafana/docker-compose.yml
      service: grafana
    env_file:
      - ../../compose/env/prod/serverD.env
    depends_on:
      prometheus:
        condition: service_healthy

  sonarqube-db:
    extends:
      file: ../../components/sonarqube/docker-compose.yml
      service: sonarqube-db
    env_file:
      - ../../compose/env/prod/serverD.env

  sonarqube:
    extends:
      file: ../../components/sonarqube/docker-compose.yml
      service: sonarqube
    env_file:
      - ../../compose/env/prod/serverD.env
    depends_on:
      sonarqube-db:
        condition: service_healthy

networks:
  backend:
    external: true
    name: infra-network

volumes:
  prometheus_data:
    name: infra_prometheus_data
    driver: local
  grafana_data:
    name: infra_grafana_data
    driver: local
  sonarqube_db_data:
    name: infra_sonarqube_db_data
    driver: local
  sonarqube_data:
    name: infra_sonarqube_data
    driver: local
  sonarqube_logs:
    name: infra_sonarqube_logs
    driver: local
  sonarqube_extensions:
    name: infra_sonarqube_extensions
    driver: local
