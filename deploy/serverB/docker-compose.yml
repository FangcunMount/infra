# ============================================================================
# serverB 基础设施栈 (2C2G)
# ============================================================================
# 服务清单：
#   - 旧 MySQL RDS 私网代理（仅受控回退，默认不启动）
# 依赖：
#   - 外部网络：infra-network
#   - 配置文件：compose/env/prod/serverB.env
# 注意：
#   - IAM 已迁到 serverA；业务容器由对应项目部署
#   - qs-collection-server 已迁移到 serverA
#   - NSQ 已迁移到 serverD
#   - MySQL / Redis 使用云托管服务
# ============================================================================

services:
  mysql-rds-proxy:
    profiles: [mysql-proxy-rollback]
    image: nginx:1.27
    container_name: mysql-rds-proxy
    restart: "no"
    mem_limit: 64m
    cpus: "0.1"
    environment:
      MYSQL_HOST: ${MYSQL_HOST:?MYSQL_HOST is required}
      MYSQL_PORT: ${MYSQL_PORT:-3306}
      PROXY_BIND_PORT: "3306"
      NGINX_ENVSUBST_OUTPUT_DIR: /etc/nginx
      NGINX_ENVSUBST_FILTER: MYSQL_HOST|MYSQL_PORT|PROXY_BIND_PORT
    volumes:
      - ../../components/mysql-rds-proxy/nginx.conf.template:/etc/nginx/templates/nginx.conf.template:ro
    expose: ["3306"]
    networks:
      backend:
        aliases: [mysql-rds-proxy]
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    security_opt: [no-new-privileges:true]
    logging:
      driver: json-file
      options: {max-size: 20m, max-file: "3"}
    labels:
      - infra.host=serverB
      - infra.category=database-proxy

networks:
  backend:
    external: true
    name: infra-network
