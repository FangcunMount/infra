name: Validate Mac mini monitoring
on:
  pull_request:
    paths: ['components/monitoring/**', 'scripts/monitoring/**', 'deploy/mac-mini/**', 'deploy/serverA/monitoring-route.yml', 'deploy/serverA/monitoring-pilot/**', 'deploy/serverD/**', 'Makefile', '.github/workflows/monitoring.yml']
  push:
    branches: [main]
    paths: ['components/monitoring/**', 'scripts/monitoring/**', 'deploy/mac-mini/**', 'deploy/serverA/monitoring-route.yml', 'deploy/serverA/monitoring-pilot/**', 'deploy/serverD/**', 'Makefile', '.github/workflows/monitoring.yml']
  workflow_dispatch:
    inputs:
      operation:
        type: choice
        options: [validate, assets-dry-run, assets-apply]
        default: validate
      expected_state:
        description: 'Exact state hash from assets-dry-run; required for apply'
        required: false
permissions:
  contents: read
concurrency:
  group: macmini-monitoring-assets
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify replica discovery and shell syntax
        run: |
          python3 -m unittest discover -s scripts/monitoring -p 'test_*.py' -v
          bash -n scripts/monitoring/manage.sh
          make -n monitoring-up monitoring-status
      - name: Verify Prometheus config and rules
        run: |
          mkdir -p /tmp/monitoring-targets
          docker run --rm --entrypoint /bin/promtool \
            -v "$PWD/components/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro" \
            -v "$PWD/components/prometheus/rules:/etc/prometheus/rules:ro" \
            -v /tmp/monitoring-targets:/etc/prometheus/targets:ro \
            prom/prometheus:v2.54.1 check config /etc/prometheus/prometheus.yml
      - name: Verify ServerA pilot Compose and Prometheus config
        run: |
          pilot="$PWD/deploy/serverA/monitoring-pilot"
          docker compose -f "$pilot/compose.yml" config --format json > /tmp/servera-monitoring-pilot.json
          jq -e '
            .services.prometheus as $prometheus |
            $prometheus.platform == "linux/amd64" and $prometheus.pull_policy == "never" and
            $prometheus.read_only == true and ($prometheus.ports // [] | length) == 0 and
            ($prometheus.command | index("--web.listen-address=127.0.0.1:9090")) != null and
            ([ $prometheus.volumes[] | select(.type == "bind" and .read_only == true) | .target ] | sort)
              == ["/etc/prometheus/prometheus.yml", "/etc/prometheus/targets"] and
            .volumes.data.external == true and .volumes.data.name == "qlume-servera-monitoring-pilot-data" and
            .networks.backend.external == true and .networks.backend.name == "infra-network"
          ' /tmp/servera-monitoring-pilot.json
          image=$(jq -er '.services.prometheus.image | select(test("^docker.io/prom/prometheus@sha256:[0-9a-f]{64}$"))' /tmp/servera-monitoring-pilot.json)
          printf '[]\n' > /tmp/monitoring-targets/serverA.json
          printf '[]\n' > /tmp/monitoring-targets/serverD.json
          docker run --rm --platform linux/amd64 --entrypoint /bin/promtool \
            -v "$pilot/prometheus.yml:/etc/prometheus/prometheus.yml:ro" \
            -v /tmp/monitoring-targets:/etc/prometheus/targets:ro \
            "$image" check config /etc/prometheus/prometheus.yml
  release-assets:
    if: github.event_name == 'workflow_dispatch' && inputs.operation != 'validate'
    runs-on:
      group: qlume
      labels: [self-hosted, macOS, ARM64]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Inspect or apply frozen M2 assets on the actual monitoring host
        env:
          OPERATION: ${{ inputs.operation }}
          EXPECTED_STATE: ${{ inputs.expected_state }}
        run: |
          if [ "$OPERATION" = assets-dry-run ]; then
            python3 scripts/monitoring/release_assets.py dry-run
          else
            python3 scripts/monitoring/release_assets.py apply --expected-state "$EXPECTED_STATE"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: monitoring-assets-${{ inputs.operation }}-${{ github.run_id }}
          path: monitoring-assets-receipt.json
          if-no-files-found: error
          retention-days: 90
