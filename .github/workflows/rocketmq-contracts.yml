name: RocketMQ fixture and CI contracts
on:
  pull_request:
    paths: ['components/rocketmq/**', 'scripts/rocketmq/**', '.github/workflows/rocketmq*.yml']
  push:
    branches: [main]
    paths: ['components/rocketmq/**', 'scripts/rocketmq/**', '.github/workflows/rocketmq*.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: rocketmq-contracts-${{ github.ref }}
  cancel-in-progress: true
jobs:
  contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.12.13'
          python-version: '3.13'
      - name: All fixture, naming and dispatch contracts without Docker dependencies
        run: uv run --no-project --with pyyaml==6.0.2 python -m unittest discover -s scripts/rocketmq -p 'test_*.py'
