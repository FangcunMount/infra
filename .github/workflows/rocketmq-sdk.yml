name: RocketMQ public transaction SDK
# AI finalization tools run their own required host gate; shared changes retain this matrix.
on:
  pull_request:
    paths:
      - "components/rocketmq/**"
      - "scripts/rocketmq/**"
      - "!scripts/rocketmq/ai_finalization_*"
      - "!scripts/rocketmq/test_ai_finalization_*"
      - "!scripts/rocketmq/qs_replan_acceptance.py"
      - "!scripts/rocketmq/test_qs_replan_acceptance.py"
      - "!scripts/rocketmq/image_fixtures/readable_replan_test.go"
      - "!scripts/rocketmq/test_readable_ci_policy.py"
      - "!scripts/rocketmq/readable_publish_candidates.py"
      - "!scripts/rocketmq/test_readable_publish_candidates.py"
      - "!scripts/rocketmq/readable_cutover.py"
      - "!scripts/rocketmq/readable_cutover_materials.py"
      - "!scripts/rocketmq/readable_cutover_receipt.py"
      - "!scripts/rocketmq/test_readable_cutover_materials.py"
      - "!scripts/rocketmq/test_readable_cutover_receipt.py"
      - ".github/workflows/rocketmq-sdk.yml"
  workflow_dispatch:
    inputs:
      recovery_audit:
        description: Candidate source post-RPC persistent recovery audit
        type: boolean
        default: false
      sdk_ref:
        description: Exact candidate SDK revision
        type: string
        required: true
        default: 1345266aa0e864c46de5d1e3e3c939dd8002a890
permissions:
  contents: read
env:
  GOTOOLCHAIN: local
concurrency:
  group: rocketmq-public-sdk-${{ github.ref }}
  cancel-in-progress: true
jobs:
  sdk:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - go: '1.25.9'
            python: '3.11'
            mysql: 'mysql:8.0.36'
          - go: '1.25.12'
            python: '3.13'
            mysql: 'mysql:8.4'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/checkout@v6
        with:
          repository: FangcunMount/reliable-messaging
          ref: ${{ inputs.sdk_ref || '1345266aa0e864c46de5d1e3e3c939dd8002a890' }}
          path: .sdk-acceptance
      - name: Verify exact source candidate
        env:
          SDK_REF: ${{ inputs.sdk_ref || '1345266aa0e864c46de5d1e3e3c939dd8002a890' }}
        run: |
          set -euo pipefail
          [[ "$SDK_REF" =~ ^[0-9a-f]{40}$ ]]
          test "$(git -C .sdk-acceptance rev-parse HEAD)" = "$SDK_REF"
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ matrix.go }}
          cache-dependency-path: .sdk-acceptance/go.sum
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.12.13'
          python-version: ${{ matrix.python }}
      - name: Fetch and verify official release archive
        run: bash scripts/rocketmq/fetch-release.sh
      - name: Build exact isolated Broker with fresh PGP proof
        run: docker build --no-cache -t rocketmq-sdk:5.5.1 components/rocketmq
      - name: Required public SDK MySQL, Mongo and cross-language recovery proofs
        env:
          RECOVERY_AUDIT: ${{ inputs.recovery_audit || github.event_name == 'pull_request' }}
        run: |
          set -euo pipefail
          audit_options=()
          if [[ "$RECOVERY_AUDIT" == true ]]; then
            audit_options=(--sdk-recovery-audit)
          fi
          python3 scripts/rocketmq/ci-transactions.py --sdk-api-go --sdk-api-python "${audit_options[@]}" \
            --sdk "$PWD/.sdk-acceptance" --image rocketmq-sdk:5.5.1 --mysql-image '${{ matrix.mysql }}' \
            --report rocketmq-public-sdk.json
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: rocketmq-public-sdk-${{ strategy.job-index }}-${{ github.sha }}
          path: rocketmq-public-sdk.json
          if-no-files-found: error
          retention-days: 14
