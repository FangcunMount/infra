name: RocketMQ QS evaluation original MySQL transaction
on:
  workflow_dispatch:
    inputs:
      qs_ref:
        description: Exact QS evaluation transaction candidate SHA
        type: string
        required: true
        default: d12f1b5cd3b0bd6bdcc77618510622fcc5464674
  pull_request:
    paths: ['scripts/rocketmq/qs_evaluation_acceptance.py', 'scripts/rocketmq/test_qs_evaluation_acceptance.py', 'scripts/rocketmq/ci-transactions.py', '.github/workflows/rocketmq-qs-evaluation.yml']
permissions:
  contents: read
env:
  GOTOOLCHAIN: local
concurrency:
  group: rocketmq-qs-evaluation-${{ github.ref }}
  cancel-in-progress: true
jobs:
  original-mysql-root:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        # QS go.mod requires 1.25.12. The separate SDK workflow retains its
        # own 1.25.9/1.25.12 compatibility matrix.
        go: ['1.25.12']
        mysql: ['mysql:8.0.36', 'mysql:8.4.11']
    steps:
      - uses: actions/checkout@v6
      - uses: actions/checkout@v6
        with:
          repository: FangcunMount/reliable-messaging
          ref: bfaae2b82ee0d1229b8c965fce472cdf5dec486f
          path: .sdk-acceptance
      - uses: actions/checkout@v6
        with:
          repository: FangcunMount/qs-server
          ref: ${{ inputs.qs_ref || 'd12f1b5cd3b0bd6bdcc77618510622fcc5464674' }}
          path: .qs-acceptance
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ matrix.go }}
          cache-dependency-path: .qs-acceptance/go.sum
      - name: Verify candidate and source harness
        env:
          EXPECTED_QS_SHA: ${{ inputs.qs_ref || 'd12f1b5cd3b0bd6bdcc77618510622fcc5464674' }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED_QS_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git -C .qs-acceptance rev-parse HEAD)" = "$EXPECTED_QS_SHA"
          python3 -m unittest discover -s scripts/rocketmq -p 'test_*.py'
      - name: Build verified isolated Broker
        run: |
          set -euo pipefail
          bash scripts/rocketmq/fetch-release.sh
          docker build --no-cache -t rocketmq-qs-evaluation:5.5.1 components/rocketmq
      - name: Required real host original MySQL and Broker
        run: |
          set -euo pipefail
          python3 scripts/rocketmq/ci-transactions.py --sdk "$PWD/.sdk-acceptance" \
            --qs-evaluation-host "$PWD/.qs-acceptance" --image rocketmq-qs-evaluation:5.5.1 \
            --mysql-image "${{ matrix.mysql }}" --report rocketmq-qs-evaluation.json
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: rocketmq-qs-evaluation-${{ strategy.job-index }}-${{ matrix.go }}-${{ github.sha }}
          path: rocketmq-qs-evaluation.json
          if-no-files-found: error
          retention-days: 14
