name: RocketMQ cutover irreversible first-start boundary
on:
  pull_request:
    paths:
      - scripts/rocketmq/start_boundary.py
      - scripts/rocketmq/test_start_boundary.py
      - scripts/rocketmq/cutover_step.py
      - scripts/rocketmq/test_cutover_step.py
      - scripts/rocketmq/ci-cutover-boundary.py
      - .github/workflows/rocketmq-cutover-boundary.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  owned-process-boundary:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Exact source and existing tool regressions
        env:
          EXPECTED_INFRA_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_INFRA_SHA"
          python3 -m unittest discover -s scripts/rocketmq -p 'test_*.py'
      - name: Required owned process boundary evidence
        run: |
          set -euo pipefail
          umask 077
          python3 scripts/rocketmq/ci-cutover-boundary.py
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: cutover-boundary-${{ github.sha }}
          path: cutover-boundary.json
          if-no-files-found: error
          retention-days: 14
