name: M3 MySQL credential boundaries
on:
  pull_request:
    paths:
      - scripts/ops/m3_mysql_credential.py
      - scripts/ops/test_m3_mysql_credential.py
      - scripts/ops/ci_m3_mysql_credential.py
      - .github/workflows/m3-mysql-credential.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  mysql-credential:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: python3 -m unittest discover -s scripts/ops -p test_m3_mysql_credential.py
      - run: python3 -m pip install asyncmy==0.2.14
      - name: Native owned MySQL 8.0.36 with verified TLS
        run: python3 scripts/ops/ci_m3_mysql_credential.py
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: m3-mysql-credential-${{ github.run_id }}
          path: m3-mysql-credential-native.json
          if-no-files-found: error
          retention-days: 30
