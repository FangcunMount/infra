name: RocketMQ readable compatible-route cutover and forward repair
on:
  pull_request:
    paths:
      - scripts/rocketmq/readable_cutover*.py
      - scripts/rocketmq/test_readable_cutover*.py
      - scripts/rocketmq/readable_image_candidates.py
      - scripts/rocketmq/readable_image_start.py
      - scripts/rocketmq/test_readable_image_start.py
      - scripts/rocketmq/five_image_start.py
      - .github/workflows/rocketmq-readable-cutover.yml
  workflow_dispatch:
    inputs:
      candidate_path:
        description: Committed reviewed readable candidate manifest; no production deployment
        type: string
        required: true
      startup_run_id:
        description: Successful independent readable eight-instance startup run
        type: string
        required: true
permissions:
  contents: read
concurrency:
  group: rocketmq-readable-cutover-${{ github.ref }}
  cancel-in-progress: false
jobs:
  contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      CANDIDATE_PATH: ${{ inputs.candidate_path }}
    outputs:
      iam_sha: ${{ steps.candidate.outputs.iam_sha }}
      qs_sha: ${{ steps.candidate.outputs.qs_sha }}
      ai_sha: ${{ steps.candidate.outputs.ai_sha }}
      builder_sha: ${{ steps.candidate.outputs.builder_sha }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Immutable reviewed readable candidate manifest
        if: github.event_name == 'workflow_dispatch'
        id: candidate
        run: |
          python3 - <<'PYOUT'
          import os,sys,re
          from pathlib import Path
          sys.path.insert(0,'scripts/rocketmq')
          from readable_image_candidates import read
          path=os.environ['CANDIDATE_PATH']
          assert re.fullmatch(r'components/rocketmq/readable-image-candidates-[a-z0-9-]+\.json',path)
          value,digest=read(Path(path), Path('components/rocketmq/serverd-routes-readable-v3.json'))
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:
              for role,sha in value['sources'].items(): f.write(role+'_sha='+sha+'\n')
              f.write('builder_sha='+value['builder_sha']+'\n')
          PYOUT
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.12.13'
          python-version: '3.13'
      - name: Exact provenance and no-side-effect fixture protection
        run: |
          set -euo pipefail
          for test in test_readable_cutover_materials.py test_readable_cutover_receipt.py test_start_boundary.py test_readable_image_candidates.py test_readable_image_start.py test_m4_final_image_candidates.py test_m4_final_python_dependencies.py test_m4_image_rebuild.py test_iam_image_start.py test_image_start_provenance.py test_qs_image_pair.py test_qs_consumer_contract.py; do
            uv run --no-project --with pyyaml==6.0.2 python -m unittest discover -s scripts/rocketmq -p "$test"
          done
  eight-instances:
    if: github.event_name == 'workflow_dispatch'
    needs: contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
      actions: read
    env:
      CANDIDATE_PATH: ${{ inputs.candidate_path }}
      GH_TOKEN: ${{ github.token }}
      STARTUP_RUN_ID: ${{ inputs.startup_run_id }}
      GOWORK: 'off'
      GOTOOLCHAIN: local
      IAM_SHA: ${{ needs.contracts.outputs.iam_sha }}
      QS_SHA: ${{ needs.contracts.outputs.qs_sha }}
      AI_SHA: ${{ needs.contracts.outputs.ai_sha }}
      REVIEWED_BUILDER_SHA: ${{ needs.contracts.outputs.builder_sha }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/checkout@v6
        with:
          repository: FangcunMount/iam
          ref: ${{ env.IAM_SHA }}
          path: .five-sources/iam
      - uses: actions/checkout@v6
        with:
          repository: FangcunMount/qs-server
          ref: ${{ env.QS_SHA }}
          path: .five-sources/qs
      - uses: actions/checkout@v6
        with:
          repository: FangcunMount/qs-ai
          ref: ${{ env.AI_SHA }}
          path: .five-sources/ai
      - uses: actions/setup-go@v6
        with:
          go-version: '1.25.12'
          cache-dependency-path: |
            .five-sources/iam/go.sum
            .five-sources/qs/go.sum
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.12.13'
          python-version: '3.13'
      - name: Actual source mount contract before compiling or starting containers
        run: |
          set -euo pipefail
          uv run --no-project --with pyyaml==6.0.2 python - <<'PY'
          from pathlib import Path
          import sys
          sys.path.insert(0,'scripts/rocketmq')
          from m4_image_rebuild import projected_mounts
          value=projected_mounts(Path('.five-sources/iam'),Path('.five-sources/qs'),'m4-owned-check')
          assert len(value['iam'])==len(value['worker'])==3 and not value['collection']
          PY
      - name: Exact successful reviewed build and five archives
        run: |
          set -euo pipefail
          umask 077
          python3 - <<'PYBUILDS'
          import json,os,sys,subprocess
          from pathlib import Path
          sys.path.insert(0,'scripts/rocketmq')
          from readable_image_candidates import read
          value,_=read(Path(os.environ['CANDIDATE_PATH']),Path('components/rocketmq/serverd-routes-readable-v3.json'))
          for run_id in sorted(set(value['image_runs'].values())):
              raw=subprocess.check_output(['gh','api',f'repos/{os.environ["GITHUB_REPOSITORY"]}/actions/runs/{run_id}'])
              run=json.loads(raw)
              assert str(run['id'])==run_id and run['head_sha']==value['builder_sha']==os.environ['REVIEWED_BUILDER_SHA']
              assert run['conclusion']=='success' and run['event']=='workflow_dispatch'
              assert run['path']=='.github/workflows/rocketmq-readable-images.yml'
          PYBUILDS
          mkdir -m 700 .five-candidates
          for target in iam qs-api qs-collection qs-worker ai; do
            IMAGE_RUN_ID="$(python3 -c 'import json,sys;print(json.load(open(sys.argv[2]))["image_runs"][sys.argv[1]])' "$target" "$CANDIDATE_PATH")"
            case "$target" in
              iam) source_sha="$IAM_SHA" ;;
              ai) source_sha="$AI_SHA" ;;
              *) source_sha="$QS_SHA" ;;
            esac
            mkdir -m 700 ".five-candidates/$target"
            gh run download "$IMAGE_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "readable-image-metadata-$target-$source_sha-$IMAGE_RUN_ID" --dir ".five-candidates/$target"
            gh run download "$IMAGE_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "readable-image-archive-$target-$source_sha-$IMAGE_RUN_ID" --dir ".five-candidates/$target"
          done
      - name: Independent successful startup receipt before any owned dependency
        run: |
          set -euo pipefail
          umask 077
          python3 - <<'PYSTART'
          import json,os,re,subprocess,sys
          from pathlib import Path
          sys.path.insert(0,'scripts/rocketmq')
          from readable_image_candidates import read
          from readable_cutover_receipt import read_startup
          run_id=os.environ['STARTUP_RUN_ID']
          assert re.fullmatch('[1-9][0-9]{6,19}',run_id)
          run=json.loads(subprocess.check_output(['gh','api',f'repos/{os.environ["GITHUB_REPOSITORY"]}/actions/runs/{run_id}']))
          assert str(run['id'])==run_id and run['conclusion']=='success' and run['event']=='workflow_dispatch'
          assert run['path']=='.github/workflows/rocketmq-readable-startup.yml'
          attempt=run['run_attempt']
          subprocess.run(['gh','run','download',run_id,'--repo',os.environ['GITHUB_REPOSITORY'],
              '--name',f'readable-eight-instance-startup-{run_id}-{attempt}','--dir','.independent-startup'],check=True)
          candidate,digest=read(Path(os.environ['CANDIDATE_PATH']),Path('components/rocketmq/serverd-routes-readable-v3.json'))
          report,_=read_startup(Path('.independent-startup/readable-eight-instance-startup.json'),candidate,digest)
          assert report['infra_sha']==run['head_sha']
          PYSTART
      - name: Actual Go binding codec before database or Broker containers
        run: |
          set -euo pipefail
          umask 077
          uv run --no-project --with pyyaml==6.0.2 python - <<'PY'
          import json,sys,os,subprocess
          from pathlib import Path
          import yaml
          sys.path.insert(0,'scripts/rocketmq')
          from m4_image_rebuild import api_configuration
          from qs_runtime_configuration import configuration
          from audit_transaction_limit import write_private
          source=Path('.five-sources/qs').resolve()
          root=Path('.m4-codec').resolve();root.mkdir(mode=0o700)
          base=configuration(yaml.safe_load((source/'configs/apiserver.prod.yaml').read_text()),'api','qs_m3_image_codec','synthetic-only','d'*64)
          binding=api_configuration(source,base,'m4-owned-codec')
          write_private(root/'base.json',base);write_private(root/'binding.json',binding)
          d=source/'scripts/testing/m4_binding_codec';d.mkdir();f=d/'main.go'
          code=Path('scripts/rocketmq/image_fixtures/m4_binding_codec.go').read_bytes()
          try:
              f.write_bytes(code)
              with Path('m4-binding-codec.json').open('x') as output:
                  subprocess.run(['go','run','-ldflags','-X github.com/FangcunMount/qs-server/pkg/version.GitCommit='+os.environ['QS_SHA'],
                      './scripts/testing/m4_binding_codec',str(root/'binding.json'),str(root/'base.json')],cwd=source,stdout=output,check=True)
          finally:
              if f.exists():
                  assert f.read_bytes()==code
                  f.unlink()
              d.rmdir()
          x=json.loads(Path('m4-binding-codec.json').read_bytes())
          assert x['source_sha']==os.environ['QS_SHA'] and x['passed']==3 and x['failed']==x['skipped']==0
          PY
      - name: Compile original current-schema and consumer registry fixtures
        run: |
          set -euo pipefail
          fixture="$GITHUB_WORKSPACE/.five-sources/qs/internal/pkg/migration/m3_image_pair_fixture_test.go"
          iam_fixture="$GITHUB_WORKSPACE/.five-sources/iam/scripts/testing/m3_five_image_fixture"
          consumer_fixture="$GITHUB_WORKSPACE/.five-sources/qs/scripts/testing/m3_consumer_contract"
          test ! -e "$fixture"
          test ! -e "$iam_fixture"
          test ! -e "$consumer_fixture"
          mkdir "$iam_fixture" "$consumer_fixture"
          trap 'rm -f "$fixture" "$iam_fixture/main.go" "$consumer_fixture/main.go"; rmdir "$iam_fixture" "$consumer_fixture"' EXIT
          cp scripts/rocketmq/image_fixtures/qs_init_test.go "$fixture"
          cp scripts/rocketmq/image_fixtures/iam_init.go "$iam_fixture/main.go"
          cp scripts/rocketmq/image_fixtures/qs_consumer_contract.go "$consumer_fixture/main.go"
          cd .five-sources/qs
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go test -c -tags=integration \
            -ldflags "-X github.com/FangcunMount/qs-server/pkg/version.GitCommit=$QS_SHA" \
            -o "$GITHUB_WORKSPACE/five-qs-init" ./internal/pkg/migration
          go run -ldflags "-X github.com/FangcunMount/qs-server/pkg/version.GitCommit=$QS_SHA" \
            ./scripts/testing/m3_consumer_contract > "$GITHUB_WORKSPACE/qs-consumer-contract.txt"
          cd "$GITHUB_WORKSPACE/.five-sources/iam"
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -o "$GITHUB_WORKSPACE/five-iam-init" ./scripts/testing/m3_five_image_fixture
          cd "$GITHUB_WORKSPACE"
          for binary in five-qs-init five-iam-init; do
            test -z "$(readelf -l "$binary" | sed -n '/INTERP/p')"
          done
      - name: Fixed official Broker dependency
        run: |
          set -euo pipefail
          bash scripts/rocketmq/fetch-release.sh
          docker build --no-cache -t rocketmq-m3-image-start:5.5.1 components/rocketmq
      - name: Actual compatible-v2 to readable-v3 switching and failed-start repair
        run: |
          set -euo pipefail
          umask 077
          uv run --no-project --with pyyaml==6.0.2 --with sqlalchemy==2.0.52 python scripts/rocketmq/five_image_start.py \
            --readable-candidate "$PWD/$CANDIDATE_PATH" --readable-cutover-startup "$PWD/.independent-startup/readable-eight-instance-startup.json" --sources "$PWD/.five-sources" --candidate "$PWD/.five-candidates" \
            --qs-initializer "$PWD/five-qs-init" --iam-initializer "$PWD/five-iam-init" \
            --consumer-contract "$PWD/qs-consumer-contract.txt" --report readable-eight-instance-cutover.json
      - name: Nonempty native evidence and complete owned cleanup
        if: always()
        run: |
          python3 - <<'PY'
          import json,sys,os
          from pathlib import Path
          sys.path.insert(0,'scripts/rocketmq')
          from readable_image_candidates import read
          from readable_cutover_receipt import read_startup,validate_cutover
          candidate,digest=read(Path(os.environ['CANDIDATE_PATH']),Path('components/rocketmq/serverd-routes-readable-v3.json'))
          _,prior_digest=read_startup(Path('.independent-startup/readable-eight-instance-startup.json'),candidate,digest)
          validate_cutover(json.load(open('readable-eight-instance-cutover.json')),candidate,digest,prior_digest)
          PY
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: readable-eight-instance-cutover-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            readable-eight-instance-cutover.json
            m4-binding-codec.json
          if-no-files-found: error
          retention-days: 14
