name: RocketMQ readable publication contracts
on:
  pull_request:
    paths:
      - scripts/rocketmq/readable_publish_candidates.py
      - scripts/rocketmq/test_readable_publish_candidates.py
      - .github/workflows/rocketmq-readable-publication.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - name: Preserve original publishers and reject unverified readable archives
        run: |
          set -euo pipefail
          for test in test_readable_publish_candidates.py test_m4_publish_candidates.py test_publish_candidates.py; do
            python3 -m unittest discover -s scripts/rocketmq -p "$test"
          done
