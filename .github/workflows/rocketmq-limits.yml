name: RocketMQ complete transaction acceptance
# AI finalization tools run their own required host gate; shared changes retain this matrix.
on:
  pull_request:
    paths:
      - "components/rocketmq/**"
      - "scripts/rocketmq/**"
      - "!scripts/rocketmq/ai_finalization_*"
      - "!scripts/rocketmq/test_ai_finalization_*"
      - "!scripts/rocketmq/qs_replan_acceptance.py"
      - "!scripts/rocketmq/test_qs_replan_acceptance.py"
      - "!scripts/rocketmq/image_fixtures/readable_replan_test.go"
      - "!scripts/rocketmq/test_readable_ci_policy.py"
      - "!scripts/rocketmq/readable_publish_candidates.py"
      - "!scripts/rocketmq/test_readable_publish_candidates.py"
      - "!scripts/rocketmq/readable_cutover.py"
      - "!scripts/rocketmq/readable_cutover_materials.py"
      - "!scripts/rocketmq/readable_cutover_receipt.py"
      - "!scripts/rocketmq/test_readable_cutover_materials.py"
      - "!scripts/rocketmq/test_readable_cutover_receipt.py"
      - ".github/workflows/rocketmq-limits.yml"
  workflow_dispatch:
    inputs:
      native_dlq:
        description: Isolated native DLQ index audit only; not complete SDK transaction acceptance
        type: boolean
        default: false
      sdk_ref:
        description: Exact candidate SDK revision
        type: string
        required: true
        default: 1345266aa0e864c46de5d1e3e3c939dd8002a890
permissions:
  contents: read
env:
  GOTOOLCHAIN: local
concurrency:
  group: rocketmq-complete-sdk-${{ github.ref }}
  cancel-in-progress: true
jobs:
  sdk:
    if: github.event_name == 'pull_request' || !inputs.native_dlq
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        include:
          - go: '1.25.9'
            python: '3.11'
            mysql: 'mysql:8.0.36'
          - go: '1.25.12'
            python: '3.13'
            mysql: 'mysql:8.4'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/checkout@v6
        with:
          repository: FangcunMount/reliable-messaging
          ref: ${{ inputs.sdk_ref || '1345266aa0e864c46de5d1e3e3c939dd8002a890' }}
          path: .sdk-acceptance
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ matrix.go }}
          cache-dependency-path: .sdk-acceptance/go.sum
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.12.13'
          python-version: ${{ matrix.python }}
      - name: Fetch and verify official release archive
        run: bash scripts/rocketmq/fetch-release.sh
      - name: Build exact isolated Broker with fresh PGP proof
        run: docker build --no-cache -t rocketmq-sdk:5.5.1 components/rocketmq
      - name: Required public SDK MySQL, Mongo and cross-language recovery proofs
        run: |
          python3 scripts/rocketmq/ci-transactions.py --sdk-api-go --sdk-api-python --sdk-faults --sdk-limits \
            --sdk "$PWD/.sdk-acceptance" --image rocketmq-sdk:5.5.1 --mysql-image '${{ matrix.mysql }}' \
            --report rocketmq-complete-sdk.json
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: rocketmq-complete-sdk-${{ strategy.job-index }}-${{ github.sha }}
          path: rocketmq-complete-sdk.json
          if-no-files-found: error
          retention-days: 14

  native-index-audit:
    if: github.event_name == 'pull_request' || inputs.native_dlq
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/checkout@v6
        with:
          repository: FangcunMount/reliable-messaging
          ref: 8de893b367cc797580799abd8325f41dd62356db
          path: .sdk-acceptance
      - uses: actions/setup-go@v6
        with:
          go-version: '1.25.12'
          cache-dependency-path: scripts/rocketmq/probes/native-dead-letter/go.sum
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.12.13'
          python-version: '3.11'
      - name: Strict index privacy and isolated profile guards
        run: |
          python3 -m unittest discover -s scripts/rocketmq -p 'test_native_dead_letter*.py'
          (cd scripts/rocketmq/probes/native-dead-letter && go test -race ./...)
      - name: Verify archive and build exact isolated Broker
        run: |
          bash scripts/rocketmq/fetch-release.sh
          docker build --no-cache -t rocketmq-native-audit:5.5.1 components/rocketmq
      - name: Required real native DLQ and read-only index export
        run: |
          make rocketmq-native-dlq-audit-test SDK_DIR="$PWD/.sdk-acceptance" \
            ROCKETMQ_TEST_IMAGE=rocketmq-native-audit:5.5.1 \
            ROCKETMQ_NATIVE_AUDIT_REPORT=rocketmq-native-dlq-audit.json
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: rocketmq-native-dlq-audit-${{ github.sha }}
          path: rocketmq-native-dlq-audit.json
          if-no-files-found: error
          retention-days: 14
