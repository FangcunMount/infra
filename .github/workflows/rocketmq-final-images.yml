name: M3 isolated final image candidates
on:
  pull_request:
    paths:
      - scripts/rocketmq/final_image_candidate.py
      - scripts/rocketmq/test_final_image_candidate.py
      - scripts/rocketmq/ai_image_start.py
      - scripts/rocketmq/image_start_fixture.py
      - scripts/rocketmq/test_ai_image_start.py
      - scripts/rocketmq/qs_image_pair.py
      - scripts/rocketmq/test_qs_image_pair.py
      - scripts/rocketmq/five_image_start.py
      - scripts/rocketmq/mongo_ddl_audit.py
      - scripts/rocketmq/test_mongo_ddl_audit.py
      - scripts/rocketmq/image_cutover_boundary.py
      - scripts/rocketmq/test_image_cutover_boundary.py
      - scripts/rocketmq/image_full_protection.py
      - scripts/rocketmq/test_image_full_protection.py
      - scripts/rocketmq/image_cutover_offline.py
      - scripts/rocketmq/test_image_cutover_offline.py
      - scripts/rocketmq/qs_runtime_configuration.py
      - scripts/rocketmq/qs_consumer_contract.py
      - scripts/rocketmq/test_qs_consumer_contract.py
      - scripts/rocketmq/image_fixtures/qs_consumer_contract.go
      - scripts/rocketmq/image_fixtures/qs_consumer_contract.json
      - components/rocketmq/serverd-routes-m3-v2.json
      - scripts/rocketmq/test_qs_runtime_configuration.py
      - scripts/rocketmq/image_fixtures/qs_init_test.go
      - scripts/rocketmq/iam_image_start.py
      - scripts/rocketmq/test_iam_image_start.py
      - scripts/rocketmq/image_fixtures/iam_init.go
      - .github/workflows/rocketmq-final-images.yml
  workflow_dispatch:
    inputs:
      phase:
        description: Build five candidates or start an existing IAM/AI archive in an owned fixture
        type: choice
        options: [build, iam-start, ai-start, qs-pair, five-start, cutover, mongo-audit]
        default: build
      image_run_id:
        description: Exact prior five-image run for a component; no registry or production input
        type: string
        default: '40074229224'
      build_scope:
        description: Rebuild all candidates or only the affected three QS images
        type: choice
        options: [all, qs]
        default: all
      qs_image_run_id:
        description: Optional exact QS build run; IAM and AI retain image_run_id archives
        type: string
        default: ''
      startup_run_id:
        description: Successful independent five-start receipt required only for owned cutover rehearsal
        type: string
        default: ''
      iam_sha:
        description: Exact reviewed stable IAM source SHA
        type: string
        required: true
      qs_sha:
        description: Exact reviewed stable QS source SHA
        type: string
        required: true
      ai_sha:
        description: Exact reviewed stable AI source SHA
        type: string
        required: true
      run_uid:
        description: Explicit reviewed Go image UID; T30 must match actual hosts
        type: string
        default: '2000'
      run_gid:
        description: Explicit reviewed Go image GID; T30 must match actual hosts
        type: string
        default: '2000'
permissions:
  contents: read
concurrency:
  group: m3-final-images-${{ github.ref }}
  cancel-in-progress: false
jobs:
  mongo-audit:
    if: github.event_name == 'workflow_dispatch' && inputs.phase == 'mongo-audit'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.12.13'
          python-version: '3.13'
      - name: Audit instrumentation against fixed real Mongo only
        run: |
          set -euo pipefail
          umask 077
          uv run --no-project --with pyyaml==6.0.2 python scripts/rocketmq/mongo_audit_probe.py --report mongo-audit-proof.json
          python3 - <<'PYREPORT'
          import json
          x=json.load(open('mongo-audit-proof.json'))
          assert x['passed']==4 and x['failed']==x['skipped']==0
          assert all(x['cases'].values()) and all(x['cleanup'].values())
          assert not x['production'] and not x['application_startup_verified']
          PYREPORT
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: m3-mongo-audit-proof-${{ github.run_id }}
          path: mongo-audit-proof.json
          if-no-files-found: error
          retention-days: 14
  contracts:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - run: python3 -m unittest discover -s scripts/rocketmq -p test_final_image_candidate.py
      - run: python3 -m unittest discover -s scripts/rocketmq -p test_iam_image_start.py
      - run: python3 -m unittest discover -s scripts/rocketmq -p test_ai_image_start.py
      - run: python3 -m unittest discover -s scripts/rocketmq -p test_qs_image_pair.py
      - run: python3 -m unittest discover -s scripts/rocketmq -p test_qs_runtime_configuration.py
      - run: python3 -m unittest discover -s scripts/rocketmq -p test_qs_consumer_contract.py
      - run: python3 -m unittest discover -s scripts/rocketmq -p test_mongo_ddl_audit.py
      - run: python3 -m unittest discover -s scripts/rocketmq -p test_image_cutover_boundary.py
      - run: python3 -m unittest discover -s scripts/rocketmq -p test_image_full_protection.py
      - run: python3 -m unittest discover -s scripts/rocketmq -p test_image_cutover_offline.py
  images:
    if: github.event_name == 'workflow_dispatch' && inputs.phase == 'build'
    needs: contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.build_scope == 'qs' && '[{"target":"qs-api","repository":"qs-server"},{"target":"qs-collection","repository":"qs-server"},{"target":"qs-worker","repository":"qs-server"}]' || '[{"target":"iam","repository":"iam"},{"target":"qs-api","repository":"qs-server"},{"target":"qs-collection","repository":"qs-server"},{"target":"qs-worker","repository":"qs-server"},{"target":"ai","repository":"qs-ai"}]') }}
    env:
      SOURCE_SHA: ${{ matrix.repository == 'iam' && inputs.iam_sha || matrix.repository == 'qs-server' && inputs.qs_sha || inputs.ai_sha }}
      TARGET: ${{ matrix.target }}
      RUN_UID: ${{ inputs.run_uid }}
      RUN_GID: ${{ inputs.run_gid }}
      GOWORK: 'off'
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@v6
      - name: Validate exact source and explicit image identity
        run: |
          set -euo pipefail
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$RUN_UID" =~ ^[1-9][0-9]*$ && "$RUN_GID" =~ ^[1-9][0-9]*$ ]]
      - uses: actions/checkout@v6
        with:
          repository: FangcunMount/${{ matrix.repository }}
          ref: ${{ env.SOURCE_SHA }}
          path: .image-source
      - uses: actions/setup-go@v6
        with:
          go-version: '1.25.12'
          cache: false
      - name: Build original Dockerfile, inventory and save exact candidate
        run: |
          set -euo pipefail
          python3 scripts/rocketmq/final_image_candidate.py --source "$PWD/.image-source" \
            --source-sha "$SOURCE_SHA" --target "$TARGET" --output "$PWD/.image-candidate" \
            --run-uid "$RUN_UID" --run-gid "$RUN_GID"
      - name: Require nonempty inventory and owned cleanup
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          x=json.loads(Path('.image-candidate/image-inventory.json').read_text())
          assert x['passed']==1 and x['failed']==x['skipped']==0
          assert x['deferred_tools_absent'] and x['archive_bytes']>0
          assert all(x['cleanup'].values())
          assert not any(x[k] for k in ('production','registry_published','application_started','runtime_ready','cutover_rehearsal_complete'))
          PY
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: m3-final-image-metadata-${{ matrix.target }}-${{ env.SOURCE_SHA }}-${{ github.run_id }}
          path: .image-candidate/image-inventory.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v7
        with:
          name: m3-final-image-archive-${{ matrix.target }}-${{ env.SOURCE_SHA }}-${{ github.run_id }}
          path: |
            .image-candidate/*.tar.gz
            .image-candidate/qs-migrate-offline
          include-hidden-files: true
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
  iam-start:
    if: github.event_name == 'workflow_dispatch' && inputs.phase == 'iam-start'
    needs: contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      GH_TOKEN: ${{ github.token }}
      IMAGE_RUN_ID: ${{ inputs.image_run_id }}
      GOWORK: 'off'
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@v6
      - uses: actions/checkout@v6
        with:
          repository: FangcunMount/iam
          ref: 954ad9dee2f71a51151b696ec05d5cb90cc65b50
          path: .iam-start-source
      - uses: actions/setup-go@v6
        with:
          go-version: '1.25.12'
          cache-dependency-path: .iam-start-source/go.sum
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.12.13'
          python-version: '3.13'
      - name: Download exact previously built IAM archive on isolated runner
        run: |
          set -euo pipefail
          umask 077
          [[ "$IMAGE_RUN_ID" =~ ^[0-9]{1,20}$ ]]
          mkdir -m 700 .iam-image-candidate
          gh run download "$IMAGE_RUN_ID" --repo "$GITHUB_REPOSITORY" \
            --name "m3-final-image-metadata-iam-954ad9dee2f71a51151b696ec05d5cb90cc65b50-$IMAGE_RUN_ID" --dir .iam-image-candidate
          gh run download "$IMAGE_RUN_ID" --repo "$GITHUB_REPOSITORY" \
            --name "m3-final-image-archive-iam-954ad9dee2f71a51151b696ec05d5cb90cc65b50-$IMAGE_RUN_ID" --dir .iam-image-candidate
      - name: Verify official archive and build owned Broker
        run: |
          set -euo pipefail
          bash scripts/rocketmq/fetch-release.sh
          docker build --no-cache -t rocketmq-m3-image-start:5.5.1 components/rocketmq
      - name: Original IAM image restore and paused real entrypoint
        run: |
          set -euo pipefail
          umask 077
          uv run --no-project --with pyyaml==6.0.2 python scripts/rocketmq/iam_image_start.py \
            --source "$PWD/.iam-start-source" --candidate "$PWD/.iam-image-candidate" --report iam-image-start.json
      - name: Nonempty zero skips and owned cleanup
        if: always()
        run: |
          python3 - <<'PY'
          import json
          x=json.load(open('iam-image-start.json'))
          assert x['passed']>0 and x['failed']==x['skipped']==0
          assert all(x['cleanup'].values())
          assert not x['production'] and not x['system_acceptance'] and not x['combined_cutover_rehearsal_complete']
          PY
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: m3-iam-image-start-${{ github.run_id }}
          path: iam-image-start.json
          if-no-files-found: error
          retention-days: 14
  ai-start:
    if: github.event_name == 'workflow_dispatch' && inputs.phase == 'ai-start'
    needs: contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    permissions:
      actions: read
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
      IMAGE_RUN_ID: ${{ inputs.image_run_id }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/checkout@v6
        with:
          repository: FangcunMount/qs-ai
          ref: ddff86cad27d03c95dad28490d6cccbc1ce5b15f
          path: .ai-start-source
      - name: Download exact previously built AI archive on isolated runner
        run: |
          set -euo pipefail
          umask 077
          [[ "$IMAGE_RUN_ID" =~ ^[0-9]{1,20}$ ]]
          mkdir -m 700 .ai-image-candidate
          gh run download "$IMAGE_RUN_ID" --repo "$GITHUB_REPOSITORY" \
            --name "m3-final-image-metadata-ai-ddff86cad27d03c95dad28490d6cccbc1ce5b15f-$IMAGE_RUN_ID" --dir .ai-image-candidate
          gh run download "$IMAGE_RUN_ID" --repo "$GITHUB_REPOSITORY" \
            --name "m3-final-image-archive-ai-ddff86cad27d03c95dad28490d6cccbc1ce5b15f-$IMAGE_RUN_ID" --dir .ai-image-candidate
      - name: Verify official archive and build owned Broker
        run: |
          set -euo pipefail
          bash scripts/rocketmq/fetch-release.sh
          docker build --no-cache -t rocketmq-m3-image-start:5.5.1 components/rocketmq
      - name: Original AI image restore and read-only paused entrypoint
        run: |
          set -euo pipefail
          umask 077
          python3 scripts/rocketmq/ai_image_start.py --source "$PWD/.ai-start-source" \
            --candidate "$PWD/.ai-image-candidate" --report ai-image-start.json
      - name: Nonempty zero skips and owned cleanup
        if: always()
        run: |
          python3 - <<'PYREPORT'
          import json
          x=json.load(open('ai-image-start.json'))
          assert x['passed']==9 and x['failed']==x['skipped']==0
          assert len(x['cases'])==9 and all(x['cases'].values()) and all(x['cleanup'].values())
          assert x['source_unchanged'] and x['runtime_ddl_attempts']==0
          assert not x['production'] and not x['system_acceptance'] and not x['combined_cutover_rehearsal_complete']
          PYREPORT
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: m3-ai-image-start-${{ github.run_id }}
          path: ai-image-start.json
          if-no-files-found: error
          retention-days: 14

  qs-pair:
    if: github.event_name == 'workflow_dispatch' && inputs.phase == 'qs-pair'
    needs: contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      GH_TOKEN: ${{ github.token }}
      IMAGE_RUN_ID: ${{ inputs.image_run_id }}
      GOWORK: 'off'
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@v6
      - uses: actions/checkout@v6
        with:
          repository: FangcunMount/qs-server
          ref: d6fdc2bcda6db5cd84fd3a2f53b782448ac1e0b7
          path: .qs-pair-source
      - uses: actions/setup-go@v6
        with:
          go-version: '1.25.12'
          cache-dependency-path: .qs-pair-source/go.sum
      - name: Download exact previously built QS archives on isolated runner
        run: |
          set -euo pipefail
          umask 077
          [[ "$IMAGE_RUN_ID" =~ ^[0-9]{1,20}$ ]]
          mkdir -m 700 .qs-image-candidates
          for target in qs-api qs-collection qs-worker; do
            mkdir -m 700 ".qs-image-candidates/$target"
            gh run download "$IMAGE_RUN_ID" --repo "$GITHUB_REPOSITORY" \
              --name "m3-final-image-metadata-$target-d6fdc2bcda6db5cd84fd3a2f53b782448ac1e0b7-$IMAGE_RUN_ID" --dir ".qs-image-candidates/$target"
            gh run download "$IMAGE_RUN_ID" --repo "$GITHUB_REPOSITORY" \
              --name "m3-final-image-archive-$target-d6fdc2bcda6db5cd84fd3a2f53b782448ac1e0b7-$IMAGE_RUN_ID" --dir ".qs-image-candidates/$target"
          done
      - name: Compile owned fixture against unchanged original migration package
        run: |
          set -euo pipefail
          fixture="$GITHUB_WORKSPACE/.qs-pair-source/internal/pkg/migration/m3_image_pair_fixture_test.go"
          test ! -e "$fixture"
          trap 'rm -f "$fixture"' EXIT
          cp scripts/rocketmq/image_fixtures/qs_init_test.go "$fixture"
          cd .qs-pair-source
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go test -c -tags=integration \
            -ldflags '-X github.com/FangcunMount/qs-server/pkg/version.GitCommit=d6fdc2bcda6db5cd84fd3a2f53b782448ac1e0b7' \
            -o "$GITHUB_WORKSPACE/qs-pair-init" ./internal/pkg/migration
          cd "$GITHUB_WORKSPACE"
          test -z "$(readelf -l qs-pair-init | sed -n '/INTERP/p')"
      - name: Verify official Broker archive and build owned dependency
        run: |
          set -euo pipefail
          bash scripts/rocketmq/fetch-release.sh
          docker build --no-cache -t rocketmq-m3-image-start:5.5.1 components/rocketmq
      - name: Original paired schemas, exact full restore and initial bindings
        run: |
          set -euo pipefail
          umask 077
          python3 scripts/rocketmq/qs_image_pair.py --source "$PWD/.qs-pair-source" \
            --candidate "$PWD/.qs-image-candidates" --initializer "$PWD/qs-pair-init" --report qs-image-pair.json
      - name: Nonempty zero skips and owned cleanup
        if: always()
        run: |
          python3 - <<'PYREPORT'
          import json
          x=json.load(open('qs-image-pair.json'))
          assert x['passed']==9 and len(x['cases'])==9 and x['failed']==x['skipped']==0
          assert all(x['cases'].values()) and all(x['cleanup'].values()) and x['source_unchanged']
          assert not any(x[k] for k in ('production','system_acceptance','application_started','combined_cutover_rehearsal_complete'))
          PYREPORT
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: m3-qs-image-pair-${{ github.run_id }}
          path: qs-image-pair.json
          if-no-files-found: error
          retention-days: 14

  five-start:
    if: github.event_name == 'workflow_dispatch' && (inputs.phase == 'five-start' || inputs.phase == 'cutover')
    needs: contracts
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    timeout-minutes: 40
    env:
      GH_TOKEN: ${{ github.token }}
      IMAGE_RUN_ID: ${{ inputs.image_run_id }}
      STARTUP_RUN_ID: ${{ inputs.startup_run_id }}
      QS_IMAGE_RUN_ID: ${{ inputs.qs_image_run_id }}
      IMAGE_PHASE: ${{ inputs.phase }}
      GOWORK: 'off'
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@v6
      - uses: actions/checkout@v6
        with:
          repository: FangcunMount/iam
          ref: 954ad9dee2f71a51151b696ec05d5cb90cc65b50
          path: .five-sources/iam
      - uses: actions/checkout@v6
        with:
          repository: FangcunMount/qs-server
          ref: d6fdc2bcda6db5cd84fd3a2f53b782448ac1e0b7
          path: .five-sources/qs
      - uses: actions/checkout@v6
        with:
          repository: FangcunMount/qs-ai
          ref: ddff86cad27d03c95dad28490d6cccbc1ce5b15f
          path: .five-sources/ai
      - uses: actions/setup-go@v6
        with:
          go-version: '1.25.12'
          cache-dependency-path: |
            .five-sources/iam/go.sum
            .five-sources/qs/go.sum
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.12.13'
          python-version: '3.13'
      - name: Download exact five candidate archives on owned runner
        run: |
          set -euo pipefail
          umask 077
          [[ "$IMAGE_RUN_ID" =~ ^[0-9]{1,20}$ ]]
          QS_IMAGE_RUN_ID="${QS_IMAGE_RUN_ID:-$IMAGE_RUN_ID}"
          [[ "$QS_IMAGE_RUN_ID" =~ ^[0-9]{1,20}$ ]]
          mkdir -m 700 .five-candidates
          for target in iam qs-api qs-collection qs-worker ai; do
            target_run="$IMAGE_RUN_ID"
            case "$target" in
              iam) source_sha=954ad9dee2f71a51151b696ec05d5cb90cc65b50 ;;
              ai) source_sha=ddff86cad27d03c95dad28490d6cccbc1ce5b15f ;;
              *) source_sha=d6fdc2bcda6db5cd84fd3a2f53b782448ac1e0b7; target_run="$QS_IMAGE_RUN_ID" ;;
            esac
            mkdir -m 700 ".five-candidates/$target"
            gh run download "$target_run" --repo "$GITHUB_REPOSITORY" \
              --name "m3-final-image-metadata-$target-$source_sha-$target_run" --dir ".five-candidates/$target"
            gh run download "$target_run" --repo "$GITHUB_REPOSITORY" \
              --name "m3-final-image-archive-$target-$source_sha-$target_run" --dir ".five-candidates/$target"
          done
      - name: Download independent successful startup receipt for cutover
        if: inputs.phase == 'cutover'
        run: |
          set -euo pipefail
          umask 077
          [[ "$STARTUP_RUN_ID" =~ ^[0-9]{1,20}$ ]]
          mkdir -m 700 .startup-trial
          gh run download "$STARTUP_RUN_ID" --repo FangcunMount/infra \
            --name "m3-five-image-start-$STARTUP_RUN_ID" --dir .startup-trial
          test -f .startup-trial/five-image-start.json
      - name: Compile owned initializers against unchanged source packages
        run: |
          set -euo pipefail
          fixture="$GITHUB_WORKSPACE/.five-sources/qs/internal/pkg/migration/m3_image_pair_fixture_test.go"
          iam_fixture="$GITHUB_WORKSPACE/.five-sources/iam/scripts/testing/m3_five_image_fixture"
          consumer_fixture="$GITHUB_WORKSPACE/.five-sources/qs/scripts/testing/m3_consumer_contract"
          test ! -e "$fixture"
          test ! -e "$iam_fixture"
          test ! -e "$consumer_fixture"
          mkdir "$iam_fixture" "$consumer_fixture"
          trap 'rm -f "$fixture" "$iam_fixture/main.go" "$consumer_fixture/main.go"; rmdir "$iam_fixture" "$consumer_fixture"' EXIT
          cp scripts/rocketmq/image_fixtures/qs_init_test.go "$fixture"
          cp scripts/rocketmq/image_fixtures/iam_init.go "$iam_fixture/main.go"
          cp scripts/rocketmq/image_fixtures/qs_consumer_contract.go "$consumer_fixture/main.go"
          cd .five-sources/qs
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go test -c -tags=integration \
            -ldflags '-X github.com/FangcunMount/qs-server/pkg/version.GitCommit=d6fdc2bcda6db5cd84fd3a2f53b782448ac1e0b7' \
            -o "$GITHUB_WORKSPACE/five-qs-init" ./internal/pkg/migration
          go run -ldflags '-X github.com/FangcunMount/qs-server/pkg/version.GitCommit=d6fdc2bcda6db5cd84fd3a2f53b782448ac1e0b7' \
            ./scripts/testing/m3_consumer_contract > "$GITHUB_WORKSPACE/qs-consumer-contract.txt"
          cd "$GITHUB_WORKSPACE/.five-sources/iam"
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -o "$GITHUB_WORKSPACE/five-iam-init" ./scripts/testing/m3_five_image_fixture
          cd "$GITHUB_WORKSPACE"
          for binary in five-qs-init five-iam-init; do
            test -z "$(readelf -l "$binary" | sed -n '/INTERP/p')"
          done
      - name: Verify official Broker archive and build owned dependency
        run: |
          set -euo pipefail
          bash scripts/rocketmq/fetch-release.sh
          docker build --no-cache -t rocketmq-m3-image-start:5.5.1 components/rocketmq
      - name: Actual five images, required IAM and three original workers
        run: |
          set -euo pipefail
          umask 077
          extra=()
          if [[ "$IMAGE_PHASE" == cutover ]]; then
            extra=(--startup-receipt "$PWD/.startup-trial/five-image-start.json")
          fi
          uv run --no-project --with pyyaml==6.0.2 python scripts/rocketmq/five_image_start.py \
            --sources "$PWD/.five-sources" --candidate "$PWD/.five-candidates" \
            --qs-initializer "$PWD/five-qs-init" --iam-initializer "$PWD/five-iam-init" \
            --consumer-contract "$PWD/qs-consumer-contract.txt" --report five-image-start.json "${extra[@]}"
      - name: Actual image evidence is separate from C1 and business acceptance
        if: always()
        run: |
          python3 - <<'PYREPORT'
          import json,os
          x=json.load(open('five-image-start.json'))
          cutover=os.environ['IMAGE_PHASE']=='cutover'
          expected=18 if cutover else 15
          assert x['passed']==expected and len(x['cases'])==expected and x['failed']==x['skipped']==0
          assert all(x['cases'].values()) and all(x['cleanup'].values()) and x['sources_unchanged']
          assert x['mysql_runtime_ddl_attempts']==x['mongo_runtime_ddl_attempts']==0
          assert len(x['processes'])==7 and x['original_qs_consumer_count']==1
          assert not x['production'] and not x['system_acceptance']
          assert x['combined_cutover_rehearsal_complete']==x['c1_cutover_barrier_exercised']==cutover
          assert x['mongo_ddl_audit']['positive_controls']==4
          if cutover:
            assert x['schema']=='m3-five-actual-image-cutover/v1'
            assert x['actual_cutover']['elapsed_seconds']<1800
            assert x['actual_cutover']['actual_processes']==7 and len(x['actual_up_after_marker'])==7
            assert x['offline_pair']['verified'] and x['full_scope_restore']['snapshots_before']==x['full_scope_restore']['snapshots_after']
            assert not x['coordinator_status']['old_data_restore_eligible'] and x['coordinator_status']['first_start_recorded']
            assert not x['production_backup_retention_verified']
          PYREPORT
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: m3-five-image-start-${{ github.run_id }}
          path: five-image-start.json
          if-no-files-found: error
          retention-days: 14
