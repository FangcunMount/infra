name: RocketMQ IAM actual host native recovery
on:
  pull_request:
    paths:
      - tools/rocketmq-native-recovery/**
      - scripts/rocketmq/ci-native-recheck.py
      - scripts/rocketmq/managed_recovery_acceptance.py
      - scripts/rocketmq/iam_recovery_acceptance.py
      - scripts/rocketmq/test_iam_recovery_acceptance.py
      - scripts/rocketmq/probes/native-recheck/**
      - scripts/rocketmq/cutover_step.py
      - .github/workflows/rocketmq-iam-native-recovery.yml
  workflow_dispatch:
permissions:
  contents: read
env:
  GOTOOLCHAIN: local
jobs:
  actual-iam-original-primary-recovery:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-go@v6
        with:
          go-version: '1.25.12'
          cache-dependency-path: tools/rocketmq-native-recovery/go.sum
      - name: Compile frozen CLI before fixture/checkouts modify build metadata
        working-directory: tools/rocketmq-native-recovery
        run: |
          set -euo pipefail
          umask 077
          test -z "$(git status --porcelain)"
          go build -trimpath -buildvcs=true -ldflags "-X main.sourceSHA=$(git rev-parse HEAD)" -o "$RUNNER_TEMP/native-recovery" ./cmd/native-recovery
          go build -trimpath -buildvcs=true -o "$RUNNER_TEMP/host-observer" ./cmd/host-observer
          "$RUNNER_TEMP/native-recovery" version
          go list -m -json github.com/FangcunMount/reliable-messaging > "$RUNNER_TEMP/native-recovery-module.json"
          python3 - <<'PY'
          import json,os
          x=json.load(open(os.environ['RUNNER_TEMP']+'/native-recovery-module.json'))
          assert x['Version']=='v0.5.0-rocketmq-tx.4' and not x.get('Replace')
          assert x['Sum']=='h1:PflI1oWRjU4RFKvpi8WE/8ICI/1IUp8q8EOsbW1DXCI='
          PY
      - uses: actions/checkout@v6
        with:
          repository: FangcunMount/reliable-messaging
          ref: 04757bd3212ca961d8eaec22ecd3560101111e18
          path: .sdk-acceptance
      - uses: actions/checkout@v6
        with:
          repository: FangcunMount/iam
          ref: bee9c5c1a9945922dc4e88631af451babee646ca
          path: .iam-acceptance
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Pure fixture guards
        run: |
          python3 -m unittest discover -s scripts/rocketmq -p test_native_recheck.py
          python3 -m unittest discover -s scripts/rocketmq -p test_iam_recovery_acceptance.py
      - name: Fixed Broker archive verification
        run: bash scripts/rocketmq/fetch-release.sh
      - name: Fresh fixed isolated Broker
        run: docker build --no-cache -t rocketmq-managed-recovery:5.5.1 components/rocketmq
      - name: Real exhausted half, compiled CLI, SDK RPC and separate governance approval
        run: |
          set -euo pipefail
          umask 077
          python3 scripts/rocketmq/ci-native-recheck.py --sdk "$PWD/.sdk-acceptance" \
            --image rocketmq-managed-recovery:5.5.1 --managed-tool "$RUNNER_TEMP/native-recovery" --iam-host "$PWD/.iam-acceptance" --host-observer "$RUNNER_TEMP/host-observer" --report iam-native-recovery.json
      - name: Nonempty exact host recovery and cleanup
        if: always()
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          x=json.load(open('iam-native-recovery.json'))
          assert x['passed']==15 and x['failed']==x['skipped']==0
          p=x['proof']
          assert p['iam_original_host']['source_sha']=='bee9c5c1a9945922dc4e88631af451babee646ca'
          assert p['iam_original_host']['receipt']['passed']==5 and p['iam_original_host']['source_clean']
          assert p['iam_broker_network_disconnected'] and p['iam_broker_network_reconnected_after_owner_stop']
          assert p['owned_iam_database_removed'] and p['managed_recovery']['actual_sdk_stats']['Stopped']
          assert p['managed_recovery']['original_counts']==dict(business=1,requests=1,executions=1,witnesses=1)
          assert all(v is not False for k,v in x['cleanup'].items() if k not in ('project_containers_remaining','project_networks_remaining'))
          assert x['cleanup']['project_containers_remaining'] is x['cleanup']['project_networks_remaining'] is False
          print('actual IAM host recovery: 15 passed, 0 failed, 0 skipped; owned dependencies removed')
          PY
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: iam-native-recovery-${{ github.event.pull_request.head.sha || github.sha }}-${{ github.run_attempt }}
          path: iam-native-recovery.json
          if-no-files-found: error
          retention-days: 14
