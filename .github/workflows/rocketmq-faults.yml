name: RocketMQ packet transaction faults
# AI finalization tools run their own required host gate; shared changes retain this matrix.
on:
  pull_request:
    paths: ['components/rocketmq/**', 'scripts/rocketmq/**', '!scripts/rocketmq/ai_finalization_*', '!scripts/rocketmq/test_ai_finalization_*', '.github/workflows/rocketmq-faults.yml']
  workflow_dispatch:
    inputs:
      live_python:
        description: Source SDK surviving Python producer recovery; not a published artifact gate
        type: boolean
        default: false
      sdk_ref:
        description: Exact candidate SDK revision
        type: string
        required: true
        default: bfaae2b82ee0d1229b8c965fce472cdf5dec486f
permissions:
  contents: read
env:
  GOTOOLCHAIN: local
concurrency:
  group: rocketmq-packet-faults-${{ github.ref }}-${{ inputs.live_python && inputs.sdk_ref || 'standard' }}
  cancel-in-progress: true
jobs:
  sdk:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        include:
          - go: '1.25.9'
            python: '3.11'
            mysql: 'mysql:8.0.36'
          - go: '1.25.12'
            python: '3.13'
            mysql: 'mysql:8.4'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/checkout@v6
        with:
          repository: FangcunMount/reliable-messaging
          ref: ${{ inputs.sdk_ref || 'bfaae2b82ee0d1229b8c965fce472cdf5dec486f' }}
          path: .sdk-acceptance
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ matrix.go }}
          cache-dependency-path: .sdk-acceptance/go.sum
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.12.13'
          python-version: ${{ matrix.python }}
      - name: Verify immutable SDK source
        env:
          SDK_REF: ${{ inputs.sdk_ref || 'bfaae2b82ee0d1229b8c965fce472cdf5dec486f' }}
        run: |
          set -euo pipefail
          [[ "$SDK_REF" =~ ^[0-9a-f]{40}$ ]]
          test "$(git -C .sdk-acceptance rev-parse HEAD)" = "$SDK_REF"
      - name: Fetch and verify official release archive
        run: bash scripts/rocketmq/fetch-release.sh
      - name: Build exact isolated Broker with fresh PGP proof
        run: docker build --no-cache -t rocketmq-sdk:5.5.1 components/rocketmq
      - name: Required public SDK MySQL, Mongo and cross-language recovery proofs
        env:
          LIVE_PYTHON: ${{ inputs.live_python || false }}
        run: |
          set -euo pipefail
          fault_options=(--sdk-faults)
          if [[ "$LIVE_PYTHON" == true ]]; then
            fault_options=(--sdk-python-live-recovery)
          fi
          python3 scripts/rocketmq/ci-transactions.py --sdk-api-go --sdk-api-python "${fault_options[@]}" \
            --sdk "$PWD/.sdk-acceptance" --image rocketmq-sdk:5.5.1 --mysql-image '${{ matrix.mysql }}' \
            --report rocketmq-packet-faults.json
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: rocketmq-packet-faults-${{ strategy.job-index }}-${{ github.sha }}
          path: rocketmq-packet-faults.json
          if-no-files-found: error
          retention-days: 14
