name: RocketMQ QS AI commands original SQL and Broker
on:
  workflow_dispatch:
    inputs:
      qs_ref:
        description: Exact QS AI command candidate SHA
        type: string
        required: true
        default: 3dd33af4fc86d03fc80545276f18d0fef862f376
      faults:
        description: Original QS command COMMIT before/after TCP faults
        type: boolean
        default: false
      profile:
        description: Development uses one MySQL; full is the frozen-candidate gate
        type: choice
        options: [full, development]
        default: full
  pull_request:
    paths: ['scripts/rocketmq/qs_command_acceptance.py', 'scripts/rocketmq/test_qs_command_acceptance.py', 'scripts/rocketmq/qs_command_fault_acceptance.py', 'scripts/rocketmq/test_qs_command_fault_acceptance.py', 'scripts/rocketmq/ci-transactions.py', '.github/workflows/rocketmq-qs-command.yml']
permissions:
  contents: read
env:
  GOTOOLCHAIN: local
concurrency:
  group: rocketmq-qs-command-${{ github.ref }}
  cancel-in-progress: true
jobs:
  original-command-root:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        # QS go.mod requires 1.25.12. The separate SDK workflow retains its
        # own 1.25.9/1.25.12 compatibility matrix.
        go: ['1.25.12']
        mysql: ${{ fromJSON(inputs.profile == 'development' && '["mysql:8.0.36"]' || '["mysql:8.0.36","mysql:8.0.44","mysql:8.4.11"]') }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/checkout@v6
        with:
          repository: FangcunMount/reliable-messaging
          ref: ${{ inputs.faults == true && '8de893b367cc797580799abd8325f41dd62356db' || '8fb6fc57a415dc11e27fc64d71722f9675838bc3' }}
          path: .sdk-acceptance
      - uses: actions/checkout@v6
        with:
          repository: FangcunMount/qs-server
          ref: ${{ inputs.qs_ref || '3dd33af4fc86d03fc80545276f18d0fef862f376' }}
          path: .qs-acceptance
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ matrix.go }}
          cache-dependency-path: .qs-acceptance/go.sum
      - name: Verify candidate and source harness
        env:
          EXPECTED_QS_SHA: ${{ inputs.qs_ref || '3dd33af4fc86d03fc80545276f18d0fef862f376' }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED_QS_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git -C .qs-acceptance rev-parse HEAD)" = "$EXPECTED_QS_SHA"
          python3 -m unittest discover -s scripts/rocketmq -p 'test_*.py'
      - name: Build verified isolated Broker
        run: |
          set -euo pipefail
          bash scripts/rocketmq/fetch-release.sh
          docker build --no-cache -t rocketmq-qs-command:5.5.1 components/rocketmq
      - name: Required actual QS command entrypoints and original SQL roots
        env:
          HOST_FAULTS: ${{ inputs.faults == true && '1' || '0' }}
        run: |
          set -euo pipefail
          fault_args=()
          if [[ "$HOST_FAULTS" == 1 ]]; then
            fault_args+=(--qs-command-host-faults)
          fi
          python3 scripts/rocketmq/ci-transactions.py --sdk "$PWD/.sdk-acceptance" \
            --qs-command-host "$PWD/.qs-acceptance" --image rocketmq-qs-command:5.5.1 \
            --mysql-image "${{ matrix.mysql }}" --report rocketmq-qs-command.json "${fault_args[@]}"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: rocketmq-qs-command-${{ strategy.job-index }}-${{ matrix.go }}-${{ github.sha }}
          path: rocketmq-qs-command.json
          if-no-files-found: error
          retention-days: 14
