name: RocketMQ readable AI original roots and model recovery
on:
  pull_request:
    paths: ['scripts/rocketmq/ai_readable_acceptance.py', 'scripts/rocketmq/test_ai_readable_acceptance.py', 'scripts/rocketmq/ai_admission_acceptance.py', 'scripts/rocketmq/ai_finalization_acceptance.py', '.github/workflows/rocketmq-readable-ai.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: rocketmq-readable-ai-${{ github.ref }}
  cancel-in-progress: true
jobs:
  original-ai:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - profile: admission
            python: '3.11'
            mysql: mysql:8.0.36
          - profile: state
            python: '3.11'
            mysql: mysql:8.0.36
          - profile: finalization
            python: '3.11'
            mysql: mysql:8.0.36
          - profile: admission
            python: '3.13'
            mysql: mysql:8.4
          - profile: state
            python: '3.13'
            mysql: mysql:8.4
          - profile: finalization
            python: '3.13'
            mysql: mysql:8.4
    steps:
      - uses: actions/checkout@v6
      - uses: actions/checkout@v6
        with:
          repository: FangcunMount/reliable-messaging
          ref: 5c2e3cd155e67c0f766e93bf95238b16fc219b5f
          path: .sdk-acceptance
      - uses: actions/checkout@v6
        with:
          repository: FangcunMount/qs-ai
          ref: 3cbccedfacab2f35bdcd542d0547deb125e37471
          path: .ai-acceptance
      - uses: actions/setup-go@v6
        with:
          go-version: '1.25.12'
          cache-dependency-path: .sdk-acceptance/go.sum
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.12.13'
          python-version: ${{ matrix.python }}
      - name: Validate harness and isolated Broker
        run: |
          set -euo pipefail
          python3 -m unittest discover -s scripts/rocketmq -p 'test_*.py'
          bash scripts/rocketmq/fetch-release.sh
          docker build --no-cache -t rocketmq-readable-ai:5.5.1 components/rocketmq
      - name: Actual original host and independent recovery processes
        env:
          QS_AI_ACCEPTANCE_KIND: ${{ matrix.profile }}
          QS_AI_ACCEPTANCE_PYTHON: ${{ matrix.python }}
          QS_AI_READABLE_ROUTES: '1'
          PROFILE: ${{ matrix.profile }}
          MYSQL_IMAGE: ${{ matrix.mysql }}
        run: |
          set -euo pipefail
          python3 scripts/rocketmq/ci-transactions.py \
            --sdk "$PWD/.sdk-acceptance" --ai-admission-host "$PWD/.ai-acceptance" \
            --image rocketmq-readable-ai:5.5.1 --mysql-image "$MYSQL_IMAGE" \
            --report readable-ai-host.json
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          data = json.loads(Path('readable-ai-host.json').read_text())
          profile = os.environ['PROFILE']
          host = data['proof'][dict(admission='ai_admission_host', state='ai_state_host',
              finalization='ai_finalization_host')[profile]]
          assert data['passed'] > 0 and data['failed'] == data['skipped'] == 0
          assert host['manifest_version'] == 3 and host['naming_scheme'] == 'readable-v1'
          assert host['python_runtime']['sdk'] == '0.5.0rc1'
          assert host['locked_sdk_archive_sha256'] == 'bcee737b8cac54ca0a5a486aa126b9a7323ee980e526006fcd2e4b5763be4f92'
          assert host['source_sha'] == '3cbccedfacab2f35bdcd542d0547deb125e37471'
          assert host['source_clean_after']
          assert host['native_receipt']['passed'] > 0
          assert host['native_receipt']['failed'] == host['native_receipt']['skipped'] == 0
          assert data['cleanup'] == dict(project_containers_remaining=False,
              compose_down_succeeded=True, probe_process_groups_drained=True,
              private_fixture_directory_removed=True)
          PY
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: readable-ai-${{ matrix.profile }}-${{ strategy.job-index }}-${{ github.sha }}
          path: readable-ai-host.json
          if-no-files-found: error
          retention-days: 14
