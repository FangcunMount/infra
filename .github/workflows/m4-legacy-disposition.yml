name: M4 named historical asset disposition
on:
  pull_request:
    paths:
      - scripts/ops/m4_legacy_disposition.py
      - scripts/ops/test_m4_legacy_disposition.py
      - .github/workflows/m4-legacy-disposition.yml
permissions:
  contents: read
jobs:
  guards:
    strategy:
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - run: python3 -m unittest discover -s scripts/ops -p test_m4_legacy_disposition.py -v
