name: RocketMQ QS future retry original dual-store authorization
on:
  workflow_dispatch:
    inputs:
      qs_ref:
        description: Exact QS retry schedule candidate SHA
        type: string
        required: true
        default: 3b465b52c26a587f62278529a2cb87b82776eecb
  pull_request:
    paths: ['scripts/rocketmq/qs_retry_acceptance.py', 'scripts/rocketmq/test_qs_retry_acceptance.py', 'scripts/rocketmq/ci-transactions.py', '.github/workflows/rocketmq-qs-retry.yml']
permissions:
  contents: read
env:
  GOTOOLCHAIN: local
concurrency:
  group: rocketmq-qs-retry-${{ github.ref }}
  cancel-in-progress: true
jobs:
  original-dual-store-root:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        # QS go.mod requires 1.25.12. The separate SDK workflow retains its
        # own 1.25.9/1.25.12 compatibility matrix.
        go: ['1.25.12']
        mysql: ['mysql:8.0.36', 'mysql:8.0.44', 'mysql:8.4.11']
    steps:
      - uses: actions/checkout@v6
      - uses: actions/checkout@v6
        with:
          repository: FangcunMount/reliable-messaging
          ref: bfaae2b82ee0d1229b8c965fce472cdf5dec486f
          path: .sdk-acceptance
      - uses: actions/checkout@v6
        with:
          repository: FangcunMount/qs-server
          ref: ${{ inputs.qs_ref || '3b465b52c26a587f62278529a2cb87b82776eecb' }}
          path: .qs-acceptance
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ matrix.go }}
          cache-dependency-path: .qs-acceptance/go.sum
      - name: Verify candidate and source harness
        env:
          EXPECTED_QS_SHA: ${{ inputs.qs_ref || '3b465b52c26a587f62278529a2cb87b82776eecb' }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED_QS_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git -C .qs-acceptance rev-parse HEAD)" = "$EXPECTED_QS_SHA"
          python3 -m unittest discover -s scripts/rocketmq -p 'test_*.py'
      - name: Build verified isolated Broker
        run: |
          set -euo pipefail
          bash scripts/rocketmq/fetch-release.sh
          docker build --no-cache -t rocketmq-qs-retry:5.5.1 components/rocketmq
      - name: Required real host original MySQL and Mongo authorization roots
        run: |
          set -euo pipefail
          python3 scripts/rocketmq/ci-transactions.py --sdk "$PWD/.sdk-acceptance" \
            --qs-retry-store-host "$PWD/.qs-acceptance" --image rocketmq-qs-retry:5.5.1 \
            --mysql-image "${{ matrix.mysql }}" --report rocketmq-qs-retry.json
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: rocketmq-qs-retry-${{ strategy.job-index }}-${{ matrix.go }}-${{ github.sha }}
          path: rocketmq-qs-retry.json
          if-no-files-found: error
          retention-days: 14
