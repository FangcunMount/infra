name: RocketMQ Docker acceptance
# AI finalization tools run their own required host gate; shared changes retain this matrix.
on:
  pull_request:
    paths:
      - "components/rocketmq/**"
      - "scripts/rocketmq/**"
      - "!scripts/rocketmq/ai_finalization_*"
      - "!scripts/rocketmq/test_ai_finalization_*"
      - "!scripts/rocketmq/qs_replan_acceptance.py"
      - "!scripts/rocketmq/test_qs_replan_acceptance.py"
      - "!scripts/rocketmq/image_fixtures/readable_replan_test.go"
      - "!scripts/rocketmq/test_readable_ci_policy.py"
      - "!scripts/rocketmq/readable_publish_candidates.py"
      - "!scripts/rocketmq/test_readable_publish_candidates.py"
      - "!scripts/rocketmq/readable_cutover.py"
      - "!scripts/rocketmq/readable_cutover_materials.py"
      - "!scripts/rocketmq/readable_cutover_receipt.py"
      - "!scripts/rocketmq/test_readable_cutover_materials.py"
      - "!scripts/rocketmq/test_readable_cutover_receipt.py"
      - ".github/workflows/rocketmq.yml"
  push:
    branches: [main]
    paths:
      - "components/rocketmq/**"
      - "scripts/rocketmq/**"
      - "!scripts/rocketmq/ai_finalization_*"
      - "!scripts/rocketmq/test_ai_finalization_*"
      - "!scripts/rocketmq/qs_replan_acceptance.py"
      - "!scripts/rocketmq/test_qs_replan_acceptance.py"
      - "!scripts/rocketmq/image_fixtures/readable_replan_test.go"
      - "!scripts/rocketmq/test_readable_ci_policy.py"
      - "!scripts/rocketmq/readable_publish_candidates.py"
      - "!scripts/rocketmq/test_readable_publish_candidates.py"
      - "!scripts/rocketmq/readable_cutover.py"
      - "!scripts/rocketmq/readable_cutover_materials.py"
      - "!scripts/rocketmq/readable_cutover_receipt.py"
      - "!scripts/rocketmq/test_readable_cutover_materials.py"
      - "!scripts/rocketmq/test_readable_cutover_receipt.py"
      - ".github/workflows/rocketmq.yml"
  workflow_dispatch:
    inputs:
      sdk_ref:
        description: Exact SDK commit under acceptance
        type: string
        required: true
        default: 1345266aa0e864c46de5d1e3e3c939dd8002a890
permissions:
  contents: read
env:
  GOTOOLCHAIN: local
concurrency:
  group: rocketmq-acceptance-${{ github.ref }}
  cancel-in-progress: true
jobs:
  acceptance:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v6
      - name: Checkout pinned public SDK
        uses: actions/checkout@v6
        with:
          repository: FangcunMount/reliable-messaging
          ref: ${{ inputs.sdk_ref || '1345266aa0e864c46de5d1e3e3c939dd8002a890' }}
          path: .sdk-acceptance
      - uses: actions/setup-go@v6
        with:
          go-version: '1.25.12'
          cache-dependency-path: .sdk-acceptance/go.sum
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.12.13'
          python-version: '3.13'
      - name: Validate renderer, manifest and shell entrypoints
        run: |
          python3 -m unittest discover -s scripts/rocketmq -p 'test_*.py' -v
          bash -n scripts/rocketmq/*.sh components/rocketmq/entrypoint.sh
          python3 -m py_compile scripts/rocketmq/*.py
      - name: Fetch and verify official release archive
        run: bash scripts/rocketmq/fetch-release.sh
      - name: Build exact Docker runtime with fresh PGP proof
        run: |
          set -o pipefail
          docker build --no-cache --progress=plain \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            -t rocketmq-acceptance:5.5.1 components/rocketmq 2>&1 | tee rocketmq-build.log
      - name: Required real Broker, interoperability, ACL, persistence and shutdown tests
        run: |
          python3 scripts/rocketmq/ci-smoke.py --sdk "$PWD/.sdk-acceptance" \
            --image rocketmq-acceptance:5.5.1 --build-log rocketmq-build.log \
            --report rocketmq-m1-evidence.json
      - name: Required isolated transaction-client feasibility proof
        run: |
          python3 scripts/rocketmq/ci-transactions.py \
            --sdk "$PWD/.sdk-acceptance" \
            --image rocketmq-acceptance:5.5.1 --report rocketmq-m2-transactions.json
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: rocketmq-m2-transactions-${{ github.sha }}
          retention-days: 14
          if-no-files-found: error
          path: rocketmq-m2-transactions.json
      - name: Required public Go SDK with original MySQL/Mongo transactions and new-instance recovery
        run: |
          python3 scripts/rocketmq/ci-transactions.py --sdk-api-go \
            --sdk "$PWD/.sdk-acceptance" \
            --image rocketmq-acceptance:5.5.1 --report rocketmq-m2-go-sdk.json
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: rocketmq-m2-go-sdk-${{ github.sha }}
          retention-days: 14
          if-no-files-found: error
          path: rocketmq-m2-go-sdk.json
      - name: Export verified Docker image and checksum
        run: |
          docker save rocketmq-acceptance:5.5.1 | gzip -1 > rocketmq-5.5.1-amd64.tar.gz
          sha256sum rocketmq-5.5.1-amd64.tar.gz rocketmq-m1-evidence.json rocketmq-m2-transactions.json rocketmq-m2-go-sdk.json > rocketmq-SHA256SUMS
      - uses: actions/upload-artifact@v7
        if: success()
        with:
          name: rocketmq-5.5.1-amd64-${{ github.sha }}
          retention-days: 14
          path: |
            rocketmq-5.5.1-amd64.tar.gz
            rocketmq-m1-evidence.json
            rocketmq-m2-transactions.json
            rocketmq-m2-go-sdk.json
            rocketmq-SHA256SUMS
            rocketmq-build.log
