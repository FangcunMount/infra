name: ServerA access policy
on:
  pull_request:
    paths:
      - scripts/00-server/servera-access.py
      - scripts/00-server/test_servera_access.py
      - deploy/serverA/sudoers/**
      - .github/workflows/servera-access.yml
  push:
    branches: [main]
    paths:
      - scripts/00-server/servera-access.py
      - scripts/00-server/test_servera_access.py
      - deploy/serverA/sudoers/**
      - .github/workflows/servera-access.yml
permissions:
  contents: read
jobs:
  policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Validate permission boundaries and rollback
        run: python3 -m unittest discover -s scripts/00-server -p 'test_servera_access.py' -v
      - name: Validate sudoers syntax without installing
        run: sudo visudo -cf deploy/serverA/sudoers/fangcun-m4-readable-material-verify
