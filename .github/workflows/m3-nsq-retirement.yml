name: Production NSQ retired entrypoints
on:
  pull_request:
    paths:
      - Makefile
      - deploy/serverD/**
      - scripts/02-components/compose-manager.sh
      - scripts/02-components/init-infrastructure.sh
      - scripts/02-components/install.sh
      - scripts/rocketmq/guard-nsq.sh
      - scripts/ops/nsq_retirement.py
      - scripts/ops/test_nsq_retirement.py
      - scripts/ops/test_m4_production_entrypoints.py
      - .github/workflows/m3-nsq-retirement.yml
permissions:
  contents: read
jobs:
  retired-entrypoints:
    strategy:
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - run: python3 -m unittest discover -s scripts/ops -p test_nsq_retirement.py -v
      - run: python3 -m unittest discover -s scripts/ops -p test_m4_production_entrypoints.py -v
      - run: bash -n scripts/02-components/compose-manager.sh scripts/02-components/init-infrastructure.sh scripts/02-components/install.sh scripts/rocketmq/guard-nsq.sh
  retained-development-compose:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Development NSQ remains renderable without a production serverD stack
        run: |
          test ! -e deploy/serverD/docker-compose.yml
          docker compose -p m4-dev-nsq-proof -f components/nsq/docker-compose.yml \
            config --no-env-resolution --format json > /tmp/m4-dev-compose.json
          python3 - <<'PY'
          import json
          d=json.load(open('/tmp/m4-dev-compose.json'))
          assert set(d['services'])=={'nsqd','nsqlookupd','nsqadmin'}
          assert all(s['restart']=='always' and 'profiles' not in s for s in d['services'].values())
          assert any(v['target']=='/data' for v in d['services']['nsqd']['volumes'])
          print('generic isolated/development NSQ configuration retained; no container started')
          PY
