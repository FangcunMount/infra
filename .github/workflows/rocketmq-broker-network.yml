name: RocketMQ missing endpoint recovery validation
on:
  pull_request:
    paths:
      - scripts/rocketmq/broker_recovery_network.py
      - scripts/rocketmq/test_broker_recovery_network.py
      - scripts/rocketmq/broker_network_probe.py
      - scripts/rocketmq/admin_rotation_probe.py
      - .github/workflows/rocketmq-broker-network.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  recovery:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - name: Missing endpoint and restart admission guards
        run: python3 -m unittest discover -s scripts/rocketmq -p test_broker_recovery_network.py
      - name: Build verified official 5.5.1 owned Broker
        run: |
          bash scripts/rocketmq/fetch-release.sh
          docker build -t rocketmq-m3-image-start:5.5.1 components/rocketmq
      - name: Real disconnect failure, guarded reconnect and original password rotation
        run: python3 scripts/rocketmq/admin_rotation_probe.py --network-recovery
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: m3-broker-network-recovery-${{ github.run_id }}
          path: admin-rotation-probe.json
          if-no-files-found: error
          retention-days: 30
