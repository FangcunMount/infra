name: RocketMQ readable route SDK acceptance
on:
  pull_request:
    paths:
      - "components/rocketmq/**"
      - "scripts/rocketmq/**"
      - "!scripts/rocketmq/qs_replan_acceptance.py"
      - "!scripts/rocketmq/test_qs_replan_acceptance.py"
      - "!scripts/rocketmq/image_fixtures/readable_replan_test.go"
      - "!scripts/rocketmq/test_readable_ci_policy.py"
      - "!scripts/rocketmq/readable_publish_candidates.py"
      - "!scripts/rocketmq/test_readable_publish_candidates.py"
      - "!scripts/rocketmq/readable_cutover.py"
      - "!scripts/rocketmq/readable_cutover_materials.py"
      - "!scripts/rocketmq/readable_cutover_receipt.py"
      - "!scripts/rocketmq/test_readable_cutover_materials.py"
      - "!scripts/rocketmq/test_readable_cutover_receipt.py"
      - "scripts/ops/readable_pop_controls.py"
      - "scripts/ops/test_readable_pop_controls.py"
      - ".github/workflows/rocketmq-readable-routes.yml"
  workflow_dispatch:
    inputs:
      sdk_ref:
        description: Exact reviewed readable SDK candidate SHA; defaults to published RC source
        type: string
        required: true
        default: 5c2e3cd155e67c0f766e93bf95238b16fc219b5f
      pop_rebound_trace:
        description: Retain bounded revive metadata on POP timeout or failed confirmation in public fixtures
        type: boolean
        required: false
        default: false
      pop_isolated_ack_wait:
        description: Test the Broker ACK wait setting and verify retry absence in the owned public fixtures
        type: boolean
        required: false
        default: false
      pop_same_image_control:
        description: Compare default and opt-in POP settings in separate fixtures using the same built images
        type: boolean
        required: false
        default: false
permissions:
  contents: read
concurrency:
  group: rocketmq-readable-routes-${{ github.ref }}
  cancel-in-progress: true
jobs:
  readable:
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ inputs.pop_same_image_control && matrix.profile == 'public' && 55 || 30 }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - go: '1.25.9'
            python: '3.11'
            mysql: 'mysql:8.0.36'
            profile: public
          - go: '1.25.12'
            python: '3.13'
            mysql: 'mysql:8.4'
            profile: public
          - go: '1.25.12'
            python: '3.13'
            mysql: 'mysql:8.4'
            profile: live-recovery
    steps:
      - uses: actions/checkout@v6
      - uses: actions/checkout@v6
        with:
          repository: FangcunMount/reliable-messaging
          ref: ${{ inputs.sdk_ref || '5c2e3cd155e67c0f766e93bf95238b16fc219b5f' }}
          path: .sdk-acceptance
      - name: Bind all three profiles to the exact reviewed SDK candidate
        env:
          SDK_REF: ${{ inputs.sdk_ref || '5c2e3cd155e67c0f766e93bf95238b16fc219b5f' }}
        run: |
          set -euo pipefail
          [[ "$SDK_REF" =~ ^[0-9a-f]{40}$ ]]
          test "$(git -C .sdk-acceptance rev-parse HEAD)" = "$SDK_REF"
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ matrix.go }}
          cache-dependency-path: .sdk-acceptance/go.sum
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.12.13'
          python-version: ${{ matrix.python }}
      - name: POP metadata fail-closed contracts
        run: python3 -m unittest discover -s scripts/ops -p test_readable_pop_controls.py
      - name: Naming contracts
        run: python3 -m unittest discover -s scripts/rocketmq -p 'test_routes*.py'
      - name: Build verified isolated Broker
        run: |
          bash scripts/rocketmq/fetch-release.sh
          docker build --no-cache -t rocketmq-readable:5.5.1 components/rocketmq
      - name: Run the default public control on the same isolated Broker image
        if: inputs.pop_same_image_control && matrix.profile == 'public'
        env:
          POP_REBOUND_TRACE: ${{ inputs.pop_rebound_trace || false }}
          POP_ISOLATED_ACK_WAIT: ${{ inputs.pop_isolated_ack_wait || false }}
        run: |
          set -euo pipefail
          [[ "$POP_REBOUND_TRACE" == true && "$POP_ISOLATED_ACK_WAIT" == true ]]
          image="$(docker image inspect rocketmq-readable:5.5.1 --format '{{.Id}}')"
          [[ "$image" =~ ^sha256:[0-9a-f]{64}$ ]]
          printf '%s\n' "$image" > same-image-control.image
          status=0
          python3 scripts/rocketmq/ci-transactions.py --sdk-api-go --sdk-api-python --readable-routes \
            --sdk-pop-drain-controls --sdk-pop-rebound-trace --sdk "$PWD/.sdk-acceptance" \
            --image "$image" --mysql-image '${{ matrix.mysql }}' --report same-image-control.json || status=$?
          printf '%s\n' "$status" > same-image-control.exit
          test -s same-image-control.json
      - name: Real public Go/Python SDK with readable resources
        env:
          READABLE_PROFILE: ${{ matrix.profile }}
          POP_SAME_IMAGE_CONTROL: ${{ inputs.pop_same_image_control || false }}
          POP_REBOUND_TRACE: ${{ inputs.pop_rebound_trace || false }}
          POP_ISOLATED_ACK_WAIT: ${{ inputs.pop_isolated_ack_wait || false }}
        run: |
          set -euo pipefail
          options=()
          image=rocketmq-readable:5.5.1
          if [[ "$POP_SAME_IMAGE_CONTROL" == true && "$READABLE_PROFILE" == public ]]; then
            read -r image < same-image-control.image
            [[ "$image" =~ ^sha256:[0-9a-f]{64}$ ]]
          fi
          if [[ "$READABLE_PROFILE" == live-recovery ]]; then
            options=(--sdk-python-live-recovery)
          elif [[ "$READABLE_PROFILE" == public ]]; then
            options=(--sdk-pop-drain-controls)
            if [[ "$POP_REBOUND_TRACE" == true ]]; then options+=(--sdk-pop-rebound-trace); fi
            if [[ "$POP_ISOLATED_ACK_WAIT" == true ]]; then options+=(--sdk-pop-isolated-ack-wait); fi
          else
            exit 1
          fi
          python3 scripts/rocketmq/ci-transactions.py --sdk-api-go --sdk-api-python --readable-routes \
            "${options[@]}" --sdk "$PWD/.sdk-acceptance" --image "$image" \
            --mysql-image '${{ matrix.mysql }}' --report rocketmq-readable-sdk.json
      - name: Require complete original matrix and future-checkpoint controls
        if: always()
        env:
          READABLE_PROFILE: ${{ matrix.profile }}
          POP_ISOLATED_ACK_WAIT: ${{ inputs.pop_isolated_ack_wait || false }}
        run: |
          python3 - <<'PYPROOF'
          import json,os
          x=json.load(open('rocketmq-readable-sdk.json'))
          expected=5 if os.environ['READABLE_PROFILE']=='live-recovery' else 35
          assert x['passed']==len(x['cases'])==expected and x['failed']==x['skipped']==0
          assert all(x['cases'].values())
          assert x['cleanup']==dict(project_containers_remaining=False,compose_down_succeeded=True,
              probe_process_groups_drained=True,private_fixture_directory_removed=True)
          if os.environ['READABLE_PROFILE']=='public':
              controls=x['proof']['readable_pop_controls']
              assert set(controls)=={'go','python'}
              ack_wait=os.environ['POP_ISOLATED_ACK_WAIT']=='true'
              if ack_wait:
                  assert x['proof']['isolated_pop_ack_wait']==dict(enableSkipLongAwaitingAck='true',reviveAckWaitMs='60000')
              expected_lag = dict.fromkeys(map(str, range(8)), 0)
              for name,row in controls.items():
                  if ack_wait:
                      for stage in ('baseline', 'closed_confirmation'):
                          evidence=row[stage+'_retry_catalog']
                          assert evidence['checked']>0 and evidence['present_sha256s']==[]
                  assert row['held']['timing']>0 and row['held']['timer_series_present']
                  for stage in ('closed', 'closed_confirmation'):
                      sample = row[stage]
                      assert sample['offset_buffer']==sample['checkpoint_buffer']==sample['timing']==0
                      assert sample['timer_series_present'] and sample['revive_lag']==expected_lag
                  for suffix in ('_held_future_checkpoint_blocks_drain','_acked_and_closed_responsibility_zero'):
                      assert x['cases']['readable_pop_'+name+suffix] is True
          PYPROOF
      - name: Bind the default and opt-in reports to the same fixture image identities
        if: inputs.pop_same_image_control && matrix.profile == 'public'
        run: |
          python3 - <<'PYPAIR'
          import json
          from pathlib import Path
          default = json.loads(Path('same-image-control.json').read_bytes())
          candidate = json.loads(Path('rocketmq-readable-sdk.json').read_bytes())
          assert default['image'] == candidate['image'] == Path('same-image-control.image').read_text().strip()
          for key in ('sdk_sha', 'mysql_image', 'mongo_image'):
              assert default[key] == candidate[key]
          assert default['proof']['mysql_version'] == candidate['proof']['mysql_version']
          assert default['project'] != candidate['project']
          assert default['cleanup'] == candidate['cleanup'] == dict(project_containers_remaining=False,
              compose_down_succeeded=True, probe_process_groups_drained=True, private_fixture_directory_removed=True)
          assert default['proof']['effective_broker_parameters'] == candidate['proof']['effective_broker_parameters']
          assert 'isolated_pop_ack_wait' not in default['proof']
          assert default['proof']['pop_ack_wait_effective'] == dict(enableSkipLongAwaitingAck='false', reviveAckWaitMs='180000')
          assert candidate['proof']['pop_ack_wait_effective'] == candidate['proof']['isolated_pop_ack_wait']
          assert candidate['proof']['isolated_pop_ack_wait'] == dict(enableSkipLongAwaitingAck='true', reviveAckWaitMs='60000')
          status = int(Path('same-image-control.exit').read_text())
          assert status in (0, 1)
          assert (default['passed'], default['failed'], default['skipped']) == ((35, 0, 0) if status == 0 else (29, 1, 0))
          if status == 1:
              assert default['failure'] == 'RuntimeError: native_pop_control_budget_exceeded'
              timeout = default['proof']['readable_pop_controls']['go']['baseline_timeout']
              assert timeout['budget_seconds'] == 90 and any(timeout['last_sample']['revive_lag'].values())
          else:
              assert default['failure'] is None and all(default['cases'].values())
          PYPAIR
      - uses: actions/upload-artifact@v7
        if: always() && inputs.pop_same_image_control && matrix.profile == 'public'
        with:
          name: rocketmq-readable-default-${{ strategy.job-index }}-${{ github.sha }}
          path: |
            same-image-control.json
            same-image-control.exit
            same-image-control.image
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: rocketmq-readable-${{ strategy.job-index }}-${{ github.sha }}
          path: rocketmq-readable-sdk.json
          if-no-files-found: error
          retention-days: 14
