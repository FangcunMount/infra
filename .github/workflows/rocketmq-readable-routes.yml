name: RocketMQ readable route SDK acceptance
on:
  pull_request:
    paths:
      - "components/rocketmq/**"
      - "scripts/rocketmq/**"
      - "!scripts/rocketmq/qs_replan_acceptance.py"
      - "!scripts/rocketmq/test_qs_replan_acceptance.py"
      - "!scripts/rocketmq/image_fixtures/readable_replan_test.go"
      - "!scripts/rocketmq/test_readable_ci_policy.py"
      - "!scripts/rocketmq/readable_publish_candidates.py"
      - "!scripts/rocketmq/test_readable_publish_candidates.py"
      - "!scripts/rocketmq/readable_cutover.py"
      - "!scripts/rocketmq/readable_cutover_materials.py"
      - "!scripts/rocketmq/readable_cutover_receipt.py"
      - "!scripts/rocketmq/test_readable_cutover_materials.py"
      - "!scripts/rocketmq/test_readable_cutover_receipt.py"
      - ".github/workflows/rocketmq-readable-routes.yml"
  workflow_dispatch:
    inputs:
      sdk_ref:
        description: Exact reviewed readable SDK candidate SHA; defaults to published RC source
        type: string
        required: true
        default: 5c2e3cd155e67c0f766e93bf95238b16fc219b5f
permissions:
  contents: read
concurrency:
  group: rocketmq-readable-routes-${{ github.ref }}
  cancel-in-progress: true
jobs:
  readable:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - go: '1.25.9'
            python: '3.11'
            mysql: 'mysql:8.0.36'
            profile: public
          - go: '1.25.12'
            python: '3.13'
            mysql: 'mysql:8.4'
            profile: public
          - go: '1.25.12'
            python: '3.13'
            mysql: 'mysql:8.4'
            profile: live-recovery
    steps:
      - uses: actions/checkout@v6
      - uses: actions/checkout@v6
        with:
          repository: FangcunMount/reliable-messaging
          ref: ${{ inputs.sdk_ref || '5c2e3cd155e67c0f766e93bf95238b16fc219b5f' }}
          path: .sdk-acceptance
      - name: Bind all three profiles to the exact reviewed SDK candidate
        env:
          SDK_REF: ${{ inputs.sdk_ref || '5c2e3cd155e67c0f766e93bf95238b16fc219b5f' }}
        run: |
          set -euo pipefail
          [[ "$SDK_REF" =~ ^[0-9a-f]{40}$ ]]
          test "$(git -C .sdk-acceptance rev-parse HEAD)" = "$SDK_REF"
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ matrix.go }}
          cache-dependency-path: .sdk-acceptance/go.sum
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.12.13'
          python-version: ${{ matrix.python }}
      - name: Naming contracts
        run: python3 -m unittest discover -s scripts/rocketmq -p 'test_routes*.py'
      - name: Build verified isolated Broker
        run: |
          bash scripts/rocketmq/fetch-release.sh
          docker build --no-cache -t rocketmq-readable:5.5.1 components/rocketmq
      - name: Real public Go/Python SDK with readable resources
        env:
          READABLE_PROFILE: ${{ matrix.profile }}
        run: |
          set -euo pipefail
          options=()
          if [[ "$READABLE_PROFILE" == live-recovery ]]; then
            options=(--sdk-python-live-recovery)
          elif [[ "$READABLE_PROFILE" != public ]]; then
            exit 1
          fi
          python3 scripts/rocketmq/ci-transactions.py --sdk-api-go --sdk-api-python --readable-routes \
            "${options[@]}" --sdk "$PWD/.sdk-acceptance" --image rocketmq-readable:5.5.1 \
            --mysql-image '${{ matrix.mysql }}' --report rocketmq-readable-sdk.json
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: rocketmq-readable-${{ strategy.job-index }}-${{ github.sha }}
          path: rocketmq-readable-sdk.json
          if-no-files-found: error
          retention-days: 14
