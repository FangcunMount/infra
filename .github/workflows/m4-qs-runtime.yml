name: M4 QS final API worker and due dispatch
on:
  pull_request:
    paths:
      - scripts/rocketmq/host_sdk_contract.py
      - scripts/rocketmq/test_host_sdk_contract.py
      - scripts/rocketmq/qs_runtime_acceptance.py
      - scripts/rocketmq/test_qs_runtime_acceptance.py
      - scripts/rocketmq/qs_worker_acceptance.py
      - scripts/rocketmq/test_qs_worker_acceptance.py
      - scripts/rocketmq/qs_retry_dispatch_acceptance.py
      - scripts/rocketmq/test_qs_retry_dispatch_acceptance.py
      - scripts/rocketmq/test_python_live_recovery.py
      - scripts/rocketmq/route_read_probe.py
      - scripts/rocketmq/qs_recovery_acceptance.py
      - scripts/rocketmq/test_qs_recovery_acceptance.py
      - scripts/rocketmq/qs_report_acceptance.py
      - scripts/rocketmq/ci-transactions.py
      - .github/workflows/m4-qs-runtime.yml
  workflow_dispatch:
    inputs:
      rotation_recovery_only:
        description: Run only the explicit rotation recovery profile
        type: boolean
        default: false
      rotation_candidate:
        description: Explicit published SDK patch host-adoption acceptance
        type: boolean
        default: false
      qs_ref:
        description: Exact reviewed QS source SHA
        type: string
        required: true
      recovery_qs_ref:
        description: Optional exact host retirement M3-C QS SHA
        type: string
        required: false
      recovery_diagnostic_public_cert:
        description: Optional public recipient certificate for encrypted owned startup evidence; never a private key
        type: string
        required: false
permissions:
  contents: read
concurrency:
  group: m4-qs-runtime-${{ github.ref }}
  cancel-in-progress: false
jobs:
  native:
    if: ${{ !inputs.rotation_candidate }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        mysql: ['8.0.36', '8.0.44', '8.4.11']
    env:
      GOWORK: 'off'
      GOTOOLCHAIN: local
      QS_SHA: ${{ inputs.qs_ref || '9850d15f0fdc385ca8c5a6dd30e394145ee7a89c' }}
      WORKER_QS_SHA: 8dbb4291b4e730f1741818ac6d26efa98a507204
      WORKER_SDK_SHA: 48dfcdafbf29b44e99a5ac8b1ae01e5173138560
      INFRA_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.INFRA_SHA }}
      - uses: actions/checkout@v6
        with:
          repository: FangcunMount/reliable-messaging
          ref: 1345266aa0e864c46de5d1e3e3c939dd8002a890
          path: .sdk-acceptance
      - uses: actions/checkout@v6
        with:
          repository: FangcunMount/qs-server
          ref: ${{ env.QS_SHA }}
          path: .qs-acceptance
      - uses: actions/checkout@v6
        with:
          repository: FangcunMount/reliable-messaging
          ref: ${{ env.WORKER_SDK_SHA }}
          path: .sdk-worker-stable
      - uses: actions/checkout@v6
        with:
          repository: FangcunMount/qs-server
          ref: ${{ env.WORKER_QS_SHA }}
          path: .qs-worker-stable
      - uses: actions/setup-go@v6
        with:
          go-version: '1.25.12'
          cache-dependency-path: .qs-acceptance/go.sum
      - uses: astral-sh/setup-uv@v6
        with:
          # Probes own and remove their caches; this setup cache is unused.
          enable-cache: false
          version: '0.12.13'
          python-version: '3.13'
      - name: Exact source and published stable SDK without replacement
        run: |
          set -euo pipefail
          [[ "$QS_SHA" =~ ^[a-f0-9]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$INFRA_SHA"
          test "$(git -C .qs-acceptance rev-parse HEAD)" = "$QS_SHA"
          test "$(git -C .sdk-acceptance rev-parse HEAD)" = 1345266aa0e864c46de5d1e3e3c939dd8002a890
          python3 -m unittest discover -s scripts/rocketmq -p test_host_sdk_contract.py -v
          go -C .qs-acceptance list -m -json github.com/FangcunMount/reliable-messaging > "$RUNNER_TEMP/m4-sdk.json"
          python3 - "$RUNNER_TEMP/m4-sdk.json" <<'PY'
          import json,sys
          sys.path.insert(0,'scripts/rocketmq')
          from host_sdk_contract import stable_module_matches
          assert stable_module_matches(json.load(open(sys.argv[1])))
          PY
      - name: Exact frozen Worker implementation with published corrected dependency
        run: |
          set -euo pipefail
          test "$(git -C .qs-worker-stable rev-parse HEAD)" = "$WORKER_QS_SHA"
          test "$(git -C .sdk-worker-stable rev-parse HEAD)" = "$WORKER_SDK_SHA"
          # 8dbb4291 changes only go.mod/go.sum from the original9850d15.
          go -C .qs-worker-stable list -m -json github.com/FangcunMount/reliable-messaging > "$RUNNER_TEMP/worker-sdk.json"
          python3 - "$RUNNER_TEMP/worker-sdk.json" <<'PYGUARD'
          import json,sys
          sys.path.insert(0,'scripts/rocketmq')
          from host_sdk_contract import validate_rotation_module
          validate_rotation_module(json.load(open(sys.argv[1])))
          PYGUARD
      - name: Build verified isolated RocketMQ 5.5.1
        run: |
          set -euo pipefail
          bash scripts/rocketmq/fetch-release.sh
          docker build --no-cache -t rocketmq-m4-qs:5.5.1 components/rocketmq
      - name: Required current owners worker and original due dispatch
        env:
          MYSQL_IMAGE: mysql:${{ matrix.mysql }}
        run: |
          set -euo pipefail
          umask 077
          docker ps -aq | sort > "$RUNNER_TEMP/m4-containers-before"
          docker network ls --no-trunc -q | sort > "$RUNNER_TEMP/m4-networks-before"
          for profile in api worker dispatch; do
            profile_sdk="$PWD/.sdk-acceptance"
            case "$profile" in
              api) args=(--qs-runtime-host "$PWD/.qs-acceptance") ;;
              worker) profile_sdk="$PWD/.sdk-worker-stable"; args=(--qs-deferred-consumer-host "$PWD/.qs-worker-stable" --qs-deferred-kind worker --qs-receive-rotation-candidate) ;;
              dispatch) args=(--qs-retry-dispatch-host "$PWD/.qs-acceptance") ;;
            esac
            python3 scripts/rocketmq/ci-transactions.py --sdk "$profile_sdk" \
              --image rocketmq-m4-qs:5.5.1 --mysql-image "$MYSQL_IMAGE" \
              --report "m4-qs-${profile}.json" "${args[@]}"
          done
          docker ps -aq | sort > "$RUNNER_TEMP/m4-containers-after"
          docker network ls --no-trunc -q | sort > "$RUNNER_TEMP/m4-networks-after"
          cmp "$RUNNER_TEMP/m4-containers-before" "$RUNNER_TEMP/m4-containers-after"
          cmp "$RUNNER_TEMP/m4-networks-before" "$RUNNER_TEMP/m4-networks-after"
      - name: Nonempty zero skip complete reports
        if: always()
        run: |
          python3 - <<'PY'
          import json,os,hashlib
          from pathlib import Path
          rows=[]
          for name in ('api','worker','dispatch'):
              p=Path('m4-qs-'+name+'.json');x=json.loads(p.read_text())
              assert x['passed']>0 and x['failed']==x['skipped']==0
              assert x['passed']==len(x['cases']) and all(x['cases'].values())
              assert x['cleanup']==dict(project_containers_remaining=False,compose_down_succeeded=True,probe_process_groups_drained=True,private_fixture_directory_removed=True)
              if name=='worker':
                  from sys import path
                  path.insert(0,'scripts/rocketmq')
                  from host_sdk_contract import validate_rotation_module
                  assert x['sdk_sha']==os.environ['WORKER_SDK_SHA']
                  for key in ('qs_deferred_consumer_host','qs_deferred_mysql_component'):
                      proof=x['proof'][key]
                      assert proof['source_sha']==os.environ['WORKER_QS_SHA'] and proof['source_clean_after']
                      validate_rotation_module(proof['sdk_module'])
                  assert x['passed']==11
              else:
                  assert x['sdk_sha']=='1345266aa0e864c46de5d1e3e3c939dd8002a890'
              rows.append(dict(profile=name,source_sha=(os.environ['WORKER_QS_SHA'] if name=='worker' else os.environ['QS_SHA']),sdk_sha=x['sdk_sha'],passed=x['passed'],sha256=hashlib.sha256(p.read_bytes()).hexdigest()))
          Path('m4-qs-summary.json').write_text(json.dumps(dict(source_sha=os.environ['QS_SHA'],infra_sha=os.environ['INFRA_SHA'],profiles=rows,production=False,system_acceptance=False),indent=2)+'\n')
          PY
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: m4-qs-runtime-${{ matrix.mysql }}-${{ env.QS_SHA }}-${{ github.run_id }}
          path: m4-qs-*.json
          if-no-files-found: error
          retention-days: 14

  host-retirement-recovery:
    if: ${{ !inputs.rotation_candidate && (github.event_name == 'pull_request' || inputs.recovery_qs_ref != '') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GOWORK: 'off'
      GOTOOLCHAIN: local
      QS_SHA: ${{ inputs.recovery_qs_ref || 'e3039b867b0b6872183111e1fff02ebfe64209a6' }}
      SDK_SHA: 48dfcdafbf29b44e99a5ac8b1ae01e5173138560
      INFRA_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.INFRA_SHA }}
      - uses: actions/checkout@v6
        with:
          repository: FangcunMount/reliable-messaging
          ref: ${{ env.SDK_SHA }}
          path: .sdk-recovery
      - uses: actions/checkout@v6
        with:
          repository: FangcunMount/qs-server
          ref: ${{ env.QS_SHA }}
          path: .qs-recovery
      - uses: actions/setup-go@v6
        with:
          go-version: '1.25.12'
          cache-dependency-path: .qs-recovery/go.sum
      - uses: astral-sh/setup-uv@v6
        with:
          # Probes own and remove their caches; this setup cache is unused.
          enable-cache: false
          version: '0.12.13'
          python-version: '3.13'
      - name: Exact current retirement source and published SDK
        run: |
          set -euo pipefail
          [[ "$QS_SHA" =~ ^[a-f0-9]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$INFRA_SHA"
          test "$(git -C .qs-recovery rev-parse HEAD)" = "$QS_SHA"
          test "$(git -C .sdk-recovery rev-parse HEAD)" = "$SDK_SHA"
          python3 -m unittest discover -s scripts/rocketmq -p 'test_qs*acceptance.py' -v
          python3 -m unittest discover -s scripts/rocketmq -p test_python_live_recovery.py -v
          go -C .qs-recovery list -m -json github.com/FangcunMount/reliable-messaging > "$RUNNER_TEMP/m3c-sdk.json"
          python3 - "$RUNNER_TEMP/m3c-sdk.json" <<'PY'
          import json,sys
          sys.path.insert(0,'scripts/rocketmq')
          from host_sdk_contract import validate_rotation_module
          validate_rotation_module(json.load(open(sys.argv[1])))
          PY
      - name: Build verified owned RocketMQ 5.5.1
        run: |
          set -euo pipefail
          bash scripts/rocketmq/fetch-release.sh
          env -u DOCKER_CONTEXT -u DOCKER_TLS -u DOCKER_TLS_VERIFY -u DOCKER_CERT_PATH \
            docker --host=unix:///var/run/docker.sock build --no-cache \
            -t rocketmq-retirement-m3c:5.5.1 components/rocketmq
      - name: Actual Worker and Broker SIGKILL original redelivery and real Redis
        env:
          QS_M5_DIAGNOSTIC_PUBLIC_CERT: ${{ inputs.recovery_diagnostic_public_cert }}
          QS_M5_DIAGNOSTIC_DIRECTORY: ${{ runner.temp }}/m5-startup-diagnostics-${{ github.run_id }}
        run: |
          set -euo pipefail
          umask 077
          if [ -n "$QS_M5_DIAGNOSTIC_PUBLIC_CERT" ]; then
            install -d -m 0700 "$QS_M5_DIAGNOSTIC_DIRECTORY"
          fi
          local_docker() {
            env -u DOCKER_CONTEXT -u DOCKER_TLS -u DOCKER_TLS_VERIFY -u DOCKER_CERT_PATH \
              docker --host=unix:///var/run/docker.sock "$@"
          }
          local_docker ps -aq | sort > "$RUNNER_TEMP/m3c-containers-before"
          local_docker network ls --no-trunc -q | sort > "$RUNNER_TEMP/m3c-networks-before"
          env -u DOCKER_CONTEXT -u DOCKER_TLS -u DOCKER_TLS_VERIFY -u DOCKER_CERT_PATH \
            DOCKER_HOST=unix:///var/run/docker.sock \
            python3 scripts/rocketmq/ci-transactions.py \
            --sdk "$PWD/.sdk-recovery" --image rocketmq-retirement-m3c:5.5.1 \
            --mysql-image mysql:8.0.36 --qs-receive-rotation-candidate --qs-recovery-host "$PWD/.qs-recovery" \
            --report m3c-recovery.json
          local_docker ps -aq | sort > "$RUNNER_TEMP/m3c-containers-after"
          local_docker network ls --no-trunc -q | sort > "$RUNNER_TEMP/m3c-networks-after"
          cmp "$RUNNER_TEMP/m3c-containers-before" "$RUNNER_TEMP/m3c-containers-after"
          cmp "$RUNNER_TEMP/m3c-networks-before" "$RUNNER_TEMP/m3c-networks-after"
      - name: Require current source zero skip business proof and owned cleanup
        if: always()
        run: |
          python3 - <<'PY'
          import hashlib,json,os,sys
          from pathlib import Path
          sys.path.insert(0,'scripts/rocketmq')
          from qs_recovery_acceptance import CASES
          from host_sdk_contract import validate_rotation_module
          p=Path('m3c-recovery.json');x=json.loads(p.read_text())
          assert x['batch']=='host-retirement-M3-C-current-recovery'
          assert x['passed']>0 and x['failed']==x['skipped']==0
          assert len(x['cases'])==x['passed'] and all(x['cases'].values())
          assert x['sdk_sha']==os.environ['SDK_SHA']
          assert x['cleanup']==dict(project_containers_remaining=False,compose_down_succeeded=True,probe_process_groups_drained=True,private_fixture_directory_removed=True)
          proof=x['proof']['qs_runtime_host'];receipt=proof['native_receipt']
          assert proof['source_sha']==receipt['source_sha']==os.environ['QS_SHA']
          assert proof['source_clean_after'] and proof['native_exit_code']==0
          gates=proof['diagnostics']['recovery_gate']
          assert len(gates)==2 and not any(v['truncated'] for v in gates)
          replacement=next(v['counts'] for v in gates if v['worker']=='replacement')
          assert replacement['wait_started']>=1 and replacement['wait_completed']>=1
          assert replacement['contention_retry']==replacement['wait_exhausted']==replacement['ensure_failed']==0
          assert proof['manifest_version']==3 and proof['naming_scheme']=='readable-v1'
          validate_rotation_module(proof['sdk_module'])
          assert receipt['passed']==len(CASES) and receipt['failed']==receipt['skipped']==0
          assert set(receipt['cases'])==CASES and all(receipt['cases'].values())
          for flag in ('proxy_routes_ready','processing_lease_observed','real_redis','broker_sigkill','worker_sigkill','controlled_provider','worker_pids_distinct','owned_databases_dropped','no_existing_storage','no_production'):
              assert receipt[flag] is True
          assert type(receipt['proxy_routes_checked']) is int and 1 <= receipt['proxy_routes_checked'] <= 128
          assert type(receipt['processing_lease_ttl_ms']) is int and 0 < receipt['processing_lease_ttl_ms'] <= 300000
          Path('m3c-summary.json').write_text(json.dumps(dict(source_sha=os.environ['QS_SHA'],infra_sha=os.environ['INFRA_SHA'],sdk_sha=os.environ['SDK_SHA'],required_cases=len(CASES),report_sha256=hashlib.sha256(p.read_bytes()).hexdigest(),production=False,existing_storage=False),indent=2)+'\n')
          PY
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: host-retirement-m3c-${{ env.QS_SHA }}-${{ github.run_id }}
          path: m3c-*.json
          if-no-files-found: error
          retention-days: 14

      - uses: actions/upload-artifact@v7
        if: always() && inputs.recovery_diagnostic_public_cert != ''
        with:
          name: encrypted-owned-startup-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/m5-startup-diagnostics-${{ github.run_id }}/*.p7m
            ${{ runner.temp }}/m5-startup-diagnostics-${{ github.run_id }}/*.json
          if-no-files-found: ignore
          retention-days: 3
      - name: Remove owned encrypted diagnostic transport directory
        if: always() && inputs.recovery_diagnostic_public_cert != ''
        run: rm -rf -- "${RUNNER_TEMP:?}/m5-startup-diagnostics-${GITHUB_RUN_ID:?}"

  rotation-worker:
    if: ${{ github.event_name == 'pull_request' || (inputs.rotation_candidate && !inputs.rotation_recovery_only) }}
    name: rotation-worker (${{ matrix.profile }}, ${{ matrix.mysql }})
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - mysql: '8.0.36'
            profile: current
            qs: e3039b867b0b6872183111e1fff02ebfe64209a6
          - mysql: '8.0.44'
            profile: current
            qs: e3039b867b0b6872183111e1fff02ebfe64209a6
          - mysql: '8.4.11'
            profile: current
            qs: e3039b867b0b6872183111e1fff02ebfe64209a6
          - mysql: '8.0.44'
            profile: legacy
            qs: 8dbb4291b4e730f1741818ac6d26efa98a507204
          - mysql: '8.4.11'
            profile: legacy
            qs: 8dbb4291b4e730f1741818ac6d26efa98a507204
    env:
      GOWORK: 'off'
      GOTOOLCHAIN: local
      QS_SHA: ${{ matrix.qs }}
      INFRA_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.INFRA_SHA }}
      - uses: actions/checkout@v6
        with:
          repository: FangcunMount/reliable-messaging
          ref: 48dfcdafbf29b44e99a5ac8b1ae01e5173138560
          path: .sdk-acceptance
      - uses: actions/checkout@v6
        with:
          repository: FangcunMount/qs-server
          ref: ${{ env.QS_SHA }}
          path: .qs-acceptance
      - uses: actions/setup-go@v6
        with:
          go-version: '1.25.12'
          cache-dependency-path: .qs-acceptance/go.sum
      - uses: astral-sh/setup-uv@v6
        with:
          # Probes own and remove their caches; this setup cache is unused.
          enable-cache: false
          version: '0.12.13'
          python-version: '3.13'
      - name: Exact candidate source and published SDK v0.6.1 without replacement
        run: |
          set -euo pipefail
          [[ "$QS_SHA" =~ ^[a-f0-9]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$INFRA_SHA"
          test "$(git -C .qs-acceptance rev-parse HEAD)" = "$QS_SHA"
          test "$(git -C .sdk-acceptance rev-parse HEAD)" = 48dfcdafbf29b44e99a5ac8b1ae01e5173138560
          python3 -m unittest discover -s scripts/rocketmq -p test_host_sdk_contract.py -v
          go -C .qs-acceptance list -m -json github.com/FangcunMount/reliable-messaging > "$RUNNER_TEMP/m4-sdk.json"
          python3 - "$RUNNER_TEMP/m4-sdk.json" <<'PY'
          import json,sys
          sys.path.insert(0,'scripts/rocketmq')
          from host_sdk_contract import validate_rotation_module
          validate_rotation_module(json.load(open(sys.argv[1])))
          PY
      - name: Build verified isolated RocketMQ 5.5.1
        run: |
          set -euo pipefail
          bash scripts/rocketmq/fetch-release.sh
          docker build --no-cache -t rocketmq-m4-qs:5.5.1 components/rocketmq
      - name: Required actual Worker paused and active delivery
        env:
          MYSQL_IMAGE: mysql:${{ matrix.mysql }}
        run: |
          set -euo pipefail
          umask 077
          docker ps -aq | sort > "$RUNNER_TEMP/m4-containers-before"
          docker network ls --no-trunc -q | sort > "$RUNNER_TEMP/m4-networks-before"
          python3 scripts/rocketmq/ci-transactions.py --sdk "$PWD/.sdk-acceptance" \
            --image rocketmq-m4-qs:5.5.1 --mysql-image "$MYSQL_IMAGE" \
            --qs-deferred-consumer-host "$PWD/.qs-acceptance" --qs-deferred-kind worker \
            --report m4-qs-worker.json --qs-receive-rotation-candidate
          docker ps -aq | sort > "$RUNNER_TEMP/m4-containers-after"
          docker network ls --no-trunc -q | sort > "$RUNNER_TEMP/m4-networks-after"
          cmp "$RUNNER_TEMP/m4-containers-before" "$RUNNER_TEMP/m4-containers-after"
          cmp "$RUNNER_TEMP/m4-networks-before" "$RUNNER_TEMP/m4-networks-after"
      - name: Nonempty zero skip complete reports
        if: always()
        run: |
          python3 - <<'PY'
          import json,os,hashlib
          from pathlib import Path
          rows=[]
          for name in ('worker',):
              p=Path('m4-qs-'+name+'.json');x=json.loads(p.read_text())
              assert x['passed']==11 and x['failed']==x['skipped']==0
              assert x['passed']==len(x['cases']) and all(x['cases'].values())
              assert x['cleanup']==dict(project_containers_remaining=False,compose_down_succeeded=True,probe_process_groups_drained=True,private_fixture_directory_removed=True)
              assert x['sdk_sha']=='48dfcdafbf29b44e99a5ac8b1ae01e5173138560'
              rows.append(dict(profile=name,passed=x['passed'],sha256=hashlib.sha256(p.read_bytes()).hexdigest()))
          Path('m4-qs-summary.json').write_text(json.dumps(dict(source_sha=os.environ['QS_SHA'],infra_sha=os.environ['INFRA_SHA'],profiles=rows,production=False,system_acceptance=False),indent=2)+'\n')
          PY
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: rotation-worker-${{ matrix.mysql }}-${{ env.QS_SHA }}-${{ github.run_id }}
          path: m4-qs-*.json
          if-no-files-found: error
          retention-days: 14


  rotation-recovery:
    if: ${{ inputs.rotation_candidate }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GOWORK: 'off'
      GOTOOLCHAIN: local
      QS_SHA: e3039b867b0b6872183111e1fff02ebfe64209a6
      SDK_SHA: 48dfcdafbf29b44e99a5ac8b1ae01e5173138560
      INFRA_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.INFRA_SHA }}
      - uses: actions/checkout@v6
        with:
          repository: FangcunMount/reliable-messaging
          ref: ${{ env.SDK_SHA }}
          path: .sdk-recovery
      - uses: actions/checkout@v6
        with:
          repository: FangcunMount/qs-server
          ref: ${{ env.QS_SHA }}
          path: .qs-recovery
      - uses: actions/setup-go@v6
        with:
          go-version: '1.25.12'
          cache-dependency-path: .qs-recovery/go.sum
      - uses: astral-sh/setup-uv@v6
        with:
          # Probes own and remove their caches; this setup cache is unused.
          enable-cache: false
          version: '0.12.13'
          python-version: '3.13'
      - name: Exact current retirement source and published SDK v0.6.1
        run: |
          set -euo pipefail
          [[ "$QS_SHA" =~ ^[a-f0-9]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$INFRA_SHA"
          test "$(git -C .qs-recovery rev-parse HEAD)" = "$QS_SHA"
          test "$(git -C .sdk-recovery rev-parse HEAD)" = "$SDK_SHA"
          python3 -m unittest discover -s scripts/rocketmq -p 'test_qs*acceptance.py' -v
          python3 -m unittest discover -s scripts/rocketmq -p test_python_live_recovery.py -v
          go -C .qs-recovery list -m -json github.com/FangcunMount/reliable-messaging > "$RUNNER_TEMP/m3c-sdk.json"
          python3 - "$RUNNER_TEMP/m3c-sdk.json" <<'PY'
          import json,sys
          sys.path.insert(0,'scripts/rocketmq')
          from host_sdk_contract import validate_rotation_module
          validate_rotation_module(json.load(open(sys.argv[1])))
          PY
      - name: Build verified owned RocketMQ 5.5.1
        run: |
          set -euo pipefail
          bash scripts/rocketmq/fetch-release.sh
          env -u DOCKER_CONTEXT -u DOCKER_TLS -u DOCKER_TLS_VERIFY -u DOCKER_CERT_PATH \
            docker --host=unix:///var/run/docker.sock build --no-cache \
            -t rocketmq-retirement-m3c:5.5.1 components/rocketmq
      - name: Actual Worker and Broker SIGKILL original redelivery and real Redis
        run: |
          set -euo pipefail
          umask 077
          local_docker() {
            env -u DOCKER_CONTEXT -u DOCKER_TLS -u DOCKER_TLS_VERIFY -u DOCKER_CERT_PATH \
              docker --host=unix:///var/run/docker.sock "$@"
          }
          local_docker ps -aq | sort > "$RUNNER_TEMP/m3c-containers-before"
          local_docker network ls --no-trunc -q | sort > "$RUNNER_TEMP/m3c-networks-before"
          env -u DOCKER_CONTEXT -u DOCKER_TLS -u DOCKER_TLS_VERIFY -u DOCKER_CERT_PATH \
            DOCKER_HOST=unix:///var/run/docker.sock \
            python3 scripts/rocketmq/ci-transactions.py \
            --sdk "$PWD/.sdk-recovery" --image rocketmq-retirement-m3c:5.5.1 \
            --mysql-image mysql:8.0.36 --qs-receive-rotation-candidate --qs-recovery-host "$PWD/.qs-recovery" \
            --report m3c-recovery.json
          local_docker ps -aq | sort > "$RUNNER_TEMP/m3c-containers-after"
          local_docker network ls --no-trunc -q | sort > "$RUNNER_TEMP/m3c-networks-after"
          cmp "$RUNNER_TEMP/m3c-containers-before" "$RUNNER_TEMP/m3c-containers-after"
          cmp "$RUNNER_TEMP/m3c-networks-before" "$RUNNER_TEMP/m3c-networks-after"
      - name: Require current source zero skip business proof and owned cleanup
        if: always()
        run: |
          python3 - <<'PY'
          import hashlib,json,os,sys
          from pathlib import Path
          sys.path.insert(0,'scripts/rocketmq')
          from qs_recovery_acceptance import CASES
          from host_sdk_contract import validate_rotation_module
          p=Path('m3c-recovery.json');x=json.loads(p.read_text())
          assert x['batch']=='host-retirement-M3-C-current-recovery'
          assert x['passed']>0 and x['failed']==x['skipped']==0
          assert len(x['cases'])==x['passed'] and all(x['cases'].values())
          assert x['sdk_sha']==os.environ['SDK_SHA']
          assert x['cleanup']==dict(project_containers_remaining=False,compose_down_succeeded=True,probe_process_groups_drained=True,private_fixture_directory_removed=True)
          proof=x['proof']['qs_runtime_host'];receipt=proof['native_receipt']
          assert proof['source_sha']==receipt['source_sha']==os.environ['QS_SHA']
          assert proof['source_clean_after'] and proof['native_exit_code']==0
          gates=proof['diagnostics']['recovery_gate']
          assert len(gates)==2 and not any(v['truncated'] for v in gates)
          replacement=next(v['counts'] for v in gates if v['worker']=='replacement')
          assert replacement['wait_started']>=1 and replacement['wait_completed']>=1
          assert replacement['contention_retry']==replacement['wait_exhausted']==0

          assert proof['manifest_version']==3 and proof['naming_scheme']=='readable-v1'
          validate_rotation_module(proof['sdk_module'])
          assert receipt['passed']==len(CASES) and receipt['failed']==receipt['skipped']==0
          assert set(receipt['cases'])==CASES and all(receipt['cases'].values())
          for flag in ('proxy_routes_ready','processing_lease_observed','real_redis','broker_sigkill','worker_sigkill','controlled_provider','worker_pids_distinct','owned_databases_dropped','no_existing_storage','no_production'):
              assert receipt[flag] is True
          assert type(receipt['proxy_routes_checked']) is int and 1 <= receipt['proxy_routes_checked'] <= 128
          assert type(receipt['processing_lease_ttl_ms']) is int and 0 < receipt['processing_lease_ttl_ms'] <= 300000
          Path('m3c-summary.json').write_text(json.dumps(dict(source_sha=os.environ['QS_SHA'],infra_sha=os.environ['INFRA_SHA'],sdk_sha=os.environ['SDK_SHA'],required_cases=len(CASES),report_sha256=hashlib.sha256(p.read_bytes()).hexdigest(),production=False,existing_storage=False),indent=2)+'\n')
          PY
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: rotation-recovery-${{ env.QS_SHA }}-${{ github.run_id }}
          path: m3c-*.json
          if-no-files-found: error
          retention-days: 14
