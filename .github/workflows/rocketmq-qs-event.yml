name: RocketMQ QS AI events original SQL and Broker
on:
  workflow_dispatch:
    inputs:
      qs_ref:
        description: Exact QS AI event candidate SHA
        type: string
        required: true
        default: 4fed2b588b9d16c11e76304edb3d9762f1a7933f
  pull_request:
    paths: ['scripts/rocketmq/qs_event_acceptance.py', 'scripts/rocketmq/test_qs_event_acceptance.py', 'scripts/rocketmq/ci-transactions.py', '.github/workflows/rocketmq-qs-event.yml']
permissions:
  contents: read
env:
  GOTOOLCHAIN: local
concurrency:
  group: rocketmq-qs-event-${{ github.ref }}
  cancel-in-progress: true
jobs:
  original-event-root:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        # QS go.mod requires 1.25.12. The separate SDK workflow retains its
        # own 1.25.9/1.25.12 compatibility matrix.
        go: ['1.25.12']
        mysql: ['mysql:8.0.36', 'mysql:8.0.44', 'mysql:8.4.11']
    steps:
      - uses: actions/checkout@v6
      - uses: actions/checkout@v6
        with:
          repository: FangcunMount/reliable-messaging
          ref: 8fb6fc57a415dc11e27fc64d71722f9675838bc3
          path: .sdk-acceptance
      - uses: actions/checkout@v6
        with:
          repository: FangcunMount/qs-server
          ref: ${{ inputs.qs_ref || '4fed2b588b9d16c11e76304edb3d9762f1a7933f' }}
          path: .qs-acceptance
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ matrix.go }}
          cache-dependency-path: .qs-acceptance/go.sum
      - name: Verify candidate and source harness
        env:
          EXPECTED_QS_SHA: ${{ inputs.qs_ref || '4fed2b588b9d16c11e76304edb3d9762f1a7933f' }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED_QS_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git -C .qs-acceptance rev-parse HEAD)" = "$EXPECTED_QS_SHA"
          python3 -m unittest discover -s scripts/rocketmq -p 'test_*.py'
      - name: Build verified isolated Broker
        run: |
          set -euo pipefail
          bash scripts/rocketmq/fetch-release.sh
          docker build --no-cache -t rocketmq-qs-event:5.5.1 components/rocketmq
      - name: Required actual QS authenticated event receiver and original SQL roots
        run: |
          set -euo pipefail
          python3 scripts/rocketmq/ci-transactions.py --sdk "$PWD/.sdk-acceptance" \
            --qs-event-host "$PWD/.qs-acceptance" --image rocketmq-qs-event:5.5.1 \
            --mysql-image "${{ matrix.mysql }}" --report rocketmq-qs-event.json
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: rocketmq-qs-event-${{ strategy.job-index }}-${{ matrix.go }}-${{ github.sha }}
          path: rocketmq-qs-event.json
          if-no-files-found: error
          retention-days: 14
