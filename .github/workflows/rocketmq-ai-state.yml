name: RocketMQ AI original SQL state roots and published SDK
on:
  workflow_dispatch:
    inputs:
      ai_ref:
        description: Exact AI original state root candidate SHA
        type: string
        required: true
        default: b3b6072551f495ddde0ab2829d4e177b2d1a5674
  pull_request:
    paths: ['scripts/rocketmq/ai_admission_acceptance.py', 'scripts/rocketmq/ai_state_acceptance.py', 'scripts/rocketmq/test_ai_state_acceptance.py', 'scripts/rocketmq/ci-transactions.py', '.github/workflows/rocketmq-ai-state.yml', 'Makefile']
permissions:
  contents: read
concurrency:
  group: rocketmq-ai-state-${{ github.ref }}
  cancel-in-progress: true
jobs:
  original-worker-state:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.13']
        mysql: ['mysql:8.0.36', 'mysql:8.0.44', 'mysql:8.4.11']
    steps:
      - uses: actions/checkout@v6
      - uses: actions/checkout@v6
        with:
          repository: FangcunMount/reliable-messaging
          ref: 8de893b367cc797580799abd8325f41dd62356db
          path: .sdk-acceptance
      - uses: actions/checkout@v6
        with:
          repository: FangcunMount/qs-ai
          ref: ${{ inputs.ai_ref || 'b3b6072551f495ddde0ab2829d4e177b2d1a5674' }}
          path: .ai-acceptance
      - uses: actions/setup-go@v6
        with:
          go-version: '1.25.12'
          cache-dependency-path: .sdk-acceptance/go.sum
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.12.13'
          python-version: ${{ matrix.python }}
      - name: Verify exact AI state candidate and receipt gates
        env:
          EXPECTED_AI_SHA: ${{ inputs.ai_ref || 'b3b6072551f495ddde0ab2829d4e177b2d1a5674' }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED_AI_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git -C .ai-acceptance rev-parse HEAD)" = "$EXPECTED_AI_SHA"
          python3 -m unittest discover -s scripts/rocketmq -p 'test_*.py'
      - name: Build verified isolated Broker
        run: |
          set -euo pipefail
          bash scripts/rocketmq/fetch-release.sh
          docker build --no-cache -t rocketmq-ai-state:5.5.1 components/rocketmq
      - name: Required worker, governance, SDK and original state roots
        run: |
          set -euo pipefail
          make rocketmq-ai-state-test SDK_DIR="$PWD/.sdk-acceptance" AI_DIR="$PWD/.ai-acceptance" \
            ROCKETMQ_TEST_IMAGE=rocketmq-ai-state:5.5.1 \
            AI_ACCEPTANCE_PYTHON='${{ matrix.python }}' ROCKETMQ_TEST_MYSQL_IMAGE='${{ matrix.mysql }}' \
            ROCKETMQ_AI_STATE_REPORT=rocketmq-ai-state.json
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: rocketmq-ai-state-${{ strategy.job-index }}-${{ matrix.python }}-${{ github.sha }}
          path: rocketmq-ai-state.json
          if-no-files-found: error
          retention-days: 14
