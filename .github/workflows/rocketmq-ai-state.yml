name: RocketMQ AI original SQL state roots and published SDK
on:
  workflow_dispatch:
    inputs:
      ai_ref:
        description: Exact AI original state root candidate SHA
        type: string
        required: true
        default: 6be5f80905c5c499017e96391282a994c033958e
      protection:
        description: Require current protocol guard and published a4 (not the a2 baseline)
        type: boolean
        default: false
      native_limit:
        description: Require actual SYS index, durable host deny and new default owner (separate from protection)
        type: boolean
        default: false
      native_origin:
        description: Trace the exact AI original root to its own SYS index in native_limit mode
        type: boolean
        default: false
      managed_original:
        description: Run stable Go recovery and named AI reopen on the same original root
        type: boolean
        default: false
      execution_image:
        description: Run the exact managed AI recovery through its isolated Linux execution image
        type: boolean
        default: false
      coordinated_image:
        description: Use the actual Linux coordinator and named bridge for recovery and resolution
        type: boolean
        default: false
      observed_check_budget:
        description: Exercise the observed 30 second / 15 check budget in the owned coordinated fixture
        type: boolean
        default: false
      profile:
        description: Development is one interpreter/MySQL; full is required for final gate
        type: choice
        options: [full, development]
        default: full
  pull_request:
    paths: ['scripts/rocketmq/native_limit_acceptance.py', 'scripts/rocketmq/test_native_limit_acceptance.py', 'scripts/rocketmq/probes/native-transaction-limit/**', 'scripts/rocketmq/ai_admission_acceptance.py', 'scripts/rocketmq/ai_native_origin_acceptance.py', 'scripts/rocketmq/ai_native_origin_case.py', 'scripts/rocketmq/managed_recovery_image.py', 'scripts/rocketmq/managed_recovery_acceptance.py', 'scripts/rocketmq/ci_coordinated_recovery.py', 'scripts/rocketmq/ai_state_acceptance.py', 'scripts/rocketmq/test_ai_state_acceptance.py', 'scripts/rocketmq/ci-transactions.py', '.github/workflows/rocketmq-ai-state.yml', 'Makefile']
permissions:
  contents: read
concurrency:
  group: rocketmq-ai-state-${{ github.ref }}
  cancel-in-progress: true
jobs:
  original-worker-state:
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ inputs.observed_check_budget == true && 45 || 30 }}
    strategy:
      fail-fast: false
      matrix:
        python: ${{ fromJSON(inputs.profile == 'development' && '["3.13"]' || '["3.11","3.13"]') }}
        mysql: ${{ fromJSON(inputs.profile == 'development' && '["mysql:8.0.36"]' || '["mysql:8.0.36","mysql:8.0.44","mysql:8.4.11"]') }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/checkout@v6
        with:
          repository: FangcunMount/reliable-messaging
          ref: ${{ (inputs.protection == true || inputs.native_limit == true) && '04757bd3212ca961d8eaec22ecd3560101111e18' || '8de893b367cc797580799abd8325f41dd62356db' }}
          path: .sdk-acceptance
      - uses: actions/checkout@v6
        with:
          repository: FangcunMount/qs-ai
          ref: ${{ inputs.ai_ref || '6be5f80905c5c499017e96391282a994c033958e' }}
          path: .ai-acceptance
      - uses: actions/setup-go@v6
        with:
          go-version: '1.25.12'
          cache-dependency-path: .sdk-acceptance/go.sum
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.12.13'
          python-version: ${{ matrix.python }}
      - name: Verify exact AI state candidate and receipt gates
        env:
          EXPECTED_AI_SHA: ${{ inputs.ai_ref || '6be5f80905c5c499017e96391282a994c033958e' }}
        run: |
          set -euo pipefail
          test '${{ inputs.protection == true && inputs.native_limit == true }}' != true
          test '${{ inputs.native_origin == true && inputs.native_limit != true }}' != true
          test '${{ inputs.managed_original == true && inputs.native_origin != true }}' != true
          test '${{ inputs.execution_image == true && inputs.managed_original != true }}' != true
          test '${{ inputs.coordinated_image == true && inputs.execution_image != true }}' != true
          test '${{ inputs.observed_check_budget == true && inputs.coordinated_image != true }}' != true
          [[ "$EXPECTED_AI_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git -C .ai-acceptance rev-parse HEAD)" = "$EXPECTED_AI_SHA"
          python3 -m unittest discover -s scripts/rocketmq -p 'test_*.py'
      - uses: actions/setup-java@v5
        if: inputs.managed_original == true && inputs.execution_image != true
        with:
          distribution: temurin
          java-version: '17'
      - name: Compile exact clean stable recovery CLI
        if: inputs.managed_original == true
        env:
          CGO_ENABLED: ${{ inputs.execution_image == true && '0' || '1' }}
        run: |
          set -euo pipefail
          umask 077
          git clone --quiet --shared --no-checkout . "$RUNNER_TEMP/clean-native-recovery"
          git -C "$RUNNER_TEMP/clean-native-recovery" checkout --quiet --detach "$GITHUB_SHA"
          cd "$RUNNER_TEMP/clean-native-recovery/tools/rocketmq-native-recovery"
          test -z "$(git status --porcelain)"
          GOWORK=off GOFLAGS=-mod=readonly go build -trimpath -buildvcs=true \
            -ldflags "-X main.sourceSHA=$GITHUB_SHA" -o "$RUNNER_TEMP/native-recovery" ./cmd/native-recovery
          "$RUNNER_TEMP/native-recovery" version
      - name: Build verified isolated Broker
        run: |
          set -euo pipefail
          bash scripts/rocketmq/fetch-release.sh
          docker build --no-cache -t rocketmq-ai-state:5.5.1 components/rocketmq
      - name: Build the exact restricted Linux recovery image
        if: inputs.execution_image == true
        run: |
          set -euo pipefail
          umask 077
          context="$RUNNER_TEMP/recovery-image-context"
          mkdir "$context"
          cp tools/rocketmq-native-recovery/image/{Dockerfile,managed-java.sh} "$context/"
          cp scripts/rocketmq/probes/native-recheck/{NativeHalfIdentity.java,NativeHalfManaged.java} "$context/"
          cp components/rocketmq/rocketmq.zip "$context/"
          cp "$RUNNER_TEMP/native-recovery" "$context/"
          digest="$(sha256sum "$context/native-recovery" | cut -d' ' -f1)"
          tag="f07-recovery-fixture:$GITHUB_SHA"
          docker build --platform linux/amd64 --network none -t "$tag" \
            --build-arg SOURCE_SHA="$GITHUB_SHA" --build-arg CLI_SHA256="$digest" \
            "$context"
          docker image inspect "$tag" --format '{{.Id}}' > "$RUNNER_TEMP/recovery-image.id"
      - name: Exercise the actual Linux coordinator and recovery container entrypoint
        if: inputs.execution_image == true
        run: |
          set -euo pipefail
          umask 077
          python3 scripts/rocketmq/ci-native-recovery-container.py \
            --image "$(cat "$RUNNER_TEMP/recovery-image.id")" --source "$GITHUB_SHA" \
            > "$RUNNER_TEMP/native-container-coordinator.json"
          jq -e '.linux_coordinator and .failed_before_native_effect and .owned_fixture_cleaned' \
            "$RUNNER_TEMP/native-container-coordinator.json"
      - name: Required worker, governance, SDK and original state roots
        env:
          QS_AI_NATIVE_ORIGIN: ${{ inputs.native_origin == true && 'true' || 'false' }}
          QS_AI_EXECUTION_IMAGE: ${{ inputs.execution_image == true && 'true' || 'false' }}
          QS_AI_COORDINATED_IMAGE: ${{ inputs.coordinated_image == true && 'true' || 'false' }}
          QS_AI_MANAGED_ORIGINAL: ${{ inputs.managed_original == true && 'true' || 'false' }}
          QS_AI_ACCEPTANCE_KIND: ${{ inputs.native_limit == true && 'native_limit' || inputs.protection == true && 'protection' || 'state' }}
          QS_AI_OBSERVED_CHECK_BUDGET: ${{ inputs.observed_check_budget == true && 'true' || 'false' }}
        run: |
          set -euo pipefail
          if [[ "$QS_AI_MANAGED_ORIGINAL" == true ]]; then
            export QS_AI_NATIVE_RECOVERY_BIN="$RUNNER_TEMP/native-recovery"
          fi
          if [[ "$QS_AI_EXECUTION_IMAGE" == true ]]; then
            QS_AI_NATIVE_RECOVERY_IMAGE="$(cat "$RUNNER_TEMP/recovery-image.id")"
            export QS_AI_NATIVE_RECOVERY_IMAGE
          fi
          extra=()
          if [[ "$QS_AI_OBSERVED_CHECK_BUDGET" == true ]]; then
            extra+=(--ai-native-observed-budget)
          fi
          QS_AI_ACCEPTANCE_PYTHON='${{ matrix.python }}' python3 scripts/rocketmq/ci-transactions.py \
            --sdk "$PWD/.sdk-acceptance" --ai-admission-host "$PWD/.ai-acceptance" \
            --image rocketmq-ai-state:5.5.1 --mysql-image '${{ matrix.mysql }}' --report rocketmq-ai-state.json "${extra[@]}"
          if [[ "$QS_AI_OBSERVED_CHECK_BUDGET" == true ]]; then
            jq -e '.proof.effective_broker_parameters ==
              {"transactionTimeOut":6000,"transactionCheckInterval":30000,"transactionCheckMax":15,"fileReservedTime":48}
              and (.proof.ai_state_host.original_native |
                .check_budget_mode == "observed" and .index_wait_seconds == 600 and .broker_parameters_restored
                and .broker_parameters_before_fault == .broker_parameters_during_fault and .native_index_records == 1
                and .native_admin_check_budget == {"interval_ms":30000,"max_checks":15})' rocketmq-ai-state.json
          fi
          if [[ "$QS_AI_COORDINATED_IMAGE" == true ]]; then
            jq -e '.proof.coordinated_host_loopback ==
              {"broker_verified_tls_h2":true,"advertised_broker_verified_tls_h2":true,"mysql_protocol_greeting":true}
              and .proof.coordinated_host_alias_removed and .proof.coordinated_project_networks_removed and (.proof.ai_state_host.original_native |
              .original_fault_broker_networks_disconnected == 2 and (.coordinated_image_steps | length) == 3 and
              all(.coordinated_image_steps[]; .container_plan_schema == "m3-native-recovery-container/v2" and
                .exit_code == 0 and .uid == 3000 and (.network_id | test("^[0-9a-f]{64}$"))) and
              ([.coordinated_image_steps[].network_id] | unique | length) == 1 and .coordinated_image_cleanup and
              .ai_reopen.broker_ack and .ai_reopen.no_new_half)' rocketmq-ai-state.json
          fi
      - name: Seal the exact exercised execution image
        if: inputs.execution_image == true
        run: |
          set -euo pipefail
          umask 077
          image="$(cat "$RUNNER_TEMP/recovery-image.id")"
          jq -e --arg image "$image" '.proof.ai_state_host.original_native.execution_image.image_id == $image' rocketmq-ai-state.json
          docker image save --output "$RUNNER_TEMP/exercised-recovery-image.tar" "$image"
          python3 tools/rocketmq-native-recovery/image/verify-archive.py "$RUNNER_TEMP/exercised-recovery-image.tar" \
            --source "$GITHUB_SHA" --image "$image" > "$RUNNER_TEMP/exercised-recovery-image.json"
          gzip -1 "$RUNNER_TEMP/exercised-recovery-image.tar"
      - uses: actions/upload-artifact@v7
        if: inputs.execution_image == true
        with:
          name: isolated-exercised-recovery-image-${{ strategy.job-index }}-${{ github.sha }}
          path: |
            ${{ runner.temp }}/exercised-recovery-image.tar.gz
            ${{ runner.temp }}/exercised-recovery-image.json
            ${{ runner.temp }}/native-container-coordinator.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: rocketmq-ai-state-${{ strategy.job-index }}-${{ matrix.python }}-${{ github.sha }}
          path: rocketmq-ai-state.json
          if-no-files-found: error
          retention-days: 14
