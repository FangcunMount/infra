name: M4 final cleanup eight-instance candidate rebuild
on:
  pull_request:
    paths:
      - scripts/rocketmq/m4_final_image_candidates.py
      - scripts/rocketmq/test_m4_final_image_candidates.py
      - components/rocketmq/m4-final-image-candidates.json
      - .github/workflows/m4-final-image-rebuild.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: m4-final-config-rebuild-${{ github.ref }}
  cancel-in-progress: false
jobs:
  contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      iam_sha: ${{ steps.candidate.outputs.iam_sha }}
      qs_sha: ${{ steps.candidate.outputs.qs_sha }}
      ai_sha: ${{ steps.candidate.outputs.ai_sha }}
      builder_sha: ${{ steps.candidate.outputs.builder_sha }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Immutable reviewed current candidate manifest
        id: candidate
        run: |
          python3 - <<'PYOUT'
          import os,sys
          from pathlib import Path
          sys.path.insert(0,'scripts/rocketmq')
          from m4_final_image_candidates import read
          value,digest=read(Path('components/rocketmq/m4-final-image-candidates.json'))
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:
              for role,sha in value['sources'].items(): f.write(role+'_sha='+sha+'\n')
              f.write('builder_sha='+value['builder_sha']+'\n')
          PYOUT
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.12.13'
          python-version: '3.13'
      - name: Exact provenance and no-side-effect fixture protection
        run: |
          set -euo pipefail
          for test in test_m4_final_image_candidates.py test_m4_image_rebuild.py test_iam_image_start.py test_image_start_provenance.py test_qs_image_pair.py test_qs_consumer_contract.py; do
            uv run --no-project --with pyyaml==6.0.2 python -m unittest discover -s scripts/rocketmq -p "$test"
          done
  eight-instances:
    needs: contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: read
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      GOWORK: 'off'
      GOTOOLCHAIN: local
      IAM_SHA: ${{ needs.contracts.outputs.iam_sha }}
      QS_SHA: ${{ needs.contracts.outputs.qs_sha }}
      AI_SHA: ${{ needs.contracts.outputs.ai_sha }}
      REVIEWED_BUILDER_SHA: ${{ needs.contracts.outputs.builder_sha }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/checkout@v6
        with:
          repository: FangcunMount/iam
          ref: ${{ env.IAM_SHA }}
          path: .five-sources/iam
      - uses: actions/checkout@v6
        with:
          repository: FangcunMount/qs-server
          ref: ${{ env.QS_SHA }}
          path: .five-sources/qs
      - uses: actions/checkout@v6
        with:
          repository: FangcunMount/qs-ai
          ref: ${{ env.AI_SHA }}
          path: .five-sources/ai
      - uses: actions/setup-go@v6
        with:
          go-version: '1.25.12'
          cache-dependency-path: |
            .five-sources/iam/go.sum
            .five-sources/qs/go.sum
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.12.13'
          python-version: '3.13'
      - name: Actual source mount contract before compiling or starting containers
        run: |
          set -euo pipefail
          uv run --no-project --with pyyaml==6.0.2 python - <<'PY'
          from pathlib import Path
          import sys
          sys.path.insert(0,'scripts/rocketmq')
          from m4_image_rebuild import projected_mounts
          value=projected_mounts(Path('.five-sources/iam'),Path('.five-sources/qs'),'m4-owned-check')
          assert len(value['iam'])==len(value['worker'])==3 and not value['collection']
          PY
      - name: Exact successful reviewed build and five archives
        run: |
          set -euo pipefail
          umask 077
          python3 - <<'PYBUILDS'
          import json,os,sys,subprocess
          from pathlib import Path
          sys.path.insert(0,'scripts/rocketmq')
          from m4_final_image_candidates import read
          value,_=read(Path('components/rocketmq/m4-final-image-candidates.json'))
          for run_id in sorted(set(value['image_runs'].values())):
              raw=subprocess.check_output(['gh','api',f'repos/{os.environ["GITHUB_REPOSITORY"]}/actions/runs/{run_id}'])
              run=json.loads(raw)
              assert str(run['id'])==run_id and run['head_sha']==value['builder_sha']==os.environ['REVIEWED_BUILDER_SHA']
              assert run['conclusion']=='success' and run['event']=='workflow_dispatch'
          PYBUILDS
          mkdir -m 700 .five-candidates
          for target in iam qs-api qs-collection qs-worker ai; do
            IMAGE_RUN_ID="$(python3 -c 'import json,sys;print(json.load(open("components/rocketmq/m4-final-image-candidates.json"))["image_runs"][sys.argv[1]])' "$target")"
            case "$target" in
              iam) source_sha="$IAM_SHA" ;;
              ai) source_sha="$AI_SHA" ;;
              *) source_sha="$QS_SHA" ;;
            esac
            mkdir -m 700 ".five-candidates/$target"
            gh run download "$IMAGE_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "m3-final-image-metadata-$target-$source_sha-$IMAGE_RUN_ID" --dir ".five-candidates/$target"
            gh run download "$IMAGE_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "m3-final-image-archive-$target-$source_sha-$IMAGE_RUN_ID" --dir ".five-candidates/$target"
          done
      - name: Actual Go binding codec before database or Broker containers
        run: |
          set -euo pipefail
          umask 077
          uv run --no-project --with pyyaml==6.0.2 python - <<'PY'
          import json,sys,os,subprocess
          from pathlib import Path
          import yaml
          sys.path.insert(0,'scripts/rocketmq')
          from m4_image_rebuild import api_configuration
          from qs_runtime_configuration import configuration
          from audit_transaction_limit import write_private
          source=Path('.five-sources/qs').resolve()
          root=Path('.m4-codec').resolve();root.mkdir(mode=0o700)
          base=configuration(yaml.safe_load((source/'configs/apiserver.prod.yaml').read_text()),'api','qs_m3_image_codec','synthetic-only','d'*64)
          binding=api_configuration(source,base,'m4-owned-codec')
          write_private(root/'base.json',base);write_private(root/'binding.json',binding)
          d=source/'scripts/testing/m4_binding_codec';d.mkdir();f=d/'main.go'
          code=Path('scripts/rocketmq/image_fixtures/m4_binding_codec.go').read_bytes()
          try:
              f.write_bytes(code)
              with Path('m4-binding-codec.json').open('x') as output:
                  subprocess.run(['go','run','-ldflags','-X github.com/FangcunMount/qs-server/pkg/version.GitCommit='+os.environ['QS_SHA'],
                      './scripts/testing/m4_binding_codec',str(root/'binding.json'),str(root/'base.json')],cwd=source,stdout=output,check=True)
          finally:
              if f.exists():
                  assert f.read_bytes()==code
                  f.unlink()
              d.rmdir()
          x=json.loads(Path('m4-binding-codec.json').read_bytes())
          assert x['source_sha']==os.environ['QS_SHA'] and x['passed']==3 and x['failed']==x['skipped']==0
          PY
      - name: Compile original current-schema and consumer registry fixtures
        run: |
          set -euo pipefail
          fixture="$GITHUB_WORKSPACE/.five-sources/qs/internal/pkg/migration/m3_image_pair_fixture_test.go"
          iam_fixture="$GITHUB_WORKSPACE/.five-sources/iam/scripts/testing/m3_five_image_fixture"
          consumer_fixture="$GITHUB_WORKSPACE/.five-sources/qs/scripts/testing/m3_consumer_contract"
          test ! -e "$fixture"
          test ! -e "$iam_fixture"
          test ! -e "$consumer_fixture"
          mkdir "$iam_fixture" "$consumer_fixture"
          trap 'rm -f "$fixture" "$iam_fixture/main.go" "$consumer_fixture/main.go"; rmdir "$iam_fixture" "$consumer_fixture"' EXIT
          cp scripts/rocketmq/image_fixtures/qs_init_test.go "$fixture"
          cp scripts/rocketmq/image_fixtures/iam_init.go "$iam_fixture/main.go"
          cp scripts/rocketmq/image_fixtures/qs_consumer_contract.go "$consumer_fixture/main.go"
          cd .five-sources/qs
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go test -c -tags=integration \
            -ldflags "-X github.com/FangcunMount/qs-server/pkg/version.GitCommit=$QS_SHA" \
            -o "$GITHUB_WORKSPACE/five-qs-init" ./internal/pkg/migration
          go run -ldflags "-X github.com/FangcunMount/qs-server/pkg/version.GitCommit=$QS_SHA" \
            ./scripts/testing/m3_consumer_contract > "$GITHUB_WORKSPACE/qs-consumer-contract.txt"
          cd "$GITHUB_WORKSPACE/.five-sources/iam"
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -o "$GITHUB_WORKSPACE/five-iam-init" ./scripts/testing/m3_five_image_fixture
          cd "$GITHUB_WORKSPACE"
          for binary in five-qs-init five-iam-init; do
            test -z "$(readelf -l "$binary" | sed -n '/INTERP/p')"
          done
      - name: Fixed official Broker dependency
        run: |
          set -euo pipefail
          bash scripts/rocketmq/fetch-release.sh
          docker build --no-cache -t rocketmq-m3-image-start:5.5.1 components/rocketmq
      - name: Actual packagers, 21 synthetic files and eight ordinary runtimes
        run: |
          set -euo pipefail
          umask 077
          uv run --no-project --with pyyaml==6.0.2 --with sqlalchemy==2.0.52 python scripts/rocketmq/five_image_start.py \
            --m4-rebuild --m4-candidate "$PWD/components/rocketmq/m4-final-image-candidates.json" --sources "$PWD/.five-sources" --candidate "$PWD/.five-candidates" \
            --qs-initializer "$PWD/five-qs-init" --iam-initializer "$PWD/five-iam-init" \
            --consumer-contract "$PWD/qs-consumer-contract.txt" --report m4-eight-instance-rebuild.json
      - name: Nonempty native evidence and complete owned cleanup
        if: always()
        run: |
          python3 - <<'PY'
          import json
          x=json.load(open('m4-eight-instance-rebuild.json'))
          assert x['schema']=='m4-eight-instance-config-rebuild/v1'
          assert x['final_candidate'] is True and x['final_candidate_image_runs']['qs-api']=='40352408582'
          assert x['passed']==len(x['cases'])==18 and x['failed']==x['skipped']==0
          assert x['final_python_dependencies']==dict(sdk='0.4.0',nsq_absent=True,tornado_absent=True,current_imports=True)
          assert all(x['cases'].values()) and all(x['cleanup'].values()) and x['sources_unchanged']
          assert len(x['actual_material_mounts'])==len(x['actual_runtime_budgets'])==len(x['processes'])==8
          assert x['m4_material_stage']['files']==21 and x['actual_source_worker_concurrency']==48
          assert x['mysql_runtime_ddl_attempts']==x['mongo_runtime_ddl_attempts']==0
          assert not x['production'] and not x['system_acceptance'] and not x['combined_cutover_rehearsal_complete']
          PY
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: m4-final-eight-instance-rebuild-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            m4-eight-instance-rebuild.json
            m4-binding-codec.json
          if-no-files-found: error
          retention-days: 14
