name: RocketMQ Dashboard private deployment validation
on:
  pull_request:
    paths:
      - components/rocketmq-dashboard/**
      - scripts/dashboard/**
      - .github/workflows/rocketmq-dashboard.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  dashboard:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - name: Compile operational scripts
        run: python3 -m compileall -q scripts/dashboard
      - name: Validate pinned gateway configuration without network or root
        run: |
          image=nginx:1.30.6-alpine@sha256:84ed8c0dd296c188bfc24ed506f46589e9285fb0b11cf3a04d91d524d3067e11
          docker pull "$image"
          docker run --rm --network none --user 10001:10001 --read-only --cap-drop ALL --memory 48m \
            --add-host broker:127.0.0.1 --add-host dashboard:127.0.0.1 \
            --tmpfs /tmp:rw,nosuid,size=8388608,uid=10001,gid=10001 \
            -v "$PWD/components/rocketmq-dashboard/nginx.conf:/etc/nginx/dashboard.conf:ro" \
            --entrypoint nginx "$image" -t -c /etc/nginx/dashboard.conf
      - name: Build verified official Broker 5.5.1 for owned environment
        run: |
          bash scripts/rocketmq/fetch-release.sh
          docker build -t rocketmq-m3-image-start:5.5.1 components/rocketmq
      - name: Actual TLS, ACL, independent login and private relay
        run: python3 scripts/dashboard/native_probe.py
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: dashboard-${{ github.run_id }}
          path: dashboard-probe.json
          if-no-files-found: error
          retention-days: 30
