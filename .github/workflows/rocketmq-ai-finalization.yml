name: RocketMQ AI finalization recovery
on:
  workflow_dispatch:
    inputs:
      ai_ref:
        description: Exact AI recovery candidate source SHA
        type: string
        required: true
        default: 432fe19121c9a6ebd3e80c1f21f51db6eb36d3c5
  pull_request:
    paths: ['scripts/rocketmq/ai_finalization_characterization.py', 'scripts/rocketmq/test_ai_finalization_characterization.py', '.github/workflows/rocketmq-ai-finalization.yml']
permissions:
  contents: read
concurrency:
  group: rocketmq-ai-finalization-${{ github.ref }}
  cancel-in-progress: true
jobs:
  original-worker-mysql:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      mysql:
        image: mysql:8.0.36
        env:
          MYSQL_DATABASE: qs_ai_t18
          MYSQL_USER: qs_ai_t18
          MYSQL_PASSWORD: isolated_t18
          MYSQL_ROOT_PASSWORD: isolated_t18_root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pisolated_t18_root --silent"
          --health-interval=5s --health-timeout=3s --health-retries=30
    env:
      QS_AI_DATABASE_URL: mysql+asyncmy://qs_ai_t18:isolated_t18@127.0.0.1:3306/qs_ai_t18
      QS_AI_TEST_MYSQL_DSN: mysql://qs_ai_t18:isolated_t18@127.0.0.1:3306/qs_ai_t18
      QS_AI_T18_MIGRATION_DATABASE_URL: mysql+asyncmy://root:isolated_t18_root@127.0.0.1:3306/qs_ai_t18
    steps:
      - uses: actions/checkout@v6
      - uses: actions/checkout@v6
        with:
          repository: FangcunMount/qs-ai
          ref: ${{ inputs.ai_ref || '432fe19121c9a6ebd3e80c1f21f51db6eb36d3c5' }}
          path: .ai-acceptance
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.12.13'
          python-version: '3.11'
      - name: Verify strict nonempty receipts and private diagnostics
        run: python3 -m unittest discover -s scripts/rocketmq -p 'test_ai_finalization_characterization.py' -v
      - name: Install exact locked host dependencies
        working-directory: .ai-acceptance
        run: uv sync --locked
      - name: Required original worker MySQL recovery
        env:
          EXPECTED_AI_SHA: ${{ inputs.ai_ref || '432fe19121c9a6ebd3e80c1f21f51db6eb36d3c5' }}
          MYSQL_CONTAINER_ID: ${{ job.services.mysql.id }}
        run: |
          set -euo pipefail
          export QS_AI_T18_MYSQL_IMAGE_ID="$(docker inspect --format '{{.Image}}' "$MYSQL_CONTAINER_ID")"
          cd .ai-acceptance
          uv run python ../scripts/rocketmq/ai_finalization_characterization.py --recovery \
            --source "$PWD" --expected-source "$EXPECTED_AI_SHA" \
            --report "$GITHUB_WORKSPACE/rocketmq-ai-finalization-recovery.json"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: rocketmq-ai-finalization-recovery-${{ github.sha }}
          path: rocketmq-ai-finalization-recovery.json
          if-no-files-found: error
          retention-days: 14
