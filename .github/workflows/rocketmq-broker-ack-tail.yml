name: RocketMQ Broker ACK tail regression
on:
  pull_request:
    paths:
      - "components/rocketmq/**"
      - "scripts/rocketmq/fetch-release.sh"
      - "scripts/rocketmq/f07-ack-tail-fixture/**"
      - ".github/workflows/rocketmq-broker-ack-tail.yml"
  push:
    branches: [main]
    paths:
      - "components/rocketmq/**"
      - "scripts/rocketmq/fetch-release.sh"
      - "scripts/rocketmq/f07-ack-tail-fixture/**"
      - ".github/workflows/rocketmq-broker-ack-tail.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  broker-fixture:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Build stock Broker from the verified release
        run: |
          bash scripts/rocketmq/fetch-release.sh
          docker build -t rocketmq-readable:5.5.1 components/rocketmq
      - name: Verify retry reuse and ACK tail on the patched Broker store
        run: bash scripts/rocketmq/f07-ack-tail-fixture/build.sh
