# 共享网络定义
# 基础设施服务内部通信网络

networks:
  backend:
    name: infra-backend
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: 172.20.0.0/16
          gateway: 172.20.0.1
    driver_opts:
      com.docker.network.bridge.name: infra-backend
      com.docker.network.bridge.enable_icc: "true"
      com.docker.network.driver.mtu: "1500"
    labels:
      - "infra.network=backend"
      - "infra.purpose=internal-services"
