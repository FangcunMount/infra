# 共享网络定义
# 基础设施服务内部通信网络
# 使用 Docker Swarm Overlay 网络实现跨主机容器通信

networks:
  backend:
    name: infra-network
    driver: overlay
    attachable: true  # 允许非 swarm 服务连接
    ipam:
      driver: default
      config:
        - subnet: 172.20.0.0/24
    driver_opts:
      com.docker.network.driver.mtu: "1450"  # overlay 推荐 MTU
      encrypted: "true"  # 跨云场景默认启用数据面加密
    labels:
      - "infra.network=backend"
      - "infra.purpose=internal-services"
      - "infra.network.type=overlay"
