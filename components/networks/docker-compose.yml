# 共享网络定义
# 基础设施服务内部通信网络
# 使用 Docker Swarm Overlay 网络实现跨主机容器通信

networks:
  backend:
    name: infra-network
    driver: overlay
    attachable: true  # 允许非 swarm 服务连接
    ipam:
      driver: default
      config:
        - subnet: 172.20.0.0/24
    driver_opts:
      # Swarm data-path 使用 MTU=1280 的 tailscale0；Docker overlay 端点会扣除
      # 约 50 字节 VXLAN 开销，容器内最终 MTU 约为 1230。
      com.docker.network.driver.mtu: "1280"
      # 不设置 encrypted=true；跨云加密由 Tailscale underlay 承担，避免依赖 ESP/IP protocol 50。
    labels:
      - "infra.network=backend"
      - "infra.purpose=internal-services"
      - "infra.network.type=overlay"
