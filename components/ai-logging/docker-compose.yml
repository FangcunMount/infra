name: ai-logging
services:
  storage-init:
    profiles: [storage]
    image: busybox:1.37.0
    command: [sh, -c, "chown 10001:10001 /loki"]
    volumes: [loki_data:/loki]
    network_mode: none
  loki:
    profiles: [storage]
    depends_on:
      storage-init:
        condition: service_completed_successfully
    image: grafana/loki:3.6.0
    command: [-config.file=/etc/loki/config.yaml]
    restart: unless-stopped
    volumes:
      - ./loki.yaml:/etc/loki/config.yaml:ro
      - loki_data:/loki
    networks: [logs]
    mem_limit: 512m
    cpus: '0.5'
    logging: &rotation
      driver: json-file
      options: {max-size: 10m, max-file: '3'}
  gateway:
    profiles: [storage]
    image: nginx:1.27.5
    restart: unless-stopped
    ports:
      - ${LOGS_BIND_IP:?Set the restricted ingress IP}:18443:8443
    volumes:
      - ./gateway.conf:/etc/nginx/nginx.conf:ro
      - ${LOGS_SERVER_CERT_DIR:?Set logs server certificate directory}:/certs:ro
    networks: [logs]
    mem_limit: 64m
    depends_on: [loki]
    logging: *rotation
  alloy:
    profiles: [collector]
    image: grafana/alloy:v1.11.2
    command: [run, --storage.path=/var/lib/alloy, /etc/alloy/config.alloy]
    restart: unless-stopped
    environment:
      LOKI_WRITE_URL: ${LOKI_WRITE_URL:?Set the TLS log push URL}
    volumes:
      - ./config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - alloy_data:/var/lib/alloy
      - ${LOGS_CLIENT_CERT_DIR:?Set collector certificate directory}:/certs:ro
    mem_limit: 192m
    cpus: '0.25'
    logging: *rotation
networks:
  logs:
    name: ai-logs
    internal: true
volumes:
  loki_data:
  alloy_data:
