events {}
http {
  access_log off;
  server {
    listen 8443 ssl;
    ssl_certificate /certs/logs-fullchain.crt;
    ssl_certificate_key /certs/logs.key;
    ssl_client_certificate /certs/ca-chain.crt;
    ssl_verify_client on;
    ssl_protocols TLSv1.3;
    client_max_body_size 2m;
    location = /loki/api/v1/push {
      limit_except POST { deny all; }
      proxy_pass http://loki:3100;
      proxy_set_header X-Scope-OrgID "";
    }
    location / { return 404; }
  }
}
