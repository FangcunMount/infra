# NSQd 配置文件
# 详细参数说明: https://nsq.io/components/nsqd.html

## 常规选项
# 节点 ID（在集群中需要唯一）
# node_id = 1

## 日志选项
# 日志级别: debug, info, warn, error, fatal
log_level = "info"
# 日志输出路径（空则输出到 stderr）
# log_prefix = "[nsqd] "

## 性能选项
# 内存队列大小（超过后写入磁盘）
# 建议值：3000（平衡内存和性能，避免 OOM）
mem_queue_size = 3000
# 单条消息最大大小（字节）
# 256KB：足够大部分场景，避免内存压力
max_msg_size = 262144
# 消息超时时间
msg_timeout = "60s"
# 最大消息超时时间
max_msg_timeout = "15m"
# 最大请求超时时间
max_req_timeout = "1h"

## 磁盘持久化选项
# 数据存储路径
data_path = "/data"
# 同步到磁盘的频率（消息数量）
sync_every = 2500
# 同步超时时间
sync_timeout = "2s"

## 消息分发选项
# 最大处理中消息数量
max_rdy_count = 2500
# 最大处理中消息数量（每个客户端）
max_output_buffer_size = 65536
# 最大处理中超时时间
max_output_buffer_timeout = "1s"

## 心跳和超时选项
# 客户端超时时间
client_timeout = "60s"
# 心跳间隔
heartbeat_interval = "30s"

## TLS/加密选项（可选）
# tls_cert = "/path/to/cert.pem"
# tls_key = "/path/to/key.pem"
# tls_client_auth_policy = "require-verify"
# tls_root_ca_file = "/path/to/ca.pem"

## 统计选项
# 统计数据上报间隔
statsd_interval = "60s"
# 是否启用统计
e2e_processing_latency_percentile = [1.0, 0.99, 0.95]

## 压缩选项
# 是否启用压缩
deflate = true
max_deflate_level = 6
snappy = true

## 去重选项（需要启用）
# max_msg_dedup_duration = "10m"

## HTTP 选项
# HTTP 客户端连接超时
http_client_connect_timeout = "2s"
# HTTP 客户端请求超时
http_client_request_timeout = "5s"

## 备注
# 大部分选项都有合理的默认值
# 建议只修改必要的参数
# 生产环境建议调整：mem_queue_size, max_msg_size, msg_timeout
