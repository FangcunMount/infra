# NSQLookupd 配置文件
# 详细参数说明: https://nsq.io/components/nsqlookupd.html

## 常规选项
# 日志级别: debug, info, warn, error, fatal
log_level = "info"

## 超时选项
# 生产者不活跃超时时间（超过此时间未收到心跳则移除）
inactive_producer_timeout = "300s"

## 墓碑（Tombstone）选项
# 墓碑生命周期（用于标记已删除的主题/频道）
tombstone_lifetime = "45s"

## TCP 地址广播
# 广播给客户端的 TCP 地址（留空则自动检测）
# broadcast_address = ""

## HTTP 选项
# HTTP 客户端连接超时
http_client_connect_timeout = "2s"
# HTTP 客户端请求超时
http_client_request_timeout = "5s"

## 备注
# nsqlookupd 是无状态的，配置相对简单
# 主要配置项是超时相关参数
