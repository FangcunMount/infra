# NSQAdmin 配置文件
# 详细参数说明: https://nsq.io/components/nsqadmin.html

## 常规选项
# 日志级别: debug, info, warn, error, fatal
log_level = "info"

## 界面选项
# 基础 URL（用于反向代理）
# base_path = "/"

## 通知选项
# HTTP 通知端点（用于接收管理操作通知）
# notification_http_endpoint = ""

## Graphite 集成（可选）
# graphite_url = "http://graphite.example.com"

## 代理 nsqd HTTP 请求
# 允许通过 nsqadmin 代理请求到 nsqd
proxy_graphite = false

## HTTP 选项
# HTTP 客户端连接超时
http_client_connect_timeout = "2s"
# HTTP 客户端请求超时
http_client_request_timeout = "5s"

## 备注
# nsqadmin 主要用于 Web 管理
# 大部分使用默认配置即可
