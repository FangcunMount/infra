# NSQ 消息队列服务

services:
  nsqlookupd:
    image: nsqio/nsq:v1.3.0
    container_name: nsqlookupd
    command: /nsqlookupd --config=/etc/nsq/nsqlookupd.conf
    networks:
      - backend
    ports:
      - "${NSQLOOKUPD_TCP_PORT:-4160}:4160"  # TCP 接口
      - "${NSQLOOKUPD_HTTP_PORT:-4161}:4161"  # HTTP 接口
    restart: always
    volumes:
      # 配置文件（由 init-infrastructure.sh 同步到宿主机 /data/infra/nsq）
      - ${INFRA_DATA_ROOT:-/data/infra}/nsq/nsqlookupd.conf:/etc/nsq/nsqlookupd.conf:ro
    environment:
      - TZ=${TZ:-Asia/Shanghai}
    # 适配 serverD 2C4G 配置
    mem_limit: ${NSQLOOKUPD_MEMORY_LIMIT:-96M}
    cpus: ${NSQLOOKUPD_CPUS:-0.04}
    logging:
      driver: json-file
      options:
        max-size: "100m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:4161/ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    labels:
      - "infra.service=nsq-discovery"
      - "infra.category=messaging"
      - "infra.component=nsqlookupd"
      - "infra.host=${INFRA_HOST_LABEL:-serverD}"

  nsqd:
    image: nsqio/nsq:v1.3.0
    container_name: nsqd
    command: >
      /nsqd
      --config=/etc/nsq/nsqd.conf
      --lookupd-tcp-address=nsqlookupd:${NSQLOOKUPD_TCP_PORT:-4160}
      --broadcast-address=${NSQD_BROADCAST_ADDRESS:-nsqd}
    networks:
      - backend
    ports:
      - "${NSQD_TCP_PORT:-4150}:4150"  # TCP 接口（客户端连接）
      - "${NSQD_HTTP_PORT:-4151}:4151"  # HTTP 接口（管理和统计）
    restart: always
    volumes:
      # 配置文件（由 init-infrastructure.sh 同步到宿主机 /data/infra/nsq）
      - ${INFRA_DATA_ROOT:-/data/infra}/nsq/nsqd.conf:/etc/nsq/nsqd.conf:ro
      # 数据持久化
      - ${INFRA_DATA_ROOT:-/data/infra}/nsq/data:/data
    environment:
      - TZ=${TZ:-Asia/Shanghai}
    depends_on:
      nsqlookupd:
        condition: service_healthy
    # 适配 serverD 2C4G 配置
    mem_limit: ${NSQD_MEMORY_LIMIT:-384M}
    cpus: ${NSQD_CPUS:-0.20}
    logging:
      driver: json-file
      options:
        max-size: "100m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:4151/ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    labels:
      - "infra.service=nsq-daemon"
      - "infra.category=messaging"
      - "infra.component=nsqd"
      - "infra.host=${INFRA_HOST_LABEL:-serverD}"

  nsqadmin:
    image: nsqio/nsq:v1.3.0
    container_name: nsqadmin
    command: >
      /nsqadmin
      --config=/etc/nsq/nsqadmin.conf
      --lookupd-http-address=nsqlookupd:4161
    networks:
      - backend
    ports:
      - "127.0.0.1:${NSQADMIN_PORT:-4171}:4171"  # Web 管理界面（仅本机访问）
    restart: always
    volumes:
      # 配置文件（由 init-infrastructure.sh 同步到宿主机 /data/infra/nsq）
      - ${INFRA_DATA_ROOT:-/data/infra}/nsq/nsqadmin.conf:/etc/nsq/nsqadmin.conf:ro
    environment:
      - TZ=${TZ:-Asia/Shanghai}
    depends_on:
      nsqlookupd:
        condition: service_healthy
    # 适配 serverD 2C4G 配置
    mem_limit: ${NSQADMIN_MEMORY_LIMIT:-96M}
    cpus: ${NSQADMIN_CPUS:-0.04}
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:4171/ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    labels:
      - "infra.service=nsq-admin"
      - "infra.category=messaging"
      - "infra.component=nsqadmin"
      - "infra.host=${INFRA_HOST_LABEL:-serverD}"

# 使用外部网络（共享），宿主机目录显式绑定到 /data/infra/nsq
networks:
  backend:
    external: true
    name: infra-network
