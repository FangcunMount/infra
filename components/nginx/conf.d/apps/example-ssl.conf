# SSL 配置示例
# 使用 infra 统一管理的 SSL 证书

server {
    listen 443 ssl http2;
    server_name blog.yangshujie.com;
    
    # SSL 证书配置（由 infra ssl-manager.sh 管理）
    ssl_certificate /data/ssl/certs/blog.yangshujie.com.crt;
    ssl_certificate_key /data/ssl/private/blog.yangshujie.com.key;
    
    # SSL 安全配置
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-RSA-AES128-GCM-SHA256:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-RSA-AES128-SHA256:ECDHE-RSA-AES256-SHA384:ECDHE-RSA-AES128-SHA:ECDHE-RSA-AES256-SHA:DHE-RSA-AES128-SHA256:DHE-RSA-AES256-SHA256:AES128-GCM-SHA256:AES256-GCM-SHA384:AES128-SHA256:AES256-SHA256:AES128-SHA:AES256-SHA:DES-CBC3-SHA;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 5m;
    
    # HSTS
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: https:; script-src 'self'; style-src 'self' 'unsafe-inline'" always;
    
    # 其他安全头
    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    
    # 应用配置
    location / {
        proxy_cache app_cache;
        proxy_pass http://blog-backend:3000;
    }

    location /api/ {
        limit_req zone=api burst=50 nodelay;
        proxy_cache app_cache;
        proxy_pass http://blog-backend:3000;
    }

    location /upload/ {
        client_max_body_size 50m;
        limit_req zone=upload burst=10 nodelay;
        proxy_pass http://blog-backend:3000;
    }
    
    # 静态文件
    location /static/ {
        root /data/static/blog;
        expires 7d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }
}

# HTTP 重定向到 HTTPS
server {
    listen 80;
    server_name blog.yangshujie.com;
    
    # Let's Encrypt 验证路径
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    
    # 其他请求重定向到 HTTPS
    location / {
        return 301 https://$server_name$request_uri;
    }
}
