# Nginx 网关服务

services:
  nginx:
    image: nginx:1.27
    container_name: nginx
    networks:
      - backend
    restart: always
    ports:
      # 显式绑定到 0.0.0.0，避免仅绑定到回环地址 (127.0.0.1)
      - "0.0.0.0:${NGINX_HTTP_PORT:-80}:80"
      - "0.0.0.0:${NGINX_HTTPS_PORT:-443}:443"
    volumes:
      # 基础配置文件（相对 components/ 目录，兼容多 compose 文件合并）
      - ../nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ../nginx/conf.d:/etc/nginx/conf.d:ro
      # 日志
      - ${INFRA_LOG_ROOT:-/data/logs}/nginx:/data/log/nginx
      # SSL 证书目录
      - /data/ssl:/data/ssl:ro
      # 应用配置目录（应用项目部署时复制配置文件到此目录）
      - /data/apps/nginx-configs:/etc/nginx/conf.d/apps:ro
      # Let's Encrypt 验证目录
      - /var/www/certbot:/var/www/certbot
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1/healthz || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
    ulimits:
      nofile: 100000
    mem_limit: ${NGINX_MEMORY_LIMIT:-1g}
    cpus: ${NGINX_CPUS:-1}
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "3"
    labels:
      - "infra.service=gateway"
      - "infra.category=network"
      - "infra.host=${INFRA_HOST_LABEL:-serverA}"

# 使用外部网络（共享），宿主机目录显式绑定到 /data
networks:
  backend:
    external: true
    name: infra-network
