server {
    listen 443 ssl http2;
    server_name grafana.fangcunmount.cn;

    ssl_certificate /data/ssl/certs/fangcunmount.cn.crt;
    ssl_certificate_key /data/ssl/private/fangcunmount.cn.key;

    location / {
        set $grafana_upstream http://grafana:3000;
        proxy_pass $grafana_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }
}

server {
    listen 80;
    server_name grafana.fangcunmount.cn;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$server_name$request_uri;
    }
}
