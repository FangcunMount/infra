############################################
# redis-store (状态仓) 专用配置 - Redis 7.x #
# 目标：可恢复、不被淘汰、低抖动、易排障
############################################

########## 基础 ##########
# 仅示例：生产建议绑定内网 IP；容器内可省略 bind。
# bind 10.0.0.5
protected-mode yes
port 6380
tcp-backlog 511
# 长连接/连接池，保持 0
timeout 0
tcp-keepalive 300
daemonize no
supervised no

# 日志
loglevel notice
# 容器下可用 stdout
# logfile "/var/log/redis/redis-store.log"

# 数据库：强烈建议只用 DB 0，跨业务用 key 前缀隔离
databases 16

########## 安全（按需开启） ##########
# requirepass <YOUR_STRONG_PASSWORD>
# 禁用危险命令（示例，按需开启）
# rename-command FLUSHALL ""
# rename-command FLUSHDB  ""
# rename-command CONFIG   ""
# rename-command SHUTDOWN ""

########## 内存与淘汰 ##########
# 由启动参数控制（见 docker-compose.yml 和 .env）
# maxmemory 由 REDIS_STORE_MAXMEMORY 环境变量控制
# 关键：禁止静默淘汰
maxmemory-policy noeviction
maxmemory-eviction-tenacity 10

########## 持久化（AOF 为主，RDB 辅助） ##########
# AOF：重启可恢复，everysec 折中持久性与吞吐
appendonly yes
appendfilename "appendonly.aof"
appenddirname "appendonlydir"
appendfsync everysec
no-appendfsync-on-rewrite yes
aof-use-rdb-preamble yes
aof-rewrite-incremental-fsync yes
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb

# 可选 RDB（加快冷启动/备份）
save 900 1
save 300 10
save 60 10000
stop-writes-on-bgsave-error yes
rdbcompression yes
rdbchecksum yes
dbfilename "dump.rdb"
# 按你的部署调整
dir "/data"

########## 过期 & 释放路径优化（降低抖动） ##########
# 更积极清理过期键
active-expire-effort 3
lazyfree-lazy-expire yes
lazyfree-lazy-eviction yes
lazyfree-lazy-user-del yes
lazyfree-lazy-server-del no

########## 碎片整理（长跑更稳） ##########
activedefrag yes
active-defrag-ignore-bytes 1048576
active-defrag-threshold-lower 10
active-defrag-threshold-upper 100
active-defrag-cycle-min 1
active-defrag-cycle-interval 25
active-defrag-cycle-max 25

########## 性能细项 ##########
hz 10
dynamic-hz yes
# 只读重 IO 才考虑开启
io-threads 0
# io-threads-do-reads yes

########## 慢日志 / 延迟排障 ##########
# ≥10ms 记慢日志
slowlog-log-slower-than 10000
slowlog-max-len 2048
# 需要时改成 100~250us 观察
latency-monitor-threshold 0

########## Keyspace 事件（可选） ##########
# 仅当你需要感知过期事件时开启，开销可控
# notify-keyspace-events Ex

########## 复制/哨兵/集群（按需） ##########
# replicaof <primary-host> <port>
# masterauth <PASSWORD>
repl-diskless-sync yes
repl-diskless-sync-delay 5
repl-backlog-size 64mb
# cluster-enabled yes
# cluster-config-file nodes.conf
# cluster-node-timeout 15000

########## 客户端输出缓冲（默认即可） ##########
client-output-buffer-limit normal 0 0 0
client-output-buffer-limit replica 256mb 64mb 60
client-output-buffer-limit pubsub 32mb 8mb 60
