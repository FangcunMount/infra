############################################
# Redis 单实例生产配置
# - 同时服务缓存与状态（AOF 持久化）
# - Redis 7.x
############################################

########## 基础 ##########
# 生产建议仅绑定内网；容器内可省略 bind。
# bind 10.0.0.5
# 在 Docker 内网环境中，使用 ACL 管理用户权限，关闭 protected-mode
protected-mode no
port 6379
tcp-backlog 511
# 长连接/连接池，保持 0
timeout 0
tcp-keepalive 300
daemonize no
supervised no

# 禁用 locale-collate（Alpine 容器中不支持 zh_CN.UTF-8）
locale-collate ""

# 日志
loglevel notice
# 容器下用 stdout
# logfile "/var/log/redis/redis-cache.log"

# 数据库：建议只用 DB0，跨业务用 key 前缀隔离
databases 16

########## 安全 ##########
# 使用 ACL 文件管理用户权限（推荐方式）
aclfile /etc/redis/users.acl

# 禁危险命令（可选）
# rename-command FLUSHALL ""
# rename-command FLUSHDB  ""
# rename-command CONFIG   ""
# rename-command SHUTDOWN ""

########## 内存与淘汰（核心） ##########
# 由启动参数控制（见 docker-compose.yml 和 .env）
# maxmemory 由 REDIS_CACHE_MAXMEMORY 环境变量控制
# maxmemory-policy 由 REDIS_CACHE_POLICY 环境变量控制
maxmemory-eviction-tenacity 10

########## 持久化（开启） ##########
# AOF + 定期 RDB，折中持久性与恢复速度
appendonly yes
appendfilename "appendonly.aof"
appenddirname "appendonlydir"
appendfsync everysec
no-appendfsync-on-rewrite yes
aof-use-rdb-preamble yes
aof-rewrite-incremental-fsync yes
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb

save 900 1
save 300 10
save 60 10000
stop-writes-on-bgsave-error yes
rdbcompression yes
rdbchecksum yes
dbfilename "dump.rdb"

########## 过期与释放优化 ##########
# 缓存也可能大量过期，打开懒释放降低抖动
active-expire-effort 2
lazyfree-lazy-expire yes
lazyfree-lazy-eviction yes
lazyfree-lazy-user-del yes
lazyfree-lazy-server-del no

########## 碎片整理（长跑更稳） ##########
activedefrag yes
active-defrag-ignore-bytes 1048576
active-defrag-threshold-lower 10
active-defrag-threshold-upper 100
active-defrag-cycle-min 1
active-defrag-cycle-max 25

########## 性能细项 ##########
hz 10
dynamic-hz yes
# 读主导且高并发才考虑开启，设为 1 表示禁用多线程(单线程模式)
io-threads 1
# io-threads-do-reads yes

########## 慢日志 / 延迟排障 ##########
slowlog-log-slower-than 10000
slowlog-max-len 1024
latency-monitor-threshold 0

########## Keyspace 事件（默认关闭，确有需要再开） ##########
# notify-keyspace-events ""

########## 复制/哨兵/集群（按需） ##########
# replicaof <primary-host> <port>
# masterauth <PASSWORD>
repl-diskless-sync yes
repl-diskless-sync-delay 5
repl-backlog-size 64mb
# cluster-enabled yes
# cluster-config-file nodes.conf
# cluster-node-timeout 15000

########## 客户端输出缓冲 ##########
client-output-buffer-limit normal 0 0 0
client-output-buffer-limit replica 256mb 64mb 60
client-output-buffer-limit pubsub 32mb 8mb 60

########## 运行目录（即便不持久化也需有效目录） ##########
dir "/data"
