# Redis 单实例服务
# - redis-cache: 统一的缓存/状态实例（可持久化）

services:
  redis-cache:
    image: redis:7
    container_name: redis-cache
    networks:
      - backend
    restart: unless-stopped
    ports:
      - "${REDIS_CACHE_PORT:-6379}:6379"
    volumes:
      # 配置文件
      - ./redis-cache.conf:/usr/local/etc/redis/redis-cache.conf:ro
      # ACL 用户文件（由 make install 生成）
      - ./users.acl:/etc/redis/users.acl:ro
      # 数据目录（AOF/RDB 均会写入此目录）
      - redis_cache_data:/data
    command: >
      redis-server /usr/local/etc/redis/redis-cache.conf
      --maxmemory "${REDIS_CACHE_MAXMEMORY:-256mb}"
      --maxmemory-policy "${REDIS_CACHE_POLICY:-volatile-lru}"
      --appendonly yes
      --appendfsync everysec
      --save 900 1
      --save 300 10
    ulimits:
      nofile: 65535
    sysctls:
      net.core.somaxconn: "65535"
    # 单实例：256MB 数据上限（适配 serverA 2C4G）
    mem_limit: ${REDIS_CACHE_MEM_LIMIT:-256m}
    cpus: ${REDIS_CACHE_CPUS:-0.15}
    stop_grace_period: 10s
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -h 127.0.0.1 -p 6379 --user admin --pass ${REDIS_ADMIN_PASSWORD:-change_me_admin_pass} ping | grep PONG"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "100m"
        max-file: "3"
    labels:
      - "infra.service=redis"
      - "infra.category=storage"
      - "infra.instance=redis-cache"
      - "infra.host=serverA"

# 使用外部网络（共享）和本地数据卷（组件独有）
networks:
  backend:
    external: true
    name: infra-network

volumes:
  redis_cache_data:
    name: infra_redis_cache_data
    driver: local
  redisinsight_data:
    name: infra_redisinsight_data
    driver: local
