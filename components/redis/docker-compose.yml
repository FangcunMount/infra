# Redis 双实例服务
# - redis-cache: 纯缓存实例（可淘汰、不持久化）
# - redis-store: 存储实例（不淘汰、AOF 持久化）

services:
  redis-cache:
    image: redis:7
    container_name: redis-cache
    networks:
      - backend
    restart: unless-stopped
    ports:
      - "${REDIS_CACHE_PORT:-6379}:6379"
    volumes:
      # 配置文件
      - ./redis-cache.conf:/usr/local/etc/redis/redis-cache.conf:ro
      # 数据目录（缓存实例无需持久化，但保留目录用于临时文件）
      - redis_cache_data:/data
    command: >
      redis-server /usr/local/etc/redis/redis-cache.conf
      --requirepass "${REDIS_CACHE_PASSWORD}"
      --maxmemory "${REDIS_CACHE_MAXMEMORY:-256mb}"
      --maxmemory-policy "${REDIS_CACHE_POLICY:-allkeys-lfu}"
      --save ""
      --appendonly no
    environment:
      - REDIS_PASSWORD=${REDIS_CACHE_PASSWORD}
    ulimits:
      nofile: 65535
    sysctls:
      net.core.somaxconn: "65535"
    # 纯缓存：256MB 数据上限；给 1.5x 余量防止 fork/COW 抖动
    mem_limit: ${REDIS_CACHE_MEM_LIMIT:-400m}
    cpus: ${REDIS_CACHE_CPUS:-0.20}
    stop_grace_period: 10s
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a ${REDIS_CACHE_PASSWORD} -h 127.0.0.1 -p 6379 ping | grep PONG"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "100m"
        max-file: "3"
    labels:
      - "infra.service=cache"
      - "infra.category=storage"
      - "infra.instance=redis-cache"
      - "infra.host=serverA"

  redis-store:
    image: redis:7
    container_name: redis-store
    networks:
      - backend
    restart: unless-stopped
    ports:
      - "${REDIS_STORE_PORT:-6380}:6380"
    volumes:
      # 配置文件
      - ./redis-store.conf:/usr/local/etc/redis/redis-store.conf:ro
      # 数据持久化（AOF 文件）
      - redis_store_data:/data
    command: >
      redis-server /usr/local/etc/redis/redis-store.conf
      --requirepass "${REDIS_STORE_PASSWORD}"
      --maxmemory "${REDIS_STORE_MAXMEMORY:-192mb}"
      --maxmemory-policy noeviction
      --save ""
      --appendonly yes
      --appendfsync everysec
      --no-appendfsync-on-rewrite yes
      --aof-use-rdb-preamble yes
    environment:
      - REDIS_PASSWORD=${REDIS_STORE_PASSWORD}
    ulimits:
      nofile: 65535
    sysctls:
      net.core.somaxconn: "65535"
    # 关键键：noeviction + AOF；128–256MB 数据，给 1.5x+ 余量
    mem_limit: ${REDIS_STORE_MEM_LIMIT:-350m}
    cpus: ${REDIS_STORE_CPUS:-0.15}
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a ${REDIS_STORE_PASSWORD} -h 127.0.0.1 -p 6380 ping | grep PONG"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "100m"
        max-file: "3"
    labels:
      - "infra.service=data-store"
      - "infra.category=storage"
      - "infra.instance=redis-store"
      - "infra.host=serverA"

# 使用外部网络（共享）和本地数据卷（组件独有）
networks:
  backend:
    external: true
    name: infra-network

volumes:
  redis_cache_data:
    name: infra_redis_cache_data
    driver: local
  redis_store_data:
    name: infra_redis_store_data
    driver: local
  redisinsight_data:
    name: infra_redisinsight_data
    driver: local

