# Fail closed for this virtual host only; all existing sites remain unchanged.
server {
    listen 80;
    server_name mq.fangcunmount.cn;
    return 301 https://mq.fangcunmount.cn$request_uri;
}
server {
    listen 443 ssl;
    server_name mq.fangcunmount.cn;
    ssl_certificate /data/ssl/certs/fangcunmount.cn.crt;
    ssl_certificate_key /data/ssl/private/fangcunmount.cn.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    add_header Cache-Control no-store always;
    add_header Retry-After 60 always;
    return 503 "Dashboard management is temporarily unavailable.\n";
}
