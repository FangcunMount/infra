# Managed by infra. Dashboard remains on serverD; serverA terminates HTTPS.
limit_req_zone $binary_remote_addr zone=mq_dashboard_login:1m rate=1r/s;
server {
    listen 80;
    server_name mq.fangcunmount.cn;
    return 301 https://mq.fangcunmount.cn$request_uri;
}
server {
    listen 443 ssl;
    server_name mq.fangcunmount.cn;
    ssl_certificate /data/ssl/certs/fangcunmount.cn.crt;
    ssl_certificate_key /data/ssl/private/fangcunmount.cn.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Cache-Control no-store always;
    client_max_body_size 1m;
    proxy_cache off;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Port $server_port;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header Forwarded "";
    proxy_set_header Connection "";
    proxy_connect_timeout 5s;
    proxy_read_timeout 30s;
    location / {
        proxy_pass http://100.118.164.39:18082;
    }
    location = /login/login.do {
        limit_req zone=mq_dashboard_login burst=10 nodelay;
        limit_req_status 429;
        proxy_pass http://100.118.164.39:18082;
    }
}
