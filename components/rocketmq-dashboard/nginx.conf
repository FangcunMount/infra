# The pinned Alpine image compiles stream statically (--with-stream).
worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 128; }
# Byte-transparent relay: Broker's advertised address is already this host's
# Tailscale IP. TLS and ACL remain enforced by the original Broker.
stream {
    server {
        listen 10911;
        proxy_pass broker:10911;
        proxy_connect_timeout 5s;
        proxy_timeout 60s;
    }
}
http {
    access_log off;
    client_body_temp_path /tmp/client;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;
    client_max_body_size 1m;
    server {
        listen 8082;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        location / {
            proxy_pass http://dashboard:8082;
            proxy_set_header Host $host;
            proxy_read_timeout 30s;
            proxy_connect_timeout 5s;
        }
    }
}
