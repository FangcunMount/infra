# MongoDB 7.0 配置文件
# 生产环境优化 - ServerA (2C/4G)
# 内存: 1024M 容器 / 800MB WiredTiger 缓存 (≈78%)

# 网络配置
net:
  port: 27017
  bindIp: 0.0.0.0  # 容器内监听所有接口，由 docker-compose 限制端口绑定到 127.0.0.1
  maxIncomingConnections: 100  # 2C/4G 轻载场景，100 连接足够

# 存储配置
storage:
  dbPath: /data/db
  # MongoDB 7.0+ journal 默认启用，无需显式配置 journal.enabled
  wiredTiger:
    engineConfig:
      cacheSizeGB: 0.8  # 800MB 缓存 (与 mem_limit=1024M 匹配≈78%)
      journalCompressor: snappy
      directoryForIndexes: false
    collectionConfig:
      blockCompressor: snappy
    indexConfig:
      prefixCompression: true

# 系统日志
# 注意：在容器环境中，移除 systemLog 配置让 MongoDB 使用默认输出（stdout）
# 日志通过 Docker logging driver 管理，在 docker-compose.yml 中配置
systemLog:
  verbosity: 0       # 生产环境使用 INFO 级别（0）
  quiet: false
  timeStampFormat: iso8601-utc
  component:
    accessControl:
      verbosity: 1   # 记录认证失败等安全事件
    command:
      verbosity: 0   # 命令执行日志
    write:
      verbosity: 0   # 写操作日志

# 进程管理
processManagement:
  timeZoneInfo: /usr/share/zoneinfo

# 操作分析器（性能监控）
operationProfiling:
  mode: slowOp          # 记录慢查询
  slowOpThresholdMs: 100  # 100ms 阈值，适合 2C/4G 环境

# 安全配置
security:
  # --auth 通过 docker-compose 命令行启用
  # 建议生产环境创建业务用户，限制权限到具体数据库
  authorization: enabled
  keyFile: /etc/mongo/keyfile

# 运行时参数配置
setParameter:
  # 降低诊断数据采集频率，节省 CPU
  diagnosticDataCollectionDirectoryPath: /data/db/diagnostic.data
  diagnosticDataCollectionPeriodMillis: 5000
  # 游标超时（默认 10 分钟，按需调整）
  cursorTimeoutMillis: 600000
  # 注意：连接数限制已在 net.maxIncomingConnections 中配置，不要重复设置

# 复制集配置（单节点副本集，用于启用事务）
replication:
  replSetName: "rs0"
  oplogSizeMB: 512  # 2C/4G 环境适度 oplog

# 分片配置（暂不需要）
# sharding:
#   clusterRole: configsvr
