# MongoDB 文档数据库服务

services:
  mongo:
    image: mongo:7
    container_name: mongo
    networks:
      - backend
    restart: always
    ports:
      # 仅对宿主机本地暴露；跨机器容器访问走 infra-network
      - "127.0.0.1:${MONGO_PORT:-27017}:27017"
    volumes:
      # 数据持久化
      - ${INFRA_DATA_ROOT:-/data/infra}/mongo/data:/data/db
      # 副本集内部认证 keyFile（由启动脚本在宿主机上准备）
      - ${INFRA_DATA_ROOT:-/data/infra}/mongo/config/replset.key:/etc/mongo/keyfile:ro
      # 配置文件（由 init-infrastructure.sh 同步到宿主机 /data/infra/mongo/conf）
      - ${INFRA_DATA_ROOT:-/data/infra}/mongo/conf/mongod.conf:/etc/mongod.conf:ro
      # 初始化脚本（仅首次启动时执行）
      - ${INFRA_DATA_ROOT:-/data/infra}/mongo/conf/init-mongo.js:/docker-entrypoint-initdb.d/init-mongo.js:ro
    environment:
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_INITDB_ROOT_USERNAME}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_INITDB_ROOT_PASSWORD}
      - MONGO_INITDB_DATABASE=${MONGO_DATABASE}
      # 业务用户配置（初始化脚本使用）
      - MONGO_APP_USER=${MONGO_APP_USER:-app_user}
      - MONGO_APP_PASSWORD=${MONGO_APP_PASSWORD:-dev_app_pass_123}
      - MONGO_READONLY_USER=${MONGO_READONLY_USER:-readonly_user}
      - MONGO_READONLY_PASSWORD=${MONGO_READONLY_PASSWORD:-dev_readonly_pass_123}
    command: >
      mongod --config /etc/mongod.conf --auth
    ulimits:
      nofile: 100000
    # serverC 独占 Mongo，默认给出较高资源上限，但仍预留宿主机余量
    mem_limit: ${MONGO_MEMORY_LIMIT:-3072M}
    cpus: ${MONGO_CPUS:-3.00}
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", 
             "-u", "${MONGO_INITDB_ROOT_USERNAME}", 
             "-p", "${MONGO_INITDB_ROOT_PASSWORD}", 
             "--authenticationDatabase", "admin",
             "--eval", "db.adminCommand({ ping: 1 })"]
      interval: 30s
      timeout: 10s
      retries: 3
    labels:
      - "infra.service=document-db"
      - "infra.category=storage"
      - "infra.host=${INFRA_HOST_LABEL:-serverC}"

# 使用外部网络（共享），宿主机目录显式绑定到 /data/infra/mongo
networks:
  backend:
    external: true
    name: infra-network
