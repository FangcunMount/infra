# MongoDB 文档数据库服务

services:
  mongo:
    image: mongo:7
    container_name: mongo
    networks:
      - backend
    restart: always
    ports:
      # 仅绑定本地，避免公网暴露（远程访问需通过 SSH 隧道）
      - "127.0.0.1:${MONGO_PORT:-27017}:27017"
    volumes:
      # 数据持久化
      - mongo_data:/data/db
      # 配置文件（相对路径）
      - ./mongod.conf:/etc/mongod.conf:ro
      # 初始化脚本（仅首次启动时执行）
      - ./init-mongo.js:/docker-entrypoint-initdb.d/init-mongo.js:ro
    environment:
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_INITDB_ROOT_USERNAME}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_INITDB_ROOT_PASSWORD}
      - MONGO_INITDB_DATABASE=${MONGO_DATABASE}
      # 业务用户配置（初始化脚本使用）
      - MONGO_APP_USER=${MONGO_APP_USER:-app_user}
      - MONGO_APP_PASSWORD=${MONGO_APP_PASSWORD:-dev_app_pass_123}
      - MONGO_READONLY_USER=${MONGO_READONLY_USER:-readonly_user}
      - MONGO_READONLY_PASSWORD=${MONGO_READONLY_PASSWORD:-dev_readonly_pass_123}
    command: >
      mongod --config /etc/mongod.conf --auth
    ulimits:
      nofile: 100000
    # 适配 serverA 2C4G 配置
    mem_limit: ${MONGO_MEMORY_LIMIT:-1024M}
    cpus: ${MONGO_CPUS:-0.50}
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", 
             "-u", "${MONGO_INITDB_ROOT_USERNAME}", 
             "-p", "${MONGO_INITDB_ROOT_PASSWORD}", 
             "--authenticationDatabase", "admin",
             "--eval", "db.adminCommand({ ping: 1 })"]
      interval: 30s
      timeout: 10s
      retries: 3
    labels:
      - "infra.service=document-db"
      - "infra.category=storage"
      - "infra.host=serverA"

# 使用外部网络（共享）和本地数据卷（组件独有）
networks:
  backend:
    external: true
    name: infra-network

volumes:
  mongo_data:
    name: infra_mongo_data
    driver: local
