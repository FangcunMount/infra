server {
    listen 443 ssl;
    http2 on;
    server_name sonar.fangcunmount.cn;

    ssl_certificate /data/ssl/certs/fangcunmount.cn.crt;
    ssl_certificate_key /data/ssl/private/fangcunmount.cn.key;

    client_max_body_size 50m;

    location / {
        # SonarQube 运行在 Mac mini；serverA 通过 Tailscale 访问。
        # Mac mini Tailscale IP: 100.126.200.55
        set $sonarqube_upstream http://100.126.200.55:9000;
        proxy_pass $sonarqube_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }
}

server {
    listen 80;
    server_name sonar.fangcunmount.cn;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$server_name$request_uri;
    }
}
