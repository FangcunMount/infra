# SonarQube 代码质量平台（含 PostgreSQL）

services:
  sonarqube-db:
    image: postgres:16-alpine
    container_name: sonarqube-db
    networks:
      - backend
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${SONAR_DB_USER:-sonar}
      POSTGRES_PASSWORD: ${SONAR_DB_PASSWORD}
      POSTGRES_DB: ${SONAR_DB_NAME:-sonar}
    volumes:
      - sonarqube_db_data:/var/lib/postgresql/data
    mem_limit: ${SONAR_DB_MEMORY_LIMIT:-256M}
    cpus: ${SONAR_DB_CPUS:-0.15}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sonar -d sonar"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"
    labels:
      - "infra.service=sonarqube-db"
      - "infra.category=devtools"
      - "infra.host=${INFRA_HOST_LABEL:-serverD}"

  sonarqube:
    image: sonarqube:25.2.0.102705-community
    container_name: sonarqube
    networks:
      - backend
    restart: unless-stopped
    depends_on:
      sonarqube-db:
        condition: service_healthy
    environment:
      SONAR_JDBC_URL: jdbc:postgresql://sonarqube-db:5432/${SONAR_DB_NAME:-sonar}
      SONAR_JDBC_USERNAME: ${SONAR_DB_USER:-sonar}
      SONAR_JDBC_PASSWORD: ${SONAR_DB_PASSWORD}
      SONAR_WEB_JAVAOPTS: ${SONAR_WEB_JAVAOPTS:--Xmx512m -Xms256m}
      SONAR_CE_JAVAOPTS: ${SONAR_CE_JAVAOPTS:--Xmx512m -Xms256m}
    volumes:
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_logs:/opt/sonarqube/logs
      - sonarqube_extensions:/opt/sonarqube/extensions
    mem_limit: ${SONAR_MEMORY_LIMIT:-1536M}
    cpus: ${SONAR_CPUS:-0.50}
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:9000/api/system/status | grep -q UP"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 120s
    logging:
      driver: json-file
      options:
        max-size: "100m"
        max-file: "3"
    labels:
      - "infra.service=sonarqube"
      - "infra.category=devtools"
      - "infra.host=${INFRA_HOST_LABEL:-serverD}"

networks:
  backend:
    external: true
    name: infra-network

volumes:
  sonarqube_db_data:
    name: infra_sonarqube_db_data
    driver: local
  sonarqube_data:
    name: infra_sonarqube_data
    driver: local
  sonarqube_logs:
    name: infra_sonarqube_logs
    driver: local
  sonarqube_extensions:
    name: infra_sonarqube_extensions
    driver: local
