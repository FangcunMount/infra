groups:
- name: rocketmq-transactions
  interval: 30s
  rules:
  - alert: RocketMQTransactionObservationUnavailable
    expr: (reliable_messaging_transaction_observation_available == 0) or (reliable_messaging_transaction_observation_fresh
      == 0)
    labels:
      severity: warning
      subsystem: messaging
    annotations:
      summary: Transaction protocol observation unavailable
      description: New sends must remain paused. Inspect the primary-store binding, sampler and actual in-flight
        work; failed reads do not mean zero responsibility.
    for: 2m
  - alert: RocketMQTransactionConfirmationObservationAged
    expr: (reliable_messaging_transaction_oldest_confirmation_observation_age_seconds >= 120) and (reliable_messaging_transaction_confirmation_gap_branches
      > 0) and (reliable_messaging_transaction_observation_fresh == 1)
    labels:
      severity: warning
      subsystem: messaging
    annotations:
      summary: Transaction confirmation audit gap exceeds warning age
      description: Inspect exact original witnesses and positive recovery RPC audits. This is observation debt,
        not exact Broker backlog or permission to rerun business.
  - alert: RocketMQTransactionPreparationExpired
    expr: (reliable_messaging_transaction_prepared_expiry_age_seconds >= 120) and (reliable_messaging_transaction_preparing_executions
      > 0) and (reliable_messaging_transaction_observation_fresh == 1)
    labels:
      severity: warning
      subsystem: messaging
    annotations:
      summary: Transaction preparation remains expired
      description: Inspect exact execution and bounded abort maintenance. Lease expiry alone is not rollback evidence
        or permission to repeat the executor.
  - alert: RocketMQTransactionAdmissionProtected
    expr: reliable_messaging_transaction_admission_protected == 1
    labels:
      severity: critical
      subsystem: messaging
    annotations:
      summary: Transaction owner admission protection latched
      description: Retain Checker and primary dependencies. Resolve exact responsibility, record a matching generation
        and named review, then explicitly restore admission; do not switch providers.
  - alert: RocketMQTransactionCheckerSaturated
    expr: ((reliable_messaging_transaction_running_checks + reliable_messaging_transaction_queued_checks) >= (reliable_messaging_transaction_check_workers_limit
      + reliable_messaging_transaction_check_queue_limit)) and (reliable_messaging_transaction_check_workers_limit
      > 0) and (reliable_messaging_transaction_sdk_stopping == 0)
    labels:
      severity: critical
      subsystem: messaging
    annotations:
      summary: Transaction Checker capacity continuously saturated
      description: Preserve the existing shared owner budget and still-running work. Inspect database and RPC completion
        before reviewing protection; cancellation does not release actual capacity.
    for: 2m
  - alert: RocketMQTransactionEvidenceUnsafe
    expr: (reliable_messaging_transaction_metadata_conflicts > 0) or (reliable_messaging_transaction_unaged_confirmation_gap_branches
      > 0) or (reliable_messaging_transaction_unobserved_committed_branches > 0)
    labels:
      severity: critical
      subsystem: messaging
    annotations:
      summary: Transaction protocol evidence requires review
      description: Refuse new owner executions and inspect exact persistent binding and witnesses. Do not synthesize
        a positive confirmation or discard unclassified evidence.
  - alert: RocketMQTransactionRecoveryAuditFailure
    expr: increase(reliable_messaging_transaction_recovery_audits_total{outcome=~"error|unsupported"}[5m]) > 0
    labels:
      severity: critical
      subsystem: messaging
    annotations:
      summary: Transaction positive recovery audit failed
      description: A Broker acknowledgement and audit persistence are separate. Keep the original reference and
        terminal evidence; use named recovery rather than business or model replay.
  - alert: RocketMQTransactionInvalidCheck
    expr: increase(reliable_messaging_transaction_checks_total{outcome="invalid"}[5m]) > 0
    labels:
      severity: critical
      subsystem: messaging
    annotations:
      summary: Transaction owner rejected invalid recovery evidence
      description: Inspect owner, route, wire hash and primary binding; retain Checker. Review only the matching
        protection generation with fresh authoritative evidence.
