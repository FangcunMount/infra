# Prometheus 监控服务

services:
  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: prometheus
    user: "0:0"
    networks:
      - backend
    restart: unless-stopped
    volumes:
      - ${PROMETHEUS_CONFIG_TEMPLATE_PATH:-/data/infra/prometheus/prometheus.yml.tmpl}:/etc/prometheus/prometheus.yml.tmpl:ro
      - ${PROMETHEUS_RULES_PATH:-/data/infra/prometheus/rules}:/etc/prometheus/rules:ro
      - prometheus_data:/prometheus
      - /var/run/docker.sock:/var/run/docker.sock:ro
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        sed \
          -e "s|\$${PROMETHEUS_SCRAPE_INTERVAL}|$${PROMETHEUS_SCRAPE_INTERVAL:-15s}|g" \
          -e "s|\$${PROMETHEUS_QS_APISERVER_TARGET}|$${PROMETHEUS_QS_APISERVER_TARGET:-qs-apiserver:8080}|g" \
          -e "s|\$${PROMETHEUS_QS_COLLECTION_TARGET}|$${PROMETHEUS_QS_COLLECTION_TARGET:-qs-collection-server:8080}|g" \
          -e "s|\$${PROMETHEUS_QS_WORKER_TARGET}|$${PROMETHEUS_QS_WORKER_TARGET:-qs-worker:9092}|g" \
          /etc/prometheus/prometheus.yml.tmpl > /tmp/prometheus.yml && \
        exec /bin/prometheus \
          --config.file=/tmp/prometheus.yml \
          --storage.tsdb.path=/prometheus \
          --storage.tsdb.retention.time=$${PROMETHEUS_RETENTION_TIME:-15d} \
          --web.enable-lifecycle
    mem_limit: ${PROMETHEUS_MEMORY_LIMIT:-512M}
    cpus: ${PROMETHEUS_CPUS:-0.25}
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:9090/-/healthy | grep -q Prometheus"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "100m"
        max-file: "3"
    labels:
      - "infra.service=prometheus"
      - "infra.category=observability"
      - "infra.host=${INFRA_HOST_LABEL:-serverD}"

networks:
  backend:
    external: true
    name: infra-network

volumes:
  prometheus_data:
    name: infra_prometheus_data
    driver: local
