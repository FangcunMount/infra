global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ['127.0.0.1:9090']
  - job_name: cloud
    scheme: https
    scrape_timeout: 10s
    tls_config:
      server_name: monitoring.fangcunmount.cn
    file_sd_configs:
      - files: ['/etc/prometheus/targets/*.json']
        refresh_interval: 15s
