# Only the Mac mini can scrape these endpoints; no public DNS record is needed.
server {
    listen 443 ssl;
    server_name monitoring.fangcunmount.cn;
    ssl_certificate /data/ssl/certs/fangcunmount.cn.crt;
    ssl_certificate_key /data/ssl/private/fangcunmount.cn.key;
    allow 100.126.200.55;
    deny all;

    location ~ "^/metrics/(?<monitoring_ip>172\.20\.0\.[0-9]{1,3})/(?<monitoring_port>8000|8080|9080|9092)$" {
        limit_except GET { deny all; }
        proxy_pass http://$monitoring_ip:$monitoring_port/metrics;
        proxy_set_header Host $monitoring_ip;
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 10s;
        proxy_buffering off;
    }
    location / { return 404; }
}
