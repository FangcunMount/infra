# Compatibility route for cloud clients that already use prometheus:9090.
# No collection, storage, rules or query engine runs in this cloud container.
events { worker_connections 128; }
http {
    access_log off;
    server {
        listen 9090;
        location / {
            limit_except GET { deny all; }
            proxy_pass http://100.126.200.55:19090;
            proxy_connect_timeout 5s;
            proxy_read_timeout 30s;
            proxy_set_header Connection "";
        }
    }
}
